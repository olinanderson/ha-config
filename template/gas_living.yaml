# ================================
# template/gas_living.yaml
# ================================
# Gas spent on living in the van, as opposed to getting somewhere, in dollars
# per day: the engine's fuel each day (sensor.estimated_fuel_used_total_l, the
# speed-density estimate) plus the Espar hydronic heater's, which burns from
# the same tank but is not in that estimate. Asked 2026-10-16 ("how much money
# I'm spending per day to live in my van on gas"). Price = sensor.regular_gas_price
# (CAD/L, template/gas_price.yaml); every cost is unknown while there is none.
#
# Heater: 0.25 L per hour of switch.a32_pro_switch24_hydronic_heater on-time
# (docs/vehicle-obd.md; the fill-to-fill windows fit 0.15-0.3).
#
# Charging is ESTIMATED, not measured: nothing meters the alternator's share of
# the engine's fuel. 0.75 L per kWh the chargers deliver, from gasoline at
# 8.9 kWh/L, the engine's ~30 % at cruise (BSFC about 270 g/kWh), the
# alternator's ~55 % and the DC-DC chargers' ~90 %. That is the EXTRA fuel while
# driving anyway; charging at idle gets the same rate. Idling does charge, ~1.7 kW
# in the 40 stops of 2+ min from Aug 22 to Oct 17 2026 (~2 kW on the road), but
# idling only to charge spends all of the idle fuel on it, ~2.9 L/h: ~1.7 L/kWh,
# ~1.3 L per 10 % (docs/vehicle-obd.md). Corrected 2026-10-17: this said idling
# hardly charges, from engine-off hours the hourly statistics showed as idle.
#
# Days are HA's days (America/Edmonton), like the recorder's statistics.

# ─── Midnight latches ────────────────────────────────────────────────────────
# "Today" = the lifetime counter minus its value at midnight. A trigger-based
# sensor keeps that value and restores it over a restart; on a template reload
# or a start with nothing restored it latches now, so the first "today" after
# this file is first loaded only counts from then.
- triggers:
    - trigger: time
      at: "00:00:00"
    - trigger: homeassistant
      event: start
    - trigger: event
      event_type: event_template_reloaded
  sensor:
    - name: Engine Fuel at Midnight
      unique_id: engine_fuel_at_midnight
      unit_of_measurement: L
      icon: mdi:gas-station
      state: >
        {% set now_total = states('sensor.estimated_fuel_used_total_l') | float(none) %}
        {% set kept = this.state | float(none) %}
        {{ now_total if trigger.platform == 'time' or kept is none else kept }}
    - name: Heater On-Time at Midnight
      unique_id: heater_on_time_at_midnight
      unit_of_measurement: h
      icon: mdi:radiator
      state: >
        {% set now_total = states('sensor.hydronic_heater_total_on_time') | float(none) %}
        {% set kept = this.state | float(none) %}
        {{ now_total if trigger.platform == 'time' or kept is none else kept }}
    - name: Alternator Energy at Midnight
      unique_id: alternator_energy_at_midnight
      unit_of_measurement: Wh
      icon: mdi:engine
      state: >
        {% set now_total = states('sensor.alternator_charger_energy_wh') | float(none) %}
        {% set kept = this.state | float(none) %}
        {{ now_total if trigger.platform == 'time' or kept is none else kept }}
    - name: Odometer at Midnight
      unique_id: odometer_at_midnight
      unit_of_measurement: km
      icon: mdi:counter
      state: >
        {% set now_total = states('sensor.vehicle_distance_odometer') | float(none) %}
        {% set kept = this.state | float(none) %}
        {{ now_total if trigger.platform == 'time' or kept is none else kept }}

# ─── Today ───────────────────────────────────────────────────────────────────
# Each is unknown (never a fake 0) until its latch exists, and when the counter
# reads below the latch, which means it was reset.
- sensor:
    - name: Engine Fuel Today
      unique_id: engine_fuel_today
      unit_of_measurement: L
      state_class: measurement
      icon: mdi:gas-station
      state: >
        {% set total = states('sensor.estimated_fuel_used_total_l') | float(none) %}
        {% set base = states('sensor.engine_fuel_at_midnight') | float(none) %}
        {{ none if total is none or base is none or total < base - 0.05 else ([total - base, 0] | max) | round(2) }}

    - name: Heater On-Time Today
      unique_id: heater_on_time_today
      unit_of_measurement: h
      state_class: measurement
      icon: mdi:radiator
      state: >
        {% set total = states('sensor.hydronic_heater_total_on_time') | float(none) %}
        {% set base = states('sensor.heater_on_time_at_midnight') | float(none) %}
        {{ none if total is none or base is none or total < base - 0.01 else ([total - base, 0] | max) | round(2) }}

    - name: Heater Fuel Today
      unique_id: heater_fuel_today
      unit_of_measurement: L
      state_class: measurement
      icon: mdi:fire
      state: >
        {% set h = states('sensor.heater_on_time_today') | float(none) %}
        {{ none if h is none else (h * 0.25) | round(2) }}

    - name: Alternator Energy Today
      unique_id: alternator_energy_today
      unit_of_measurement: Wh
      device_class: energy
      state_class: measurement
      icon: mdi:engine
      state: >
        {% set total = states('sensor.alternator_charger_energy_wh') | float(none) %}
        {% set base = states('sensor.alternator_energy_at_midnight') | float(none) %}
        {{ none if total is none or base is none or total < base - 1 else ([total - base, 0] | max) | round(0) }}

    - name: Distance Today
      unique_id: distance_today
      unit_of_measurement: km
      state_class: measurement
      icon: mdi:map-marker-distance
      state: >
        {% set total = states('sensor.vehicle_distance_odometer') | float(none) %}
        {% set base = states('sensor.odometer_at_midnight') | float(none) %}
        {{ none if total is none or base is none or total < base - 0.05 else ([total - base, 0] | max) | round(1) }}

    # Engine + heater, at today's price. The charging share is in the
    # attributes: it is part of the engine's fuel, not on top of it.
    - name: Gas Cost Today
      unique_id: gas_cost_today
      unit_of_measurement: CAD
      state_class: measurement
      icon: mdi:cash
      state: >
        {% set price = states('sensor.regular_gas_price') | float(none) %}
        {% set engine = states('sensor.engine_fuel_today') | float(none) %}
        {% set heater = states('sensor.heater_fuel_today') | float(none) %}
        {{ none if price is none or engine is none or heater is none else ((engine + heater) * price) | round(2) }}
      attributes:
        engine_l: "{{ states('sensor.engine_fuel_today') }}"
        heater_l: "{{ states('sensor.heater_fuel_today') }}"
        heater_h: "{{ states('sensor.heater_on_time_today') }}"
        km: "{{ states('sensor.distance_today') }}"
        engine_cad: >
          {% set price = states('sensor.regular_gas_price') | float(none) %}
          {% set l = states('sensor.engine_fuel_today') | float(none) %}
          {{ none if price is none or l is none else (l * price) | round(2) }}
        heater_cad: >
          {% set price = states('sensor.regular_gas_price') | float(none) %}
          {% set l = states('sensor.heater_fuel_today') | float(none) %}
          {{ none if price is none or l is none else (l * price) | round(2) }}
        charging_cad_est: >
          {% set price = states('sensor.regular_gas_price') | float(none) %}
          {% set wh = states('sensor.alternator_energy_today') | float(none) %}
          {{ none if price is none or wh is none else (wh / 1000 * 0.75 * price) | round(2) }}
        price: "{{ states('sensor.regular_gas_price') }}"

    # Live: the extra gas the chargers cost at their present output (0 with the
    # engine off). Shown next to the drive charge rate on the Van page.
    - name: Charging Gas Cost per Hour
      unique_id: charging_gas_cost_per_hour
      unit_of_measurement: CAD/h
      state_class: measurement
      icon: mdi:cash-clock
      state: >
        {% set price = states('sensor.regular_gas_price') | float(none) %}
        {% set w = states('sensor.alternator_charger_power_24v') | float(none) %}
        {{ none if price is none or w is none else (w / 1000 * 0.75 * price) | round(2) }}
      attributes:
        litres_per_hour: >
          {% set w = states('sensor.alternator_charger_power_24v') | float(none) %}
          {{ none if w is none else (w / 1000 * 0.75) | round(2) }}

    # Reference figure for the battery cards: 10 % of the 7.4 kWh pack (BMS
    # stored energy 7,416 Wh at 99 %, 2026-10-15), charged at ~97 % efficiency,
    # so 0.76 kWh from the chargers = 0.57 L.
    - name: Charging Gas per 10 Percent
      unique_id: charging_gas_per_10_percent
      unit_of_measurement: CAD
      state_class: measurement
      icon: mdi:battery-charging-medium
      state: >
        {% set price = states('sensor.regular_gas_price') | float(none) %}
        {{ none if price is none else (0.74 / 0.97 * 0.75 * price) | round(2) }}
      attributes:
        litres: "{{ (0.74 / 0.97 * 0.75) | round(2) }}"

# ─── The last 7 whole days ───────────────────────────────────────────────────
# From the recorder's long-term statistics (kept for years, unlike states), so
# it is right straight away and after any restart. Refreshed just after
# midnight, at start and on a template reload. The state is the 7-day average
# gas for engine + heater per day at today's price; the attributes carry each
# day, for the Van page's card. The heater's daily hours are the on-time
# counter's max - min within the day.
- triggers:
    - trigger: time
      at: "00:10:00"
    - trigger: homeassistant
      event: start
    - trigger: event
      event_type: event_template_reloaded
  actions:
    - action: recorder.get_statistics
      data:
        statistic_ids:
          - sensor.estimated_fuel_used_total_l
          - sensor.hydronic_heater_total_on_time
          - sensor.alternator_charger_energy_wh
          - sensor.vehicle_distance_odometer
        start_time: "{{ (today_at('00:00') - timedelta(days=7)).isoformat() }}"
        end_time: "{{ today_at('00:00').isoformat() }}"
        period: day
        types:
          - change
          - min
          - max
      response_variable: stats
  sensor:
    - name: Gas Cost per Day 7d
      unique_id: gas_cost_per_day_7d
      unit_of_measurement: CAD/d
      state_class: measurement
      icon: mdi:cash-multiple
      # Only the 7 buckets that start before today: the service also returns
      # the bucket that STARTS at end_time (today, part-way through; seen
      # 2026-10-16), which would otherwise be summed in.
      state: >
        {% set s = stats.statistics %}
        {% set price = states('sensor.regular_gas_price') | float(none) %}
        {% set cutoff = as_timestamp(today_at('00:00')) %}
        {% set ns = namespace(l=0.0, h=0.0) %}
        {% for r in s.get('sensor.estimated_fuel_used_total_l', []) if as_timestamp(r.start) < cutoff %}
          {% set ns.l = ns.l + ([r.change | float(0), 0] | max) %}
        {% endfor %}
        {% for r in s.get('sensor.hydronic_heater_total_on_time', []) if as_timestamp(r.start) < cutoff %}
          {% set ns.h = ns.h + ([(r.max | float(0)) - (r.min | float(0)), 0] | max) %}
        {% endfor %}
        {{ none if price is none else ((ns.l + ns.h * 0.25) / 7 * price) | round(2) }}
      attributes:
        price_used: "{{ states('sensor.regular_gas_price') }}"
        since: "{{ (today_at('00:00') - timedelta(days=7)).date().isoformat() }}"
        until: "{{ (today_at('00:00') - timedelta(days=1)).date().isoformat() }}"
        summary: >
          {% set s = stats.statistics %}
          {% set price = states('sensor.regular_gas_price') | float(0) %}
          {% set cutoff = as_timestamp(today_at('00:00')) %}
          {% set ns = namespace(l=0.0, h=0.0, wh=0.0, km=0.0) %}
          {% for r in s.get('sensor.estimated_fuel_used_total_l', []) if as_timestamp(r.start) < cutoff %}
            {% set ns.l = ns.l + ([r.change | float(0), 0] | max) %}
          {% endfor %}
          {% for r in s.get('sensor.hydronic_heater_total_on_time', []) if as_timestamp(r.start) < cutoff %}
            {% set ns.h = ns.h + ([(r.max | float(0)) - (r.min | float(0)), 0] | max) %}
          {% endfor %}
          {% for r in s.get('sensor.alternator_charger_energy_wh', []) if as_timestamp(r.start) < cutoff %}
            {% set ns.wh = ns.wh + ([r.change | float(0), 0] | max) %}
          {% endfor %}
          {% for r in s.get('sensor.vehicle_distance_odometer', []) if as_timestamp(r.start) < cutoff %}
            {% set ns.km = ns.km + ([r.change | float(0), 0] | max) %}
          {% endfor %}
          {{ dict(engine_l_per_day=(ns.l / 7) | round(2), engine_cad_per_day=(ns.l / 7 * price) | round(2),
                  heater_h_per_day=(ns.h / 7) | round(2), heater_l_per_day=(ns.h * 0.25 / 7) | round(2),
                  heater_cad_per_day=(ns.h * 0.25 / 7 * price) | round(2),
                  alt_kwh_per_day=(ns.wh / 7000) | round(2), charging_cad_per_day=(ns.wh / 7000 * 0.75 * price) | round(2),
                  km_per_day=(ns.km / 7) | round(1)) }}
        days: >
          {% set s = stats.statistics %}
          {% set price = states('sensor.regular_gas_price') | float(0) %}
          {% set ns = namespace(f={}, lo={}, hi={}, a={}, k={}, days=[]) %}
          {% for r in s.get('sensor.estimated_fuel_used_total_l', []) %}
            {% set ns.f = dict(ns.f, **{(as_timestamp(r.start) | int) | string: [r.change | float(0), 0] | max}) %}
          {% endfor %}
          {% for r in s.get('sensor.hydronic_heater_total_on_time', []) %}
            {% set ns.lo = dict(ns.lo, **{(as_timestamp(r.start) | int) | string: r.min | float(0)}) %}
            {% set ns.hi = dict(ns.hi, **{(as_timestamp(r.start) | int) | string: r.max | float(0)}) %}
          {% endfor %}
          {% for r in s.get('sensor.alternator_charger_energy_wh', []) %}
            {% set ns.a = dict(ns.a, **{(as_timestamp(r.start) | int) | string: [r.change | float(0), 0] | max}) %}
          {% endfor %}
          {% for r in s.get('sensor.vehicle_distance_odometer', []) %}
            {% set ns.k = dict(ns.k, **{(as_timestamp(r.start) | int) | string: [r.change | float(0), 0] | max}) %}
          {% endfor %}
          {% for i in range(7) %}
            {% set day = today_at('00:00') - timedelta(days=7 - i) %}
            {% set key = (as_timestamp(day) | int) | string %}
            {% set l = ns.f.get(key, 0) %}
            {% set h = [ns.hi.get(key, 0) - ns.lo.get(key, 0), 0] | max %}
            {% set ns.days = ns.days + [dict(date=day.date().isoformat(), km=ns.k.get(key, 0) | round(0),
                                             engine_l=l | round(1), heater_h=h | round(1),
                                             alt_kwh=(ns.a.get(key, 0) / 1000) | round(2),
                                             cad=((l + h * 0.25) * price) | round(2))] %}
          {% endfor %}
          {{ ns.days }}
