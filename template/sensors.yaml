# ================================
# template/sensors.yaml
# ================================
# Regular (polling) template sensors

- sensor:
    # ─── Last-good value caching ───
    - name: "Ambient Air Temp (last good)"
      unique_id: ambient_air_temp_last
      unit_of_measurement: "°C"
      state: >
        {% if states('sensor.192_168_10_90_46_ambientairtemp') not in ['unknown','unavailable'] %}
          {{ states('sensor.192_168_10_90_46_ambientairtemp') }}
        {% else %}
          {{ this.state if this.state not in ['unknown','unavailable'] else '0' }}
        {% endif %}

    - name: "Coolant Temp (last good)"
      unique_id: coolant_temp_last
      unit_of_measurement: "°C"
      state: >
        {% set v = states('sensor.192_168_10_90_05_enginecoolanttemp') %}
        {% if v not in ['unknown','unavailable'] and v | float(-99) > -39 %}
          {{ v }}
        {% else %}
          {{ this.state if this.state not in ['unknown','unavailable'] else '0' }}
        {% endif %}

    - name: "Road Grade % (last good)"
      unique_id: road_grade_percent_last
      unit_of_measurement: "%"
      state: >
        {% if states('sensor.road_grade') not in ['unknown','unavailable'] %}
          {{ states('sensor.road_grade') }}
        {% else %}
          {{ this.state if this.state not in ['unknown','unavailable'] else '0' }}
        {% endif %}

    # ─── Battery charging / discharging split ───
    - name: "Battery Charging"
      unit_of_measurement: "W"
      state: >
        {% set power = states('sensor.olins_van_bms_power') | float(0) %}
        {{ power if power > 0 else 0 }}

    - name: "Battery Discharging"
      unit_of_measurement: "W"
      state: >
        {% set power = states('sensor.olins_van_bms_power') | float(0) %}
        {{ (power * -1) if power < 0 else 0 }}

    # ─── Starlink throughput (human-readable) ───
    - name: "Starlink Downlink Throughput (Mbps)"
      unique_id: starlink_downlink_throughput_mbps
      unit_of_measurement: "Mbps"
      state: >
        {{ (states('sensor.starlink_downlink_throughput') | float(0) / 1000000) | round(2) }}

    - name: "Starlink Uplink Throughput (Mbps)"
      unique_id: starlink_uplink_throughput_mbps
      unit_of_measurement: "Mbps"
      state: >
        {{ (states('sensor.starlink_uplink_throughput') | float(0) / 1000000) | round(2) }}

    # ─── MPPT solar aggregates ───
    - name: "Total MPPT PV Power"
      unique_id: total_mppt_pv_power
      unit_of_measurement: "W"
      state: >
        {{ (states('sensor.a32_pro_mppt1_pv_power')|float(0) +
            states('sensor.a32_pro_mppt2_pv_power')|float(0))|round(2) }}

    - name: "Average MPPT Output Voltage"
      unique_id: average_mppt_output_voltage
      unit_of_measurement: "V"
      state: >
        {{ ((states('sensor.a32_pro_mppt1_output_voltage')|float(0) +
             states('sensor.a32_pro_mppt2_output_voltage')|float(0)) / 2)|round(2) }}

    - name: "Total MPPT Output Current"
      unique_id: total_mppt_output_current
      unit_of_measurement: "A"
      state: >
        {{ (states('sensor.a32_pro_mppt1_output_current')|float(0) +
            states('sensor.a32_pro_mppt2_output_current')|float(0))|round(2) }}

    - name: "Total MPPT Yield Today"
      unique_id: total_mppt_yield_today
      unit_of_measurement: Wh
      state: >
        {% set mppt1_kwh = states('sensor.a32_pro_mppt1_yield_today')|float(0) %}
        {% set mppt2_kwh = states('sensor.a32_pro_mppt2_yield_today')|float(0) %}
        {{ ((mppt1_kwh + mppt2_kwh) * 1000) | round(2) }}

    # ─── Propane tank calculations ───
    # Standard 20 lb BBQ propane tank with 2:1 ellipsoidal heads
    # Mopeka Pro Check F317 ultrasonic sensor on tank bottom
    # Sensor reports liquid height in mm (HA integration applies propane medium coefficient)
    # Unavailable while the Mopeka is silent (dead CR2032, out of range): its
    # float(0) used to turn "no reading" into 0 %, which looked like an empty
    # tank for two months after the battery died on 2026-07-23.
    - name: Propane Tank Percentage
      unique_id: propane_tank_percentage
      unit_of_measurement: "%"
      availability: "{{ has_value('sensor.pro_check_f317_tank_level') }}"
      state: >
        {% set R      = 149.2 %}
        {% set Ec     = R / 2 %}
        {% set side   = 203.0 %}
        {% set H      = side + 2*Ec %}
        {% set d_raw = states('sensor.pro_check_f317_tank_level') | float(0) %}
        {% set h_liq = [ [ d_raw, 0 ] | max, H ] | min %}
        {% set V_cap  = (2/3) * pi * R**2 * Ec %}
        {% set V_cyl  = side * pi * R**2 %}
        {% set V_max  = 2*V_cap + V_cyl %}
        {% if h_liq <= Ec %}
          {% set V_liq = pi*R**2 * (h_liq**2/Ec - h_liq**3/(3*Ec**2)) %}
        {% elif h_liq <= Ec + side %}
          {% set V_liq = V_cap + (h_liq - Ec)*pi*R**2 %}
        {% else %}
          {% set h2 = h_liq - (Ec + side) %}
          {% set V_liq = V_cap + V_cyl +
                          pi*R**2 * (h2**2/Ec - h2**3/(3*Ec**2)) %}
        {% endif %}
        {{ [ (100 * V_liq / (0.8 * V_max)) | round(1), 100 ] | min }}

    - name: "Propane – Raw Distance"
      unit_of_measurement: mm
      availability: "{{ has_value('sensor.pro_check_f317_tank_level') }}"
      state: "{{ states('sensor.pro_check_f317_tank_level') | float(0) }}"

    - name: "Propane – Liquid Depth"
      unit_of_measurement: mm
      availability: "{{ has_value('sensor.pro_check_f317_tank_level') }}"
      state: "{{ states('sensor.pro_check_f317_tank_level') | float(0) }}"

    - name: "Propane – Liquid Volume"
      unit_of_measurement: L
      availability: "{{ has_value('sensor.pro_check_f317_tank_level') }}"
      state: >
        {% set pct = states('sensor.propane_tank_percentage') | float(0) %}
        {% set R = 149.2 %}
        {% set Ec = R / 2 %}
        {% set side = 203.0 %}
        {% set V_cap = (2/3) * pi * R**2 * Ec %}
        {% set V_cyl = side * pi * R**2 %}
        {% set V_max = 2*V_cap + V_cyl %}
        {{ (pct / 100 * 0.8 * V_max / 1000000) | round(2) }}

    # ─── Power sensors (24V / 12V) ───
    - name: "Air Conditioning Power (24V)"
      unique_id: air_conditioning_power_24v
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      state: >
        {% set current = states('sensor.a32_pro_s5140_channel_4_current_24v_air_conditioning')|float(0) %}
        {% set voltage = states('sensor.olins_van_bms_voltage')|float(0) %}
        {{ ((current | abs) * voltage)|round(2) }}

    - name: "All 24V Devices Power (24V)"
      unique_id: all_24v_devices_power_24v
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      state: >
        {% set current = states('sensor.a32_pro_s5140_channel_5_current_24v_24v_devices')|float(0) %}
        {% set voltage = states('sensor.olins_van_bms_voltage')|float(0) %}
        {{ ((current | abs) * voltage)|round(2) }}

    - name: "All 12V Devices Power (24V)"
      unique_id: all_12v_devices_power_24v
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      state: >
        {% set current = states('sensor.a32_pro_s5140_channel_6_current_24v_12v_devices')|float(0) %}
        {% set voltage = states('sensor.olins_van_bms_voltage')|float(0) %}
        {{ ((current | abs) * voltage)|round(2) }}

    - name: "Inverter Power (24V)"
      unique_id: inverter_power_24v
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      state: >
        {% set current = states('sensor.a32_pro_s5140_channel_7_current_24v_inverter')|float(0) %}
        {% set voltage = states('sensor.olins_van_bms_voltage')|float(0) %}
        {{ ((current | abs) * voltage)|round(2) }}

    - name: "Alternator Charger Power (24V)"
      unique_id: alternator_charger_power_24v
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      state: >
        {% set current = states('sensor.a32_pro_s5140_channel_8_current_24v_alternator_charger')|float(0) %}
        {% set voltage = states('sensor.olins_van_bms_voltage')|float(0) %}
        {{ ((current | abs) * voltage)|round(2) }}

    - name: "Battery Heater Power (12V)"
      unique_id: battery_heater_power_12v
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      state: >
        {% set current = states('sensor.a32_pro_s5140_channel_13_current_12v_battery_heater')|float(0) %}
        {% set voltage = states('sensor.a32_pro_smart_battery_sense_12v_voltage')|float(0) %}
        {{ ((current | abs) * voltage)|round(2) }}

    - name: "Roof Fan Power (12V)"
      unique_id: roof_fan_power_12v
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      state: >
        {% set current = states('sensor.a32_pro_s5140_channel_14_current_12v_roof_fan')|float(0) %}
        {% set voltage = states('sensor.a32_pro_smart_battery_sense_12v_voltage')|float(0) %}
        {{ ((current | abs) * voltage)|round(2) }}

    - name: "Bed Motor Power (24V)"
      unique_id: bed_motor_power_24v
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      state: >
        {% set current = states('sensor.a32_pro_s5140_channel_15_current_24v_bed_motor')|float(0) %}
        {% set voltage = states('sensor.olins_van_bms_voltage')|float(0) %}
        {{ ((current | abs) * voltage)|round(2) }}

    - name: "Shore Power Charger Power (24V)"
      unique_id: shore_power_charger_power_24v
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      state: >
        {% set current = states('sensor.a32_pro_s5140_channel_16_current_24v_shore_power_charger')|float(0) %}
        {% set voltage = states('sensor.olins_van_bms_voltage')|float(0) %}
        {{ ((current | abs) * voltage)|round(2) }}

    - name: Roof Fan Direction
      state: >
        {% set d = state_attr('fan.ag_pro_roof_fan','direction') %}
        {{ 'Exhaust' if d == 'forward' else 'Intake' if d == 'reverse' else 'Unknown' }}

    # ─── Ford-specific computed sensors (WiCAN Pro native integration) ───

    - name: "Transmission Temp (last good)"
      unique_id: trans_temp_last
      unit_of_measurement: "°C"
      icon: mdi:car-cog
      state: >
        {% if states('sensor.192_168_10_90_tran_f_temp') not in ['unknown','unavailable'] %}
          {{ states('sensor.192_168_10_90_tran_f_temp') }}
        {% else %}
          {{ this.state if this.state not in ['unknown','unavailable'] else '0' }}
        {% endif %}

    - name: "Gear Display"
      unique_id: wican_gear_display
      icon: mdi:car-shift-pattern
      state: >
        {% set g = states('sensor.192_168_10_90_gear') | int(-1) %}
        {% if g == 0 %}Park
        {% elif g == 255 %}Reverse
        {% elif g >= 1 and g <= 6 %}{{ g }}
        {% elif g == 15 %}Neutral
        {% else %}--
        {% endif %}

    - name: "Tire Pressure Min"
      unique_id: wican_tyre_pressure_min
      unit_of_measurement: "psi"
      icon: mdi:car-tire-alert
      state: >
        {% set fl = states('sensor.192_168_10_90_tyre_p_fl') | float(0) %}
        {% set fr = states('sensor.192_168_10_90_tyre_p_fr') | float(0) %}
        {% set rl = states('sensor.192_168_10_90_tyre_p_rl') | float(0) %}
        {% set rr = states('sensor.192_168_10_90_tyre_p_rr') | float(0) %}
        {% set pressures = [fl, fr, rl, rr] | select('gt', 0) | reject('gt', 200) | list %}
        {{ pressures | min | round(1) if pressures | length > 0 else 0 }}

    # ─── Check Engine Light / MIL (from PID 0x01 Monitor Status) ───

    - name: "DTC Count"
      unique_id: wican_dtc_count
      icon: mdi:car-wrench
      state_class: measurement
      state: >
        {{ states('sensor.192_168_10_90_01_monitorstatus') | int(0) % 128 }}

    # ─── Fuel Consumption (Speed-Density from MAP + RPM + IAT) ───
    #
    # Improved formula with three corrections over base speed-density:
    #   1. RPM-based VE curve — VE scales ~0.60 at idle to ~1.0 at 3000+ RPM
    #   2. Fuel trim correction — real-time ECU STFT+LTFT avg both banks
    #      trim_avg = ((STFT1+LTFT1)+(STFT2+LTFT2))/2 = mean of the two banks'
    #      TOTAL (STFT+LTFT) correction. The /2 averages the two bank-totals and
    #      is INTENTIONAL — do NOT "correct" it to /4 (verified correct).
    #   3. Lambda correction — commanded AFR from ECU instead of fixed 14.7
    #
    # Falls back gracefully: if fuel trim / lambda entities don't exist
    # or are unavailable, uses neutral defaults (0% trim, lambda 1.0).
    #
    # VE base factor adjustable via input_number.fuel_ve_correction.
    # The RPM curve multiplies this base, so set it to match cruise (~0.55).

    - name: "Estimated Fuel Rate"
      unique_id: estimated_fuel_rate
      icon: mdi:gas-station
      unit_of_measurement: "L/h"
      state_class: measurement
      state: >
        {% set map_kpa = states('sensor.192_168_10_90_map') | float(0) %}
        {% set rpm = states('sensor.192_168_10_90_0c_enginerpm') | float(0) %}
        {% set iat_c = states('sensor.192_168_10_90_0f_intakeairtemperature') | float(20) %}
        {% set ve_base = states('input_number.fuel_ve_correction') | float(0.55) %}
        {% if map_kpa > 0 and rpm > 0 %}
          {# RPM-based VE curve: ~0.60 at idle, ~0.85 at 1500, ~1.0 at 3000+ #}
          {% set rpm_factor = [0.60 + 0.40 * ((rpm - 600) / 2400), 1.0] | min %}
          {% set rpm_factor = [rpm_factor, 0.55] | max %}
          {% set ve = ve_base * rpm_factor %}
          {# Fuel trims: average both banks (STFT + LTFT) #}
          {% set stft1 = states('sensor.192_168_10_90_stft_b1') | float(0) %}
          {% set ltft1 = states('sensor.192_168_10_90_ltft_b1') | float(0) %}
          {% set stft2 = states('sensor.192_168_10_90_stft_b2') | float(0) %}
          {% set ltft2 = states('sensor.192_168_10_90_ltft_b2') | float(0) %}
          {% set trim_avg = ((stft1 + ltft1) + (stft2 + ltft2)) / 2 %}
          {% set trim_factor = 1 + (trim_avg / 100) %}
          {# Lambda: commanded AFR = 14.7 × lambda #}
          {% set lambda_val = states('sensor.192_168_10_90_lambda') | float(1.0) %}
          {% set lambda_val = [lambda_val, 0.7] | max %}
          {% set afr = 14.7 * lambda_val %}
          {# Speed-density: MAF = ρ_air × Vd × RPM/120 × VE #}
          {% set t_k = iat_c + 273.15 %}
          {% set air_density = (map_kpa * 1000) / (287 * t_k) %}
          {% set maf_gs = (air_density * 0.0035 * rpm * ve * 1000) / 120 %}
          {% set fuel_gs = (maf_gs / afr) * trim_factor %}
          {{ ((fuel_gs * 3600) / 750) | round(2) }}
        {% else %}
          0
        {% endif %}
      attributes:
        map_kpa: "{{ states('sensor.192_168_10_90_map') }}"
        ve_base: "{{ states('input_number.fuel_ve_correction') }}"
        rpm: "{{ states('sensor.192_168_10_90_0c_enginerpm') }}"
        ve_effective: >
          {% set rpm = states('sensor.192_168_10_90_0c_enginerpm') | float(0) %}
          {% set ve_base = states('input_number.fuel_ve_correction') | float(0.55) %}
          {% set rpm_factor = [0.60 + 0.40 * ((rpm - 600) / 2400), 1.0] | min %}
          {% set rpm_factor = [rpm_factor, 0.55] | max %}
          {{ (ve_base * rpm_factor) | round(3) }}
        fuel_trim_avg: >
          {% set stft1 = states('sensor.192_168_10_90_stft_b1') | float(0) %}
          {% set ltft1 = states('sensor.192_168_10_90_ltft_b1') | float(0) %}
          {% set stft2 = states('sensor.192_168_10_90_stft_b2') | float(0) %}
          {% set ltft2 = states('sensor.192_168_10_90_ltft_b2') | float(0) %}
          {{ (((stft1 + ltft1) + (stft2 + ltft2)) / 2) | round(1) }}
        lambda: "{{ states('sensor.192_168_10_90_lambda') }}"

    - name: "Estimated Fuel Consumption"
      unique_id: estimated_fuel_consumption
      icon: mdi:gas-station
      unit_of_measurement: "L/100km"
      state_class: measurement
      state: >
        {% set fuel_lh = states('sensor.estimated_fuel_rate') | float(0) %}
        {% set speed = states('sensor.192_168_10_90_0d_vehiclespeed') | float(0) %}
        {% if fuel_lh > 0 and speed > 5 %}
          {% set l100 = (fuel_lh / speed) * 100 %}
          {# Drop obviously-nonphysical spikes (heavy creep just above 5 km/h). #}
          {{ none if l100 >= 200 else l100 | round(1) }}
        {% else %}
          {# Idle / stopped: emit unknown (not 0) so it never biases averages
             or long-term statistics. Trip economy comes from the GPS-distance
             + OBD-fuel-rate method in osrm_proxy, not this instantaneous gauge. #}
          {{ none }}
        {% endif %}

    # ─── Injector Pulse Width (ms) ───
    # Raw WiCAN value is in µs (5120 = 5.12 ms). Typical 3.5 EB GDI:
    #   Idle: ~4–6 ms, Cruise: ~6–10 ms, WOT: ~12–20 ms

    - name: "Injector Pulse Width"
      unique_id: injector_pulse_width_ms
      icon: mdi:fuel
      unit_of_measurement: "ms"
      state_class: measurement
      state: >
        {% set raw = states('sensor.192_168_10_90_inj_pw') | float(0) %}
        {% if raw > 0 %}
          {{ (raw / 1000) | round(2) }}
        {% else %}
          0
        {% endif %}

    # ─── Fuel Trim Sensors (derived) ───

    # Unavailable unless ALL FOUR trim PIDs are numeric. Without this the
    # `| float(0)` fallbacks turned a dead WiCAN into a confident "0.0 %", which
    # is a real trim value — so parked hours (every PID unavailable) were
    # recorded as genuine zeros and dragged the long-term statistics to ~0
    # instead of the true ~-3 %. An engine-off reading must be absent, not zero.
    - name: "Average Fuel Trim"
      unique_id: average_fuel_trim
      icon: mdi:tune-vertical
      unit_of_measurement: "%"
      state_class: measurement
      availability: >
        {{ states('sensor.192_168_10_90_stft_b1') | is_number
           and states('sensor.192_168_10_90_ltft_b1') | is_number
           and states('sensor.192_168_10_90_stft_b2') | is_number
           and states('sensor.192_168_10_90_ltft_b2') | is_number }}
      state: >
        {% set stft1 = states('sensor.192_168_10_90_stft_b1') | float(0) %}
        {% set ltft1 = states('sensor.192_168_10_90_ltft_b1') | float(0) %}
        {% set stft2 = states('sensor.192_168_10_90_stft_b2') | float(0) %}
        {% set ltft2 = states('sensor.192_168_10_90_ltft_b2') | float(0) %}
        {{ (((stft1 + ltft1) + (stft2 + ltft2)) / 2) | round(1) }}
      attributes:
        stft_b1: "{{ states('sensor.192_168_10_90_stft_b1') }}"
        ltft_b1: "{{ states('sensor.192_168_10_90_ltft_b1') }}"
        stft_b2: "{{ states('sensor.192_168_10_90_stft_b2') }}"
        ltft_b2: "{{ states('sensor.192_168_10_90_ltft_b2') }}"
        total_b1: >
          {{ ((states('sensor.192_168_10_90_stft_b1') | float(0)) +
              (states('sensor.192_168_10_90_ltft_b1') | float(0))) | round(1) }}
        total_b2: >
          {{ ((states('sensor.192_168_10_90_stft_b2') | float(0)) +
              (states('sensor.192_168_10_90_ltft_b2') | float(0))) | round(1) }}

    - name: "Commanded AFR"
      unique_id: commanded_afr
      icon: mdi:air-filter
      unit_of_measurement: ":1"
      state_class: measurement
      state: >
        {% set l = states('sensor.192_168_10_90_lambda') | float(0) %}
        {% if l > 0.5 %}
          {{ (14.7 * l) | round(1) }}
        {% else %}
          14.7
        {% endif %}
      attributes:
        lambda: "{{ states('sensor.192_168_10_90_lambda') }}"

    # ─── Battery time estimate ───
    - name: "Battery Time Estimate"
      unique_id: battery_time_estimate
      icon: mdi:battery-clock-outline
      state: >
        {% set soc = states('sensor.olins_van_bms_battery') | float(0) %}
        {% set current = states('sensor.olins_van_bms_current') | float(0) %}
        {% set voltage = states('sensor.olins_van_bms_voltage') | float(26.2) %}
        {% set p_inst = states('sensor.olins_van_bms_power') | float(0) %}
        {# Prefer the smoothed 5-min mean net power; fall back to instantaneous,
           then to I*V, so this works before the statistics sensor exists. #}
        {% set p_mean = states('sensor.olins_van_bms_power_5_min_mean') | float(p_inst) %}
        {% set power = p_mean if (p_mean | abs) > 1 else (p_inst if (p_inst | abs) > 1 else current * voltage) %}
        {% set p = power | abs %}
        {# Calibrated from 60 days of history (5-min stats):
             • 83.7 Wh per 1% SOC (so "full" target is SOC-based, reaches 0)
             • charge rate is flat up to ~90% SOC, then the CV taper drops it to
               ~0.78x for the last 10% (95-100% measured at ~0.74x of bulk). #}
        {% set wh_per_pct = 84.0 %}
        {% set knee = 90 %}
        {% set taper = 0.78 %}
        {% set reserve = 10 %}
        {% if (current | abs) < 0.4 or p < 6 %}
          Idle
        {% elif current > 0 %}
          {% if soc >= 99.5 %}
            Full
          {% else %}
            {% set bulk = [knee - soc, 0] | max %}
            {% set taper_pct = [100 - ([soc, knee] | max), 0] | max %}
            {% set hours = (bulk * wh_per_pct / p) + (taper_pct * wh_per_pct / (p * taper)) %}
            {% set d = (hours / 24) | int %}
            {% set h = (hours - d * 24) | int %}
            {% set m = ((hours - (d * 24) - h) * 60) | round(0) | int %}
            {% if d > 0 %}
              ~{{ d }}d {{ h }}h to full
            {% elif h > 0 %}
              ~{{ h }}h {{ m }}m to full
            {% else %}
              ~{{ m }}m to full
            {% endif %}
          {% endif %}
        {% else %}
          {% set usable = [soc - reserve, 0] | max %}
          {% set hours = usable * wh_per_pct / p %}
          {% set d = (hours / 24) | int %}
          {% set h = (hours - d * 24) | int %}
          {% set m = ((hours - (d * 24) - h) * 60) | round(0) | int %}
          {% if d > 0 %}
            ~{{ d }}d {{ h }}h until empty
          {% elif h > 0 %}
            ~{{ h }}h {{ m }}m until empty
          {% else %}
            ~{{ m }}m until empty
          {% endif %}
        {% endif %}

# ─── Live Trip computer ──────────────────────────────────────────────────────
# Live, ~1 Hz trip stats for the dashboard's Current Trip card. Distance = OBD
# odometer delta since the trip baseline; fuel = OBD fuel-integral delta since
# baseline; economy = fuel ÷ distance. Baselines are captured at trip start by
# the "Live Trip • reset on new drive" automation. All three freeze naturally
# when parked (their source entities stop changing), so the card shows the
# completed drive until the next one starts. Emit `none` (→ unknown), never 0.
- sensor:
    - name: "Live Trip Distance"
      unique_id: live_trip_distance
      unit_of_measurement: km
      icon: mdi:map-marker-distance
      state: >
        {% set odo  = states('sensor.vehicle_distance_odometer') | float(none) %}
        {% set base = states('input_number.trip_baseline_distance_km') | float(none) %}
        {% if odo is none or base is none %}
          {{ none }}
        {% else %}
          {{ [odo - base, 0] | max | round(2) }}
        {% endif %}

    - name: "Live Trip Fuel"
      unique_id: live_trip_fuel
      unit_of_measurement: L
      icon: mdi:gas-station
      state: >
        {# MOVING fuel only — idle is excluded so a long charge-idle never skews
           the trip. Uses the movement-gated integral, not the raw total. #}
        {% set mov  = states('sensor.moving_fuel_total') | float(none) %}
        {% set base = states('input_number.trip_baseline_moving_fuel_l') | float(none) %}
        {# A drop well below baseline means the accumulator reset (HA restart /
           reload) — emit unknown, NOT a clamped 0, so economy shows '—' not a
           confident fake 0.0. The 0.05 L tolerance keeps a near-zero start normal. #}
        {% if mov is none or base is none or mov < base - 0.05 %}
          {{ none }}
        {% else %}
          {{ (mov - base) | round(2) }}
        {% endif %}

    - name: "Live Trip Idle Fuel"
      unique_id: live_trip_idle_fuel
      unit_of_measurement: L
      icon: mdi:fuel
      state: >
        {# Fuel burned while NOT moving this trip = trip total fuel − trip moving
           fuel. Shown separately so you can see idle consumption without it
           polluting the trip economy. #}
        {% set tot = states('sensor.estimated_fuel_used_total_l') | float(none) %}
        {% set bf  = states('input_number.trip_baseline_fuel_l') | float(none) %}
        {% set mov = states('sensor.live_trip_fuel') | float(none) %}
        {% if tot is none or bf is none or mov is none or tot < bf - 0.05 %}
          {{ none }}
        {% else %}
          {{ [ (tot - bf) - mov, 0 ] | max | round(2) }}
        {% endif %}

    - name: "Live Trip Drive Seconds"
      unique_id: live_trip_drive_seconds
      unit_of_measurement: s
      icon: mdi:timer-outline
      state: >
        {# Driving time only (idle excluded) — trip moving seconds since baseline. #}
        {% set mov  = states('sensor.moving_seconds_total') | float(none) %}
        {% set base = states('input_number.trip_baseline_moving_s') | float(none) %}
        {% if mov is none or base is none or mov < base - 1 %}
          {{ none }}
        {% else %}
          {{ [mov - base, 0] | max | round(0) }}
        {% endif %}

    - name: "Live Trip Economy"
      unique_id: live_trip_economy
      unit_of_measurement: "L/100km"
      state_class: measurement
      icon: mdi:gas-station
      state: >
        {% set km = states('sensor.live_trip_distance') | float(none) %}
        {% set l  = states('sensor.live_trip_fuel') | float(none) %}
        {# live_trip_fuel is MOVING fuel, so this economy excludes idle. Need
           ≥0.1 km before it's meaningful; below that, emit unknown. #}
        {% if km is none or l is none or km < 0.1 or l <= 0 %}
          {{ none }}
        {% else %}
          {{ (l / km * 100) | round(1) }}
        {% endif %}

    - name: "Live Trip Range Remaining"
      unique_id: live_trip_range_remaining
      unit_of_measurement: km
      state_class: measurement
      icon: mdi:map-marker-distance
      state: >
        {# Estimated km to empty computed from THIS trip's economy (NOT the ECU's
           distance-to-empty): tank litres remaining ÷ live_trip_economy × 100.
           Tank = 94.6 L; level = stable_fuel_level (the dashboard hero %). #}
        {% set pct  = states('sensor.stable_fuel_level') | float(none) %}
        {% set econ = states('sensor.live_trip_economy') | float(none) %}
        {% if pct is none or econ is none or econ <= 0 %}
          {{ none }}
        {% else %}
          {{ (pct / 100 * 94.6 / econ * 100) | round(0) }}
        {% endif %}

    # ── Fuel cost (GasBuddy) ──────────────────────────────────────────────────
    # Price = sensor.cheapest_regular_nearby_regular_gas: HACS ha-gasbuddy in
    # "cheapest" mode around HA's home coordinates, which follow the van via the
    # Keep-Home-zone automation; posted credit price, CAD/L, refreshed hourly.
    # All emit unknown (never a fake 0) while the price or a fuel figure is missing.
    - name: "Live Trip Fuel Cost"
      unique_id: live_trip_fuel_cost
      unit_of_measurement: CAD
      icon: mdi:cash
      state: >
        {# Whole-trip fuel (moving + idle) × today's cheapest nearby regular. #}
        {% set price = states('sensor.cheapest_regular_nearby_regular_gas') | float(none) %}
        {% set mov   = states('sensor.live_trip_fuel') | float(none) %}
        {% set idle  = states('sensor.live_trip_idle_fuel') | float(0) %}
        {% if price is none or mov is none %}
          {{ none }}
        {% else %}
          {{ ((mov + idle) * price) | round(2) }}
        {% endif %}

    - name: "Highway Fuel Cost per 100km"
      unique_id: highway_fuel_cost_per_100km
      unit_of_measurement: CAD
      icon: mdi:highway
      state: >
        {# Lifetime highway economy (highway_fuel_total ÷ highway_distance_total)
           × price: what 100 km of QEII costs today. Needs ≥ 50 highway km. #}
        {% set price = states('sensor.cheapest_regular_nearby_regular_gas') | float(none) %}
        {% set l  = states('sensor.highway_fuel_total') | float(none) %}
        {% set km = states('sensor.highway_distance_total') | float(none) %}
        {% if price is none or l is none or km is none or km < 50 %}
          {{ none }}
        {% else %}
          {{ (l / km * 100 * price) | round(2) }}
        {% endif %}

    - name: "City Fuel Cost per 100km"
      unique_id: city_fuel_cost_per_100km
      unit_of_measurement: CAD
      icon: mdi:city-variant-outline
      state: >
        {# Lifetime non-highway MOVING economy — (moving fuel − highway fuel) over
           (odometer − highway distance), idle excluded — × price. #}
        {% set price = states('sensor.cheapest_regular_nearby_regular_gas') | float(none) %}
        {% set mf = states('sensor.moving_fuel_total') | float(none) %}
        {% set hf = states('sensor.highway_fuel_total') | float(none) %}
        {% set od = states('sensor.vehicle_distance_odometer') | float(none) %}
        {% set hd = states('sensor.highway_distance_total') | float(none) %}
        {% if price is none or mf is none or hf is none or od is none or hd is none or od - hd < 50 %}
          {{ none }}
        {% else %}
          {{ ((mf - hf) / (od - hd) * 100 * price) | round(2) }}
        {% endif %}

    - name: "Fill Up Cost"
      unique_id: fill_up_cost
      unit_of_measurement: CAD
      icon: mdi:gas-station-outline
      state: >
        {# Litres to fill the 94.6 L tank from stable_fuel_level × price. #}
        {% set price = states('sensor.cheapest_regular_nearby_regular_gas') | float(none) %}
        {% set pct = states('sensor.stable_fuel_level') | float(none) %}
        {% if price is none or pct is none %}
          {{ none }}
        {% else %}
          {{ ((100 - pct) / 100 * 94.6 * price) | round(2) }}
        {% endif %}

    # ── City / Highway split (this trip) ──────────────────────────────────────
    # Highway side reads the highway-only accumulators (minus their trip
    # baseline); CITY is derived by subtraction (trip total − highway) so the two
    # always reconcile to the whole trip. Same MOVING-only, idle-excluded basis
    # as live_trip_fuel/economy — idle's zero distance would blow economy up. All
    # emit `none` (unknown), never a fake 0, so an untravelled band shows '—'.
    - name: "Live Trip Highway Distance"
      unique_id: live_trip_highway_distance
      unit_of_measurement: km
      icon: mdi:highway
      state: >
        {% set tot  = states('sensor.highway_distance_total') | float(none) %}
        {% set base = states('input_number.trip_baseline_highway_distance_km') | float(none) %}
        {% if tot is none or base is none or tot < base - 0.02 %}
          {{ none }}
        {% else %}
          {{ [tot - base, 0] | max | round(2) }}
        {% endif %}

    - name: "Live Trip Highway Fuel"
      unique_id: live_trip_highway_fuel
      unit_of_measurement: L
      icon: mdi:gas-station
      state: >
        {% set tot  = states('sensor.highway_fuel_total') | float(none) %}
        {% set base = states('input_number.trip_baseline_highway_fuel_l') | float(none) %}
        {% if tot is none or base is none or tot < base - 0.05 %}
          {{ none }}
        {% else %}
          {{ (tot - base) | round(2) }}
        {% endif %}

    - name: "Live Trip City Distance"
      unique_id: live_trip_city_distance
      unit_of_measurement: km
      icon: mdi:city-variant-outline
      state: >
        {# City = trip moving distance − highway distance. #}
        {% set trip = states('sensor.live_trip_distance') | float(none) %}
        {% set hwy  = states('sensor.live_trip_highway_distance') | float(none) %}
        {% if trip is none or hwy is none %}
          {{ none }}
        {% else %}
          {{ [trip - hwy, 0] | max | round(2) }}
        {% endif %}

    - name: "Live Trip City Fuel"
      unique_id: live_trip_city_fuel
      unit_of_measurement: L
      icon: mdi:city-variant-outline
      state: >
        {# City = trip moving fuel − highway fuel (both idle-excluded). #}
        {% set trip = states('sensor.live_trip_fuel') | float(none) %}
        {% set hwy  = states('sensor.live_trip_highway_fuel') | float(none) %}
        {% if trip is none or hwy is none %}
          {{ none }}
        {% else %}
          {{ [trip - hwy, 0] | max | round(2) }}
        {% endif %}

    - name: "Live Trip Highway Economy"
      unique_id: live_trip_highway_economy
      unit_of_measurement: "L/100km"
      state_class: measurement
      icon: mdi:highway
      state: >
        {% set km = states('sensor.live_trip_highway_distance') | float(none) %}
        {% set l  = states('sensor.live_trip_highway_fuel') | float(none) %}
        {% if km is none or l is none or km < 0.1 or l <= 0 %}
          {{ none }}
        {% else %}
          {{ (l / km * 100) | round(1) }}
        {% endif %}

    - name: "Live Trip City Economy"
      unique_id: live_trip_city_economy
      unit_of_measurement: "L/100km"
      state_class: measurement
      icon: mdi:city-variant-outline
      state: >
        {% set km = states('sensor.live_trip_city_distance') | float(none) %}
        {% set l  = states('sensor.live_trip_city_fuel') | float(none) %}
        {% if km is none or l is none or km < 0.1 or l <= 0 %}
          {{ none }}
        {% else %}
          {{ (l / km * 100) | round(1) }}
        {% endif %}

    # NB: entity_id is sensor.live_trip_highway_percent (HA slugs it from the
    # name, not the unique_id) — that's what the dashboard reads.
    - name: "Live Trip Highway Percent"
      unique_id: live_trip_highway_pct
      unit_of_measurement: "%"
      state_class: measurement
      icon: mdi:highway
      state: >
        {# Share of THIS trip's moving distance driven on the highway. #}
        {% set trip = states('sensor.live_trip_distance') | float(none) %}
        {% set hwy  = states('sensor.live_trip_highway_distance') | float(none) %}
        {% if trip is none or hwy is none or trip < 0.1 %}
          {{ none }}
        {% else %}
          {{ [[hwy / trip * 100, 0] | max, 100] | min | round(0) }}
        {% endif %}

# ─── Ready-to-Drive Guard — camp-teardown offender list ──────────────────────
# Counts the "hard" camp items still active that should be OFF before driving.
# Advisory items (shore charger, inverter — you often legitimately drive with the
# inverter on for DC-DC charging) are intentionally EXCLUDED here; the dashboard
# banner surfaces those separately in amber. Consumed by binary_sensor
# .rtd_needs_attention and automation rtd_guard_warn. count = state, human list =
# the `summary` attribute (built with a namespace loop, NOT a self-reference).
- sensor:
    - name: "RTD Offenders"
      unique_id: rtd_offenders
      icon: mdi:steering
      state: >
        {% set checks = [
          'switch.a32_pro_switch06_grey_water_tank_valve',
          'switch.a32_pro_switch28_compressor',
          'light.0xa4c138fd668411cd',
          'switch.a32_pro_switch21_left_outdoor_lights',
          'switch.a32_pro_switch22_right_outdoor_lights',
          'switch.a32_pro_switch23_rear_outdoor_lights',
          'switch.a32_pro_switch31_lightbar',
          'input_boolean.sleep_mode',
          'input_boolean.shower_mode' ] %}
        {% set ns = namespace(n=0) %}
        {% for eid in checks %}
          {% if is_state(eid, 'on') %}{% set ns.n = ns.n + 1 %}{% endif %}
        {% endfor %}
        {{ ns.n }}
      attributes:
        summary: >
          {% set checks = [
            ('switch.a32_pro_switch06_grey_water_tank_valve','Grey dump valve OPEN'),
            ('switch.a32_pro_switch28_compressor','Compressor ON'),
            ('light.0xa4c138fd668411cd','Battery vent fan ON'),
            ('switch.a32_pro_switch21_left_outdoor_lights','Left outdoor light ON'),
            ('switch.a32_pro_switch22_right_outdoor_lights','Right outdoor light ON'),
            ('switch.a32_pro_switch23_rear_outdoor_lights','Rear outdoor light ON'),
            ('switch.a32_pro_switch31_lightbar','Lightbar ON'),
            ('input_boolean.sleep_mode','Sleep mode ON'),
            ('input_boolean.shower_mode','Shower mode ON') ] %}
          {% set ns = namespace(items=[]) %}
          {% for eid, label in checks %}
            {% if is_state(eid, 'on') %}{% set ns.items = ns.items + [label] %}{% endif %}
          {% endfor %}
          {{ ns.items | join('\n• ') }}

# ─── Starlink status (single human-readable state for the dashboard) ───
# Collapses the dish's several signals into one word so the React cards/badges
# don't each re-derive the precedence. Order matters — most specific first:
#   Powered Off → the PSU switch is off (you cut it, or a recovery cycle is
#                 mid-cut); nothing else can be known, so it wins.
#   Recovering  → a power-cycle sequence is running.
#   Offline     → entities unreachable = the PoE converter lockup.
#   Sleeping    → scheduled sleep (entities stay available, so this is genuine).
#   Obstructed / No Signal → dish is talking, just not serving.
- sensor:
    - name: "Starlink Status"
      unique_id: starlink_status
      icon: >
        {% set s = states('sensor.starlink_status') %}
        {% if s == 'Online' %} mdi:satellite-uplink
        {% elif s in ['Offline', 'Powered Off'] %} mdi:satellite-variant
        {% elif s == 'Recovering' %} mdi:restart-alert
        {% elif s == 'Sleeping' %} mdi:sleep
        {% else %} mdi:signal-off
        {% endif %}
      state: >
        {% set conn = states('binary_sensor.starlink_connectivity') %}
        {% if is_state('switch.a32_pro_switch26_starlink_power_supply', 'off') %} Powered Off
        {% elif is_state('input_boolean.starlink_recovery_in_progress', 'on') %} Recovering
        {% elif conn in ['unavailable', 'unknown'] %} Offline
        {% elif is_state('binary_sensor.starlink_sleep', 'on') %} Sleeping
        {% elif is_state('binary_sensor.starlink_obstructed', 'on') %} Obstructed
        {% elif conn == 'off' %} No Signal
        {% else %} Online
        {% endif %}
      attributes:
        # Throughput reads as 0 (not "—") while offline; the state word is what
        # tells you it's offline, these are just the detail line.
        downlink_mbps: "{{ states('sensor.starlink_downlink_throughput_mbps') | float(0) | round(1) }}"
        uplink_mbps: "{{ states('sensor.starlink_uplink_throughput_mbps') | float(0) | round(1) }}"
        ping_ms: "{{ states('sensor.starlink_ping') | float(0) | round(0) }}"
        obstructed: "{{ is_state('binary_sensor.starlink_obstructed', 'on') }}"
        last_boot: "{{ states('sensor.starlink_last_boot_time') }}"
        recovery_attempts: "{{ states('input_number.starlink_recovery_attempts') | int(0) }}"
        recovery_failed: "{{ is_state('input_boolean.starlink_recovery_failed', 'on') }}"
        auto_recovery: "{{ is_state('input_boolean.starlink_auto_recovery', 'on') }}"

# ─── Battery cell voltages (JBD BMS via bms_ble) ─────────────────────────────
# bms_ble 2.x reports the 8 cell voltages only as the cell_voltages attribute of
# the delta-voltage sensor, and the recorder hasn't stored that attribute since
# the 2026-09-16 update. One sensor per cell gives them history and long-term
# statistics. Cell 1 is the weak, low-capacity cell (first to 3.65 V at the
# top, first empty at the bottom): Battery Cell 1 Gap is cell 1 minus the mean
# of cells 2–8, negative when it sags. All nine go unavailable, never 0, when
# the attribute is missing, has fewer than 8 cells, or holds a value outside
# 2–4 V (a garbled BLE read; LiFePO4 cells stay within about 2.5–3.65 V).
- sensor:
    - name: "Battery Cell 1 Voltage"
      unique_id: battery_cell_1_voltage
      unit_of_measurement: "V"
      device_class: voltage
      state_class: measurement
      availability: &battery_cells_ok >
        {% set c = state_attr('sensor.olins_van_bms_delta_voltage', 'cell_voltages') %}
        {{ c is sequence and c is not string and c | count >= 8
           and c | map('float', 0) | min > 2 and c | map('float', 0) | max < 4 }}
      state: "{{ (state_attr('sensor.olins_van_bms_delta_voltage', 'cell_voltages') or [])[0] | default(none) }}"

    - name: "Battery Cell 2 Voltage"
      unique_id: battery_cell_2_voltage
      unit_of_measurement: "V"
      device_class: voltage
      state_class: measurement
      availability: *battery_cells_ok
      state: "{{ (state_attr('sensor.olins_van_bms_delta_voltage', 'cell_voltages') or [])[1] | default(none) }}"

    - name: "Battery Cell 3 Voltage"
      unique_id: battery_cell_3_voltage
      unit_of_measurement: "V"
      device_class: voltage
      state_class: measurement
      availability: *battery_cells_ok
      state: "{{ (state_attr('sensor.olins_van_bms_delta_voltage', 'cell_voltages') or [])[2] | default(none) }}"

    - name: "Battery Cell 4 Voltage"
      unique_id: battery_cell_4_voltage
      unit_of_measurement: "V"
      device_class: voltage
      state_class: measurement
      availability: *battery_cells_ok
      state: "{{ (state_attr('sensor.olins_van_bms_delta_voltage', 'cell_voltages') or [])[3] | default(none) }}"

    - name: "Battery Cell 5 Voltage"
      unique_id: battery_cell_5_voltage
      unit_of_measurement: "V"
      device_class: voltage
      state_class: measurement
      availability: *battery_cells_ok
      state: "{{ (state_attr('sensor.olins_van_bms_delta_voltage', 'cell_voltages') or [])[4] | default(none) }}"

    - name: "Battery Cell 6 Voltage"
      unique_id: battery_cell_6_voltage
      unit_of_measurement: "V"
      device_class: voltage
      state_class: measurement
      availability: *battery_cells_ok
      state: "{{ (state_attr('sensor.olins_van_bms_delta_voltage', 'cell_voltages') or [])[5] | default(none) }}"

    - name: "Battery Cell 7 Voltage"
      unique_id: battery_cell_7_voltage
      unit_of_measurement: "V"
      device_class: voltage
      state_class: measurement
      availability: *battery_cells_ok
      state: "{{ (state_attr('sensor.olins_van_bms_delta_voltage', 'cell_voltages') or [])[6] | default(none) }}"

    - name: "Battery Cell 8 Voltage"
      unique_id: battery_cell_8_voltage
      unit_of_measurement: "V"
      device_class: voltage
      state_class: measurement
      availability: *battery_cells_ok
      state: "{{ (state_attr('sensor.olins_van_bms_delta_voltage', 'cell_voltages') or [])[7] | default(none) }}"

    - name: "Battery Cell 1 Gap"
      unique_id: battery_cell_1_gap
      unit_of_measurement: "mV"
      device_class: voltage
      state_class: measurement
      availability: *battery_cells_ok
      state: >
        {% set c = (state_attr('sensor.olins_van_bms_delta_voltage', 'cell_voltages') or [])
                   | map('float', 0) | list %}
        {{ ((c[0] - (c[1:8] | sum) / 7) * 1000) | round(0) | int if c | count >= 8 else none }}
