# ================================
# template/triggered.yaml
# ================================
# Trigger-based template sensors that use trigger: blocks

# ───────────────────────────────────────────────
# Road grade from u-blox GPS (deg & % + label)
# ───────────────────────────────────────────────
- trigger:
    # Fire ONCE per GPS fix. The daemon republishes latitude/longitude/elevation
    # together in a single MQTT message, so watching all three attributes fired
    # this template up to 3× per fix and compounded the EMA (effective weight
    # 0.6³ instead of 0.6). Latitude changes on every moving fix (a ≥5 m step is
    # far larger than the 7-decimal rounding), so a single latitude trigger
    # captures each fix exactly once. from_state/to_state still carry all attrs.
    - trigger: state
      entity_id: device_tracker.ublox_gps
      attribute: latitude
  sensor:
    - name: "Road Grade (deg)"
      unique_id: road_grade_deg
      unit_of_measurement: "°"
      state_class: measurement
      state: >
        {% set f = trigger.from_state %}
        {% set t = trigger.to_state %}

        {# helper to return the last numeric value (or 0) #}
        {% macro last_numeric_or_zero(prev) -%}
          {%- if prev not in ['unknown','unavailable','none',''] -%}
            {{ prev }}
          {%- else -%}
            0
          {%- endif -%}
        {%- endmacro %}

        {# Only calculate grade when the vehicle is actually moving #}
        {# GPS drift while parked produces false non-zero grades #}
        {% if not is_state('binary_sensor.vehicle_is_moving', 'on') %}
          0
        {% elif f is none or t is none %}
          {{ last_numeric_or_zero(this.state) }}
        {% else %}
          {% set lat1 = (f.attributes.latitude  | float(0)) %}
          {% set lon1 = (f.attributes.longitude | float(0)) %}
          {% set alt1 = (f.attributes.get('elevation', f.attributes.get('altitude', 0)) | float(0)) %}
          {% set lat2 = (t.attributes.latitude  | float(0)) %}
          {% set lon2 = (t.attributes.longitude | float(0)) %}
          {% set alt2 = (t.attributes.get('elevation', t.attributes.get('altitude', 0)) | float(0)) %}
          {% set acc1 = (f.attributes.get('gps_accuracy', 999) | float(999)) %}
          {% set acc2 = (t.attributes.get('gps_accuracy', 999) | float(999)) %}

          {# reject junk fixes: poor accuracy or identical points #}
          {% if acc1 > 30 or acc2 > 30 or (lat1==lat2 and lon1==lon2) %}
            {{ last_numeric_or_zero(this.state) }}
          {% else %}
            {# haversine horizontal distance (meters) #}
            {% set R = 6371000.0 %}
            {% set phi1 = lat1 * pi/180 %}
            {% set phi2 = lat2 * pi/180 %}
            {% set dphi = (lat2-lat1) * pi/180 %}
            {% set dlmb = (lon2-lon1) * pi/180 %}
            {% set a  = sin(dphi/2)**2 + cos(phi1)*cos(phi2)*sin(dlmb/2)**2 %}
            {% set c  = 2*atan2(sqrt(a), sqrt(1-a)) %}
            {% set d  = R * c %}         {# horizontal meters #}
            {% set dz = (alt2 - alt1) %} {# meters #}

            {# Require a longer horizontal run before trusting a grade. The
               accuracy gate above is HORIZONTAL only; GPS vertical error is
               larger, so a longer run dilutes fixed altitude noise. #}
            {% if d < 10 %}
              {{ last_numeric_or_zero(this.state) }}
            {% else %}
              {% set raw_deg = atan2(dz, d) * 180 / pi %}
              {# Reject road-implausible spikes (>20° ≈ 36% grade). Almost no
                 drivable road exceeds this, so a spike here is vertical GPS
                 noise (e.g. a momentary altitude glitch) — hold the last value. #}
              {% if raw_deg | abs > 20 %}
                {{ last_numeric_or_zero(this.state) }}
              {% elif this.state not in ['unknown','unavailable','none',''] %}
                {# light smoothing: EMA 60/40 with previous value if present #}
                {{ (0.6*(this.state | float) + 0.4*raw_deg) | round(2) }}
              {% else %}
                {{ raw_deg | round(2) }}
              {% endif %}
            {% endif %}
          {% endif %}
        {% endif %}
      availability: "true"

    - name: "Road Grade (%)"
      unique_id: road_grade_percent
      unit_of_measurement: "%"
      state_class: measurement
      state: >
        {# helper to return last numeric or 0 #}
        {% macro last_numeric_or_zero(prev) -%}
          {%- if prev not in ['unknown','unavailable','none',''] -%}
            {{ prev }}
          {%- else -%}
            0
          {%- endif -%}
        {%- endmacro %}

        {% set deg = states('sensor.road_grade_deg') %}
        {% if deg in ['unknown','unavailable','none',''] %}
          {{ last_numeric_or_zero(this.state) }}
        {% else %}
          {{ (tan((deg | float) * pi/180) * 100) | round(2) }}
        {% endif %}
      availability: "true"

    - name: "Hill Aggression"
      unique_id: hill_aggression
      state: >
        {% set g = states('sensor.road_grade_deg') | float(0) %}
        {% set a = g | abs %}
        {% if a < 1.0 %} Flat
        {% elif a < 3.0 %} Gentle {{ 'up' if g>0 else 'down' }}
        {% elif a < 6.0 %} Moderate {{ 'up' if g>0 else 'down' }}
        {% elif a < 10.0 %} Steep {{ 'up' if g>0 else 'down' }}
        {% else %} Very steep {{ 'up' if g>0 else 'down' }}
        {% endif %}
      icon: >
        {% set g = states('sensor.road_grade_deg') | float(0) %}
        {% if g >= 6 %} mdi:terrain
        {% elif g >= 3 %} mdi:triangle
        {% elif g <= -6 %} mdi:terrain
        {% elif g <= -3 %} mdi:triangle-outline
        {% else %} mdi:minus
        {% endif %}

# ─── Vehicle Acceleration (triggered, km/h per second) ───────────────────────
# Fires on every OBD speed update and computes (Δspeed / Δt).
# Positive = accelerating, negative = braking. Falls back to 0 on stale data.
- trigger:
    - trigger: state
      entity_id: sensor.192_168_10_90_0d_vehiclespeed
  sensor:
    - name: "Vehicle Acceleration"
      unique_id: vehicle_acceleration
      unit_of_measurement: "km/h/s"
      state_class: measurement
      icon: mdi:speedometer
      state: >
        {% set prev = trigger.from_state.state | float(-1) %}
        {% set curr = trigger.to_state.state | float(-1) %}
        {% if prev < 0 or curr < 0
              or trigger.from_state.state in ['unknown','unavailable']
              or trigger.to_state.state   in ['unknown','unavailable'] %}
          {{ this.state if this.state not in ['unknown','unavailable'] else 0 }}
        {% else %}
          {% set dt = (trigger.to_state.last_updated - trigger.from_state.last_updated).total_seconds() %}
          {% if dt > 0 and dt < 30 %}
            {{ ((curr - prev) / dt) | round(2) }}
          {% else %}
            0
          {% endif %}
        {% endif %}
      availability: "true"

# ─── Stable Fuel Level (grade + acceleration gated) ──────────────────────────
# Latches the SMOOTHED tank level (sensor.wican_fuel_5_min_mean, jitter ~0.15%)
# rather than the raw OBD reading (jitter ~7%, sloshes 65→100% on one drive).
# Only latches a new value when:
#   • Road grade ≤ 1.5° absolute              (no gravity-driven tilt)
#   • |acceleration| ≤ stability threshold   (no inertial slosh from braking/accel)
# Otherwise it HOLDS its last value (so it stays sensible while parked/off).
# Falls back to the raw reading only if the 5-min mean has no value yet
# (e.g. the first few seconds after engine start). Refreshes every 10 min.
- trigger:
    - trigger: state
      entity_id: sensor.wican_fuel_5_min_mean
      for: "00:00:03"
    - trigger: time_pattern
      minutes: "/10"
  sensor:
    - name: Stable Fuel Level
      unique_id: stable_fuel_level
      unit_of_measurement: "%"
      state_class: measurement
      state: >
        {% set mean = states('sensor.wican_fuel_5_min_mean') | float(-1) %}
        {% set raw  = states('sensor.192_168_10_90_2f_fueltanklevel') | float(-1) %}
        {# Prefer the smooth 5-min mean; fall back to raw only when the mean
           has no value yet. #}
        {% set src = mean if mean >= 0 else raw %}
        {% set grade  = states('sensor.road_grade_deg') | float(0) | abs %}
        {% set accel  = states('sensor.vehicle_acceleration') | float(0) | abs %}
        {% set thresh = states('input_number.acceleration_stability_threshold') | float(1.0) %}
        {% set stable = grade <= 1.5 and accel <= thresh %}
        {% if src >= 0 and stable %}
          {{ src | round(2) }}
        {% else %}
          {# Hold last value; if none yet (e.g. just after a reload while parked)
             emit unknown, NOT 0 — a false 0% misleads range and is read by the
             ESPHome heater retry-check as a real low (nan is treated as OK). #}
          {{ this.state if this.state not in ['unknown', 'unavailable'] else none }}
        {% endif %}
      availability: "true"

# ─── Stable Water Tank Levels (fresh + grey) ─────────────────────────────────
# The tank senders publish a 10-second moving average every second, which lets
# through both slosh (fresh swung 15–25 points on every drive of 2026-09-24,
# 2–4 parked) and spikes (grey jumped from ~10 % to 30–50 % even parked). Like
# Stable Fuel Level: latch the median (integrations/sensor.yaml), but only once
# the van has been parked as long as the median's window, so the whole window
# is parked samples, and hold it while driving. Whole percent with a deadband,
# so the number no longer flickers.
#   Fresh: 5-min median, parked 5 min, 1-point deadband. Use or a fill shows
#          up in ~3 min.
#   Grey:  30-min median, parked 30 min, 2-point deadband. Its sender also
#          wanders for minutes at a time, so a dump shows up in ~15 min.
#          Also held while the hydronic heater runs and for 60 min after:
#          the sender wanders through most heater runs and for up to 30 min
#          after, and the median takes another 30 min to flush that out. On
#          the 2026-09-18..25 history this halved the changes (199 -> 106).
#          Water used during a heater run shows up an hour after it stops.
# binary_sensor.vehicle_is_moving is a template sensor, so a template reload
# or an HA restart sets its last_changed to now: the levels then hold their
# restored values for 5 / 30 min before following the median again. The
# heater switch's last_changed also resets on an HA restart or when the A32
# Pro reconnects, so grey then holds for 60 min.
- trigger:
    - trigger: state
      entity_id:
        - sensor.fresh_water_level_5_min_median
        - sensor.grey_water_level_30_min_median
    - trigger: state
      entity_id: binary_sensor.vehicle_is_moving
      to: "off"
      for: "00:05:00"
    - trigger: time_pattern
      minutes: "/5"
  sensor:
    - name: Stable Fresh Water Level
      unique_id: stable_fresh_water_level
      unit_of_measurement: "%"
      state_class: measurement
      icon: mdi:water
      state: >
        {% set med = states('sensor.fresh_water_level_5_min_median') | float(none) %}
        {% set mv = states.binary_sensor.vehicle_is_moving %}
        {% set parked = mv is none or (mv.state != 'on'
             and (now() - mv.last_changed).total_seconds() >= 300) %}
        {% set last = this.state | float(none) %}
        {% if med is none %}
          {{ last }}
        {% elif last is none or (parked and (med - last) | abs >= 1) %}
          {{ med | round(0) }}
        {% else %}
          {{ last }}
        {% endif %}
      availability: "true"
    - name: Stable Grey Water Level
      unique_id: stable_grey_water_level
      unit_of_measurement: "%"
      state_class: measurement
      icon: mdi:water-opacity
      state: >
        {% set med = states('sensor.grey_water_level_30_min_median') | float(none) %}
        {% set mv = states.binary_sensor.vehicle_is_moving %}
        {% set parked = mv is none or (mv.state != 'on'
             and (now() - mv.last_changed).total_seconds() >= 1800) %}
        {% set ht = states.switch.a32_pro_switch24_hydronic_heater %}
        {% set heater_quiet = ht is none or (ht.state != 'on'
             and (now() - ht.last_changed).total_seconds() >= 3600) %}
        {% set last = this.state | float(none) %}
        {% if med is none %}
          {{ last }}
        {% elif last is none or (parked and heater_quiet and (med - last) | abs >= 2) %}
          {{ med | round(0) }}
        {% else %}
          {{ last }}
        {% endif %}
      availability: "true"

# ─── Vehicle Distance Odometer (triggered, km) ───────────────────────────────
# A lifetime trip odometer built by integrating OBD vehicle speed (trapezoidal)
# on each speed update — accurate, GPS-independent, and updates ~1 Hz while
# driving. Live trip distance = this − input_number.trip_baseline_distance_km.
# Mirrors "Vehicle Acceleration": dt from the trigger states' last_updated, a
# 30 s dt cap so a WiCAN dropout can't inject a huge phantom segment, and a
# speed sanity gate so a negative or 255-style sentinel can't spike it.
# Trigger-based template sensors restore their last state across a Core restart
# and across a template.reload (this.state survives), so the lifetime total
# persists. Checked in the recorder: the reloads of 2026-09-18 and 2026-09-25
# each brought it back at the same km, as they did Moving Fuel Total and Stable
# Fuel Level, so a reload does not reset the trip.
- trigger:
    - trigger: state
      entity_id: sensor.192_168_10_90_0d_vehiclespeed
  sensor:
    - name: "Vehicle Distance Odometer"
      unique_id: vehicle_distance_odometer
      unit_of_measurement: km
      state_class: total_increasing
      icon: mdi:counter
      state: >
        {% set base = this.state | float(0) %}
        {% set f = trigger.from_state.state if trigger.from_state else none %}
        {% set t = trigger.to_state.state   if trigger.to_state   else none %}
        {% if f in [none,'unknown','unavailable'] or t in [none,'unknown','unavailable'] %}
          {{ base }}
        {% else %}
          {% set prev = f | float(-1) %}
          {% set curr = t | float(-1) %}
          {% set dt = (trigger.to_state.last_updated - trigger.from_state.last_updated).total_seconds() %}
          {# Skip implausible speeds (negative / 255-style sentinel) and dropout
             gaps (>30 s) so neither inflates the one-directional lifetime total. #}
          {% if prev >= 0 and curr >= 0 and prev <= 180 and curr <= 180 and dt > 0 and dt < 30 %}
            {{ (base + (prev + curr) / 2 * dt / 3600) | round(4) }}
          {% else %}
            {{ base }}
          {% endif %}
        {% endif %}
      availability: "true"

# ─── Moving Fuel Total (triggered, L) ────────────────────────────────────────
# Lifetime fuel burned ONLY while the van is moving: the same OBD fuel integral
# as estimated_fuel_used_total_l, but each increment is added only when
# vehicle_is_moving is on. The live trip's fuel + economy use this, so idling
# (a red light, or a 1-2 h battery-charge idle) never skews L/100km. Idle fuel is
# still visible via Live Trip Idle Fuel (= trip total fuel − trip moving fuel).
- trigger:
    - trigger: state
      entity_id: sensor.estimated_fuel_used_total_l
  sensor:
    - name: "Moving Fuel Total"
      unique_id: moving_fuel_total
      unit_of_measurement: L
      state_class: total_increasing
      icon: mdi:gas-station
      state: >
        {% set base = this.state | float(0) %}
        {% set f = trigger.from_state.state if trigger.from_state else none %}
        {% set t = trigger.to_state.state   if trigger.to_state   else none %}
        {% if f in [none,'unknown','unavailable'] or t in [none,'unknown','unavailable'] %}
          {{ base }}
        {% else %}
          {% set prev = f | float(0) %}
          {% set curr = t | float(0) %}
          {# total is cumulative; curr<prev means it reset (HA restart) → skip.
             Add the increment only while actually moving. #}
          {% if curr >= prev and is_state('binary_sensor.vehicle_is_moving','on') %}
            {{ (base + (curr - prev)) | round(4) }}
          {% else %}
            {{ base }}
          {% endif %}
        {% endif %}
      availability: "true"

# ─── Moving Seconds Total (triggered, s) ─────────────────────────────────────
# Lifetime driving time (seconds the van is actually moving), summing dt between
# OBD speed updates while vehicle_is_moving is on. The live trip's "driving" time
# and avg speed come from this, so a long idle doesn't inflate them. Same 30 s
# dt dropout cap as the odometer.
- trigger:
    - trigger: state
      entity_id: sensor.192_168_10_90_0d_vehiclespeed
  sensor:
    - name: "Moving Seconds Total"
      unique_id: moving_seconds_total
      unit_of_measurement: s
      state_class: total_increasing
      icon: mdi:timer-outline
      state: >
        {% set base = this.state | float(0) %}
        {% set dt = (trigger.to_state.last_updated - trigger.from_state.last_updated).total_seconds()
                    if (trigger.from_state and trigger.to_state) else 0 %}
        {% if dt > 0 and dt < 30 and is_state('binary_sensor.vehicle_is_moving','on') %}
          {{ (base + dt) | round(1) }}
        {% else %}
          {{ base }}
        {% endif %}
      availability: "true"

# ─── Drive Speed EMA (triggered, km/h) — smoothed speed for city/hwy split ────
# An exponential moving average of OBD speed, FROZEN while stopped, used to
# classify city vs highway without chattering. Freezing while not moving is the
# key trick: it accumulates across the brief stops of stop-and-go city driving
# (so the average stays low → city) yet HOLDS through a highway rest-stop (so it
# stays high → resumes highway on departure). The smoothing itself supplies the
# dwell, so one fast pass in town or a slow patch on the freeway can't mislabel a
# whole trip. dt-aware alpha (tau≈45 s) so a variable OBD update rate / dropout
# can't bias it; 30 s dt cap + speed sanity gate mirror the odometer.
- trigger:
    - trigger: state
      entity_id: sensor.192_168_10_90_0d_vehiclespeed
  sensor:
    - name: "Drive Speed EMA"
      unique_id: drive_speed_ema
      unit_of_measurement: km/h
      state_class: measurement
      icon: mdi:speedometer
      state: >
        {% set prev = this.state | float(none) %}
        {% if not is_state('binary_sensor.vehicle_is_moving','on') %}
          {# frozen while stopped — hold the last moving average #}
          {{ prev if prev is not none else states('sensor.192_168_10_90_0d_vehiclespeed') | float(0) }}
        {% else %}
          {% set spd = trigger.to_state.state | float(none) %}
          {% if spd is none or spd < 0 or spd > 160 %}
            {{ prev if prev is not none else 0 }}
          {% elif prev is none %}
            {{ spd | round(2) }}
          {% else %}
            {% set dt = (trigger.to_state.last_updated - trigger.from_state.last_updated).total_seconds()
                        if trigger.from_state else 1 %}
            {% set dt = [[dt, 0.1] | max, 30] | min %}
            {% set alpha = 1 - 2.718281828459045 ** (-dt / 45) %}
            {{ (prev + alpha * (spd - prev)) | round(2) }}
          {% endif %}
        {% endif %}
      availability: "true"

# ─── Drive Class (triggered, city|highway) — 2-band hysteresis on the EMA ─────
# HIGHWAY once the smoothed speed exceeds the floor (default 78 km/h), CITY once
# it drops below the ceiling (default 63), and HOLDS the last class inside the
# 63–78 dead-band so boundary noise can't chatter. EPA-anchored: the highway
# drive cycle (HWFET) AVERAGES 77.7 km/h, so the floor sits ON that number instead
# of above it — an 80 km/h arterial counts as highway, which is how it drives. The
# 15 km/h band width is unchanged, just shifted down, so slowing to 70 in freeway
# traffic no longer drops the trip back to city. Held across stops because the EMA
# is frozen while parked. Triggering off the EMA (not raw speed) guarantees the EMA
# is fresh when this reads it. Consumed by highway_* accumulators + the dash badge.
- trigger:
    - trigger: state
      entity_id: sensor.drive_speed_ema
  sensor:
    - name: "Drive Class"
      unique_id: drive_class
      icon: >
        {% if is_state('sensor.drive_class','highway') %}mdi:highway{% else %}mdi:city-variant-outline{% endif %}
      state: >
        {% set ema = states('sensor.drive_speed_ema') | float(none) %}
        {% set hi = states('input_number.highway_speed_floor') | float(78) %}
        {% set lo = states('input_number.city_speed_ceiling') | float(63) %}
        {% set prev = this.state if this.state in ['city','highway'] else none %}
        {% if ema is none %}
          {{ prev if prev is not none else 'city' }}
        {% elif ema >= hi %}
          highway
        {% elif ema <= lo %}
          city
        {% else %}
          {{ prev if prev is not none else ('highway' if ema >= (hi + lo) / 2 else 'city') }}
        {% endif %}
      availability: "true"

# ─── Highway Distance / Fuel Totals (triggered) — city/highway split ──────────
# Lifetime highway-only copies of the odometer + moving-fuel integral: identical
# math, but each increment is added ONLY when sensor.drive_class is 'highway'.
# The dashboard derives the CITY figures by subtraction (trip total − highway),
# so city + highway always reconciles to the trip total and only these two
# highway accumulators are needed. Same sanity gates + baseline pattern as their
# parent accumulators. (drive_class lags a speed sample by ~1 update here, since
# both key off the speed sensor — negligible for aggregate distance/fuel.)
- trigger:
    - trigger: state
      entity_id: sensor.192_168_10_90_0d_vehiclespeed
  sensor:
    - name: "Highway Distance Total"
      unique_id: highway_distance_total
      unit_of_measurement: km
      state_class: total_increasing
      icon: mdi:highway
      state: >
        {% set base = this.state | float(0) %}
        {% set f = trigger.from_state.state if trigger.from_state else none %}
        {% set t = trigger.to_state.state   if trigger.to_state   else none %}
        {% if f in [none,'unknown','unavailable'] or t in [none,'unknown','unavailable'] %}
          {{ base }}
        {% else %}
          {% set prev = f | float(-1) %}
          {% set curr = t | float(-1) %}
          {% set dt = (trigger.to_state.last_updated - trigger.from_state.last_updated).total_seconds() %}
          {% if prev >= 0 and curr >= 0 and prev <= 180 and curr <= 180 and dt > 0 and dt < 30
                and is_state('sensor.drive_class','highway') %}
            {{ (base + (prev + curr) / 2 * dt / 3600) | round(4) }}
          {% else %}
            {{ base }}
          {% endif %}
        {% endif %}
      availability: "true"

- trigger:
    - trigger: state
      entity_id: sensor.estimated_fuel_used_total_l
  sensor:
    - name: "Highway Fuel Total"
      unique_id: highway_fuel_total
      unit_of_measurement: L
      state_class: total_increasing
      icon: mdi:highway
      state: >
        {% set base = this.state | float(0) %}
        {% set f = trigger.from_state.state if trigger.from_state else none %}
        {% set t = trigger.to_state.state   if trigger.to_state   else none %}
        {% if f in [none,'unknown','unavailable'] or t in [none,'unknown','unavailable'] %}
          {{ base }}
        {% else %}
          {% set prev = f | float(0) %}
          {% set curr = t | float(0) %}
          {% if curr >= prev and is_state('binary_sensor.vehicle_is_moving','on')
                and is_state('sensor.drive_class','highway') %}
            {{ (base + (curr - prev)) | round(4) }}
          {% else %}
            {{ base }}
          {% endif %}
        {% endif %}
      availability: "true"
