# ================================
# input_number.yaml
# ================================
main_light_warmth:
  name: Main Light Warmth
  initial: 400
  min: 250
  max: 500
  step: 1

shore_charge_reset_threshold:
  name: "Charger Reset at %"
  icon: mdi:power-plug
  unit_of_measurement: "%"
  min: 0
  max: 100
  step: 1
  initial: 97

acceleration_stability_threshold:
  name: "Acceleration Stability Threshold"
  initial: 1.0
  min: 0.1
  max: 2.0
  step: 0.1
  unit_of_measurement: "km/h/s"
  icon: mdi:speedometer-slow

vehicle_stopped_threshold:
  name: "Vehicle Stopped Speed Threshold"
  initial: 2
  min: 0
  max: 10
  step: 0.5
  unit_of_measurement: "km/h"
  icon: mdi:car-brake-parking

# Base VE of sensor.estimated_fuel_rate (template/sensors.yaml). Set by hand to
# 0.80 on 2026-10-08, fitted with the new RPM curve + barometer on 9 fill-to-fill
# windows. The old 0.475 (0.49 before 2026-09-25) belongs to the old curve. The
# range was 0.10–1.50; 0.60–1.00 now, since a value outside it means the model
# is wrong, not the calibration. The fill-up auto-calibration (ve_update.py) is
# off; see the note above fill_up_detected in automations.yaml.
#
# MUST NOT declare `initial:`. HA re-applies `initial:` on every start, which
# silently reset this to 0.55 each restart and threw away every correction the
# fill-up calibration had learned. Without it the value is restored from state,
# which is what a learned parameter needs. (Fresh installs with no restored
# state fall back to `min`, so seed it once by hand there: 0.80.)
fuel_ve_correction:
  name: "Fuel VE Correction Factor"
  icon: mdi:gas-station
  min: 0.60
  max: 1.00
  step: 0.01
  unit_of_measurement: ""

# --- Live Trip computer baselines (captured at trip start) ---
# No `initial:` on purpose so they RESTORE across HA restarts (a mid-trip restart
# keeps the same trip). Set by the "Live Trip • reset on new drive" automation.
trip_baseline_distance_km:
  name: "Trip Baseline Distance"
  icon: mdi:map-marker-distance
  min: 0
  max: 100000000
  step: 0.001
  unit_of_measurement: km

trip_baseline_fuel_l:
  name: "Trip Baseline Fuel"
  icon: mdi:gas-station
  min: 0
  max: 100000000
  step: 0.001
  unit_of_measurement: L

# Movement-gated baselines: live trip fuel/time count only while moving, so idle
# never skews the trip. No `initial:` → restore across restarts.
trip_baseline_moving_fuel_l:
  name: "Trip Baseline Moving Fuel"
  icon: mdi:gas-station
  min: 0
  max: 100000000
  step: 0.001
  unit_of_measurement: L

trip_baseline_moving_s:
  name: "Trip Baseline Moving Seconds"
  icon: mdi:timer-outline
  min: 0
  max: 1000000000
  step: 0.1
  unit_of_measurement: s

# City/Highway split baselines: the highway distance + highway fuel accumulators
# at trip start. City = trip total − highway (by subtraction), so only the
# highway side needs a baseline. No `initial:` → restore across restarts.
trip_baseline_highway_distance_km:
  name: "Trip Baseline Highway Distance"
  icon: mdi:highway
  min: 0
  max: 100000000
  step: 0.001
  unit_of_measurement: km

trip_baseline_highway_fuel_l:
  name: "Trip Baseline Highway Fuel"
  icon: mdi:highway
  min: 0
  max: 100000000
  step: 0.001
  unit_of_measurement: L

# How long the van must be NOT MOVING (idle OR engine-off) before the next drive
# counts as a NEW trip. Stops shorter than this stay grouped into one trip.
trip_split_minutes:
  name: "Trip Split Gap"
  icon: mdi:timer-sand
  min: 5
  max: 120
  step: 5
  initial: 35
  unit_of_measurement: "min"

# City/Highway classification edges (hysteresis dead-band on OBD speed). The van
# is HIGHWAY once sustained speed exceeds the floor, CITY once it drops below the
# ceiling, and HOLDS the last class in the 63–78 km/h dead-band. EPA-anchored:
# the highway drive cycle (HWFET) averages 77.7 km/h, so the floor sits ON that
# number — an 80 km/h arterial is highway even in town, which matches how it
# drives. The Transit's efficient cruise (88–105 km/h) clears the floor easily; a
# boxy van's aero drag argues for keeping the boundary low, not raising it. The
# dwell comes from the tau≈45 s speed EMA these are compared against — see
# sensor.drive_class in template/triggered.yaml. Mirrored by the history
# backfill's CITY_CEILING_KMH / HIGHWAY_FLOOR_KMH in vanlife-panel/osrm_proxy.py:
# change these and change those, or live and history will disagree.
city_speed_ceiling:
  name: "City Speed Ceiling"
  icon: mdi:city
  min: 40
  max: 90
  step: 1
  initial: 63
  unit_of_measurement: "km/h"

highway_speed_floor:
  name: "Highway Speed Floor"
  icon: mdi:highway
  min: 60
  max: 120
  step: 1
  initial: 78
  unit_of_measurement: "km/h"

# --- Starlink PoE auto-recovery ---
# Which power cycle of the current recovery run we're on (0 = idle, 1 = first
# cut, 2 = second/last). Drives "attempt N of 2" in the dashboard. No `initial:`
# so a mid-recovery HA restart doesn't silently reset the count.
starlink_recovery_attempts:
  name: "Starlink Recovery Attempts"
  icon: mdi:restart-alert
  min: 0
  max: 10
  step: 1

# --- Shoe dryer ---
# How long script.shoe_dryer_start runs the coolant blower before the timer
# shuts it off. No `initial:` — the last chosen duration should survive
# restarts.
shoe_dryer_minutes:
  name: "Shoe Dryer Run Time"
  icon: mdi:shoe-sneaker
  min: 5
  max: 240
  step: 5
  unit_of_measurement: "min"

# Climate target captured when a dry pauses heating; put back by
# shoe_dryer_auto_off. No `initial:` — must survive restarts.
shoe_dryer_prev_setpoint:
  name: "Shoe Dryer Saved Heat Setpoint"
  icon: mdi:thermometer
  min: 5
  max: 35
  step: 0.5
  unit_of_measurement: "°C"
  mode: box

# --- Sundown dimming ---
# Brightness ceilings for the indoor lights (see sensor.indoor_light_phase).
# No `initial:` so tuned values survive restarts. A fresh install starts at
# `min` (5 %), so seed them once by hand (70 / 40) before enabling
# input_boolean.indoor_light_sun_dimming.
indoor_light_sundown_pct:
  name: "Lights at Sundown"
  icon: mdi:weather-sunset-down
  min: 5
  max: 100
  step: 5
  unit_of_measurement: "%"

indoor_light_dark_pct:
  name: "Lights After Dark"
  icon: mdi:weather-night
  min: 5
  max: 100
  step: 5
  unit_of_measurement: "%"

# ─── Night Climate ───
# No `initial:` so the values survive restarts (seeded 15 / 23 / 45 / 30).
night_climate_night_target:
  name: "Night Climate Night Target"
  min: 5
  max: 25
  step: 0.5
  unit_of_measurement: "°C"
  icon: mdi:thermometer-low
# Hold mode: the temperature to keep right now, no schedule (seeded 22).
night_climate_hold_target:
  name: "Night Climate Hold Target"
  min: 10
  max: 30
  step: 0.5
  unit_of_measurement: "°C"
  icon: mdi:thermostat
night_climate_wake_target:
  name: "Night Climate Wake Target"
  min: 10
  max: 30
  step: 0.5
  unit_of_measurement: "°C"
  icon: mdi:thermometer
# Program / Hold: the A/C only joins above this room temperature (seeded 24),
# so a low night target never becomes an A/C goal. Once on it cools to the target.
night_climate_cool_above:
  name: "Night Climate A/C Above"
  min: 18
  max: 35
  step: 0.5
  unit_of_measurement: "°C"
  icon: mdi:snowflake-thermometer
# The A/C's fan level (1L–6L) when the program starts it; a change while the
# program's A/C runs goes to the unit (automation night_climate_ac_fan_level).
# Seeded 5 on 2026-10-08 (the user's pick; it was a fixed 6L).
night_climate_ac_fan_level:
  name: "Night Climate A/C Fan Level"
  min: 1
  max: 6
  step: 1
  icon: mdi:fan
night_climate_warmup_minutes:
  name: "Night Climate Warm-up Minutes"
  min: 0
  max: 180
  step: 5
  unit_of_measurement: "min"
  icon: mdi:timer-sand
night_climate_fan_speed:
  name: "Night Climate Fan Speed"
  min: 10
  max: 100
  step: 10
  unit_of_measurement: "%"
  icon: mdi:fan
