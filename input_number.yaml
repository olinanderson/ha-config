# ================================
# input_number.yaml
# ================================
main_light_warmth:
  name: Main Light Warmth
  initial: 400
  min: 250
  max: 500
  step: 1

shore_charge_reset_threshold:
  name: "Charger Reset at %"
  icon: mdi:power-plug
  unit_of_measurement: "%"
  min: 0
  max: 100
  step: 1
  initial: 97

acceleration_stability_threshold:
  name: "Acceleration Stability Threshold"
  initial: 1.0
  min: 0.1
  max: 2.0
  step: 0.1
  unit_of_measurement: "km/h/s"
  icon: mdi:speedometer-slow

vehicle_stopped_threshold:
  name: "Vehicle Stopped Speed Threshold"
  initial: 2
  min: 0
  max: 10
  step: 0.5
  unit_of_measurement: "km/h"
  icon: mdi:car-brake-parking

fuel_ve_correction:
  name: "Fuel VE Correction Factor"
  icon: mdi:gas-station
  min: 0.10
  max: 1.50
  step: 0.01
  initial: 0.55
  unit_of_measurement: ""

# --- Vanlife Tracker journal ---
vanlife_stop_rating:
  name: "Stop Rating"
  icon: mdi:star
  min: 0
  max: 5
  step: 1
  initial: 0

# --- Live Trip computer baselines (captured at trip start) ---
# No `initial:` on purpose so they RESTORE across HA restarts (a mid-trip restart
# keeps the same trip). Set by the "Live Trip • reset on new drive" automation.
trip_baseline_distance_km:
  name: "Trip Baseline Distance"
  icon: mdi:map-marker-distance
  min: 0
  max: 100000000
  step: 0.001
  unit_of_measurement: km

trip_baseline_fuel_l:
  name: "Trip Baseline Fuel"
  icon: mdi:gas-station
  min: 0
  max: 100000000
  step: 0.001
  unit_of_measurement: L

# Movement-gated baselines: live trip fuel/time count only while moving, so idle
# never skews the trip. No `initial:` → restore across restarts.
trip_baseline_moving_fuel_l:
  name: "Trip Baseline Moving Fuel"
  icon: mdi:gas-station
  min: 0
  max: 100000000
  step: 0.001
  unit_of_measurement: L

trip_baseline_moving_s:
  name: "Trip Baseline Moving Seconds"
  icon: mdi:timer-outline
  min: 0
  max: 1000000000
  step: 0.1
  unit_of_measurement: s

# City/Highway split baselines: the highway distance + highway fuel accumulators
# at trip start. City = trip total − highway (by subtraction), so only the
# highway side needs a baseline. No `initial:` → restore across restarts.
trip_baseline_highway_distance_km:
  name: "Trip Baseline Highway Distance"
  icon: mdi:highway
  min: 0
  max: 100000000
  step: 0.001
  unit_of_measurement: km

trip_baseline_highway_fuel_l:
  name: "Trip Baseline Highway Fuel"
  icon: mdi:highway
  min: 0
  max: 100000000
  step: 0.001
  unit_of_measurement: L

# How long the van must be NOT MOVING (idle OR engine-off) before the next drive
# counts as a NEW trip. Stops shorter than this stay grouped into one trip.
trip_split_minutes:
  name: "Trip Split Gap"
  icon: mdi:timer-sand
  min: 5
  max: 120
  step: 5
  initial: 35
  unit_of_measurement: "min"

# City/Highway classification edges (hysteresis dead-band on OBD speed). The van
# is HIGHWAY once sustained speed exceeds the floor, CITY once it drops below the
# ceiling, and HOLDS the last class in the 70–85 km/h dead-band. EPA-anchored:
# the highway drive-cycle averages ~78 km/h, so the floor sits just above it and
# the ceiling just below, cleanly separating stop-go arterial from steady cruise.
# The Transit's efficient cruise (88–105 km/h) clears the floor; a boxy van's
# aero drag argues for keeping the boundary low, not raising it. See the two
# "Drive Class •" automations (each needs a 45 s dwell before flipping).
city_speed_ceiling:
  name: "City Speed Ceiling"
  icon: mdi:city
  min: 40
  max: 90
  step: 1
  initial: 70
  unit_of_measurement: "km/h"

highway_speed_floor:
  name: "Highway Speed Floor"
  icon: mdi:highway
  min: 60
  max: 120
  step: 1
  initial: 85
  unit_of_measurement: "km/h"
