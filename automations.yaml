# ────────────────────────────────────────────────────────────────
# Sundown dimming – indoor lights get a bit dimmer at sundown and a bit more
# once it's dark. Phase comes from sensor.indoor_light_phase (day / twilight /
# dark); the ceilings from input_number.indoor_light_sundown_pct / _dark_pct;
# master enable input_boolean.indoor_light_sun_dimming.
#   • Lights already on step down to the new ceiling over ~2 min.
#   • Lights switched on during twilight/dark come on no brighter than it.
#   • The first switch-on after sunrise of a light left at one of those
#     ceilings goes back to full, so it isn't stuck at last night's level.
# Hands off: Shower light while Shower Mode is on, Cabinet light while the LPG
# valve is open (Cook Mode sets it to 100 %), and everything during Sleep
# Mode's wind-down and the 2 min after Sleep Mode turns off (wake-up restore).
# Only the LED controllers are commanded; the Inovelli switches follow via the
# Linked Entities blueprint (commanding both cross-fires, see
# sleep_mode_on_actions).
# ────────────────────────────────────────────────────────────────
- id: indoor_lights_sundown_dim
  alias: "Indoor Lights – Sundown dim for lights already on"
  # restart: a newer phase change supersedes an unfinished fade
  mode: restart
  trigger:
    # Evening edges only. At dawn the phase goes dark → twilight, and lights
    # must not dim then.
    - trigger: state
      entity_id: sensor.indoor_light_phase
      from: "day"
      to: "twilight"
    - trigger: state
      entity_id: sensor.indoor_light_phase
      from: "twilight"
      to: "dark"
  condition:
    - condition: state
      entity_id: input_boolean.indoor_light_sun_dimming
      state: "on"
    - "{{ not (is_state('input_boolean.sleep_mode', 'on') and is_state('input_boolean.sleep_winddown_complete', 'off')) }}"
  action:
    - variables:
        steps: 12
        cap: >-
          {{ ((state_attr('sensor.indoor_light_phase', 'max_brightness_pct') | float(100)) * 2.55) | round(0) | int }}
        # [entity, starting brightness] for each light that is on, above the
        # ceiling, and not being held bright by a mode.
        start: >-
          {% set ns = namespace(out=[]) %}
          {% for id in ['light.led_controller_cct_1', 'light.led_controller_cct_2',
                        'light.led_controller_sc_1', 'light.led_controller_sc_2'] %}
            {% set b = state_attr(id, 'brightness') | int(0) %}
            {% set held = (id == 'light.led_controller_sc_1' and is_state('input_boolean.shower_mode', 'on'))
                       or (id == 'light.led_controller_cct_2' and is_state('switch.a32_pro_switch16_lpg_valve', 'on')) %}
            {% if is_state(id, 'on') and b > cap + 2 and not held %}
              {% set ns.out = ns.out + [[id, b]] %}
            {% endif %}
          {% endfor %}
          {{ ns.out }}
    # Small steps rather than one long transition: the main light's switch sync
    # re-sends the level with no transition, which would cut a long fade short,
    # and a ≤5 % jump every 10 s is invisible either way.
    - if: "{{ start | count > 0 }}"
      then:
        - repeat:
            count: "{{ steps }}"
            sequence:
              # This step's target vs the previous step's (what was last set).
              # A light brighter than that was turned up by hand — leave it.
              - variables:
                  targets: >-
                    {% set ns = namespace(out=[]) %}
                    {% for id, b0 in start %}
                      {% set prev = (b0 - (b0 - cap) * (repeat.index - 1) / steps) | round(0) | int %}
                      {% set goal = (b0 - (b0 - cap) * repeat.index / steps) | round(0) | int %}
                      {% set b = state_attr(id, 'brightness') | int(0) %}
                      {% if is_state(id, 'on') and b > goal + 2 and b <= prev + 8 %}
                        {% set ns.out = ns.out + [[id, goal]] %}
                      {% endif %}
                    {% endfor %}
                    {{ ns.out }}
              - repeat:
                  for_each: "{{ targets }}"
                  sequence:
                    - action: light.turn_on
                      target:
                        entity_id: "{{ repeat.item[0] }}"
                      data:
                        brightness: "{{ repeat.item[1] }}"
                        transition: 10
              - delay: 10

- id: indoor_lights_sundown_turn_on_level
  alias: "Indoor Lights – Sundown turn-on level / morning reset"
  # parallel: lights often come on together (voice, the Lights tile, Power
  # Saving restore) and each needs its own check
  mode: parallel
  max: 10
  trigger:
    - trigger: state
      entity_id:
        - light.led_controller_cct_1
        - light.led_controller_cct_2
        - light.led_controller_sc_1
        - light.led_controller_sc_2
      from: "off"
      to: "on"
  condition:
    - condition: state
      entity_id: input_boolean.indoor_light_sun_dimming
      state: "on"
    - "{{ not (is_state('input_boolean.sleep_mode', 'on') and is_state('input_boolean.sleep_winddown_complete', 'off')) }}"
    - "{{ now() - states.input_boolean.sleep_mode.last_changed > timedelta(minutes=2) }}"
    - "{{ not (trigger.entity_id == 'light.led_controller_sc_1' and is_state('input_boolean.shower_mode', 'on')) }}"
    - "{{ not (trigger.entity_id == 'light.led_controller_cct_2' and is_state('switch.a32_pro_switch16_lpg_valve', 'on')) }}"
  action:
    - variables:
        phase: "{{ states('sensor.indoor_light_phase') }}"
        level: "{{ trigger.to_state.attributes.brightness | int(0) }}"
        cap: >-
          {{ ((state_attr('sensor.indoor_light_phase', 'max_brightness_pct') | float(100)) * 2.55) | round(0) | int }}
        sundown_cap: >-
          {{ ((states('input_number.indoor_light_sundown_pct') | float(0)) * 2.55) | round(0) | int }}
        dark_cap: >-
          {{ ((states('input_number.indoor_light_dark_pct') | float(0)) * 2.55) | round(0) | int }}
        # Roughly today's sunrise: once the sun is up, next_rising is tomorrow's.
        sunrise: >-
          {% set r = state_attr('sun.sun', 'next_rising') %}
          {{ (as_datetime(r) - timedelta(days=1)).isoformat() if r else '' }}
    - choose:
        - conditions: "{{ phase in ['twilight', 'dark'] and level > cap + 2 }}"
          sequence:
            - action: light.turn_on
              target:
                entity_id: "{{ trigger.entity_id }}"
              data:
                brightness: "{{ cap }}"
                transition: 1
        # Off since before sunrise and still sitting at a ceiling this set last
        # night → back to full. A level you picked yourself is left alone.
        - conditions: >-
            {{ phase == 'day' and sunrise != ''
               and trigger.from_state.last_changed < as_datetime(sunrise)
               and ((level - sundown_cap) | abs <= 3 or (level - dark_cap) | abs <= 3) }}
          sequence:
            - action: light.turn_on
              target:
                entity_id: "{{ trigger.entity_id }}"
              data:
                brightness: 255
                transition: 1

- id: shore_charger_manual_enable_sync
  alias: Shore Charger – Manual Enable Sync
  mode: single
  trigger:
    - trigger: state
      entity_id: input_boolean.shore_power_charger_enabled
  action:
    - choose:
        - conditions:
            - condition: state
              entity_id: input_boolean.shore_power_charger_enabled
              state: "on"
          sequence:
            - action: switch.turn_on
              target:
                entity_id: switch.a32_pro_do8_switch04_shore_power_charger
        - conditions:
            - condition: state
              entity_id: input_boolean.shore_power_charger_enabled
              state: "off"
          sequence:
            - action: switch.turn_off
              target:
                entity_id: switch.a32_pro_do8_switch04_shore_power_charger

- id: shore_charger_reset_on_low_soc
  alias: Shore Charger – Reset when SOC below threshold
  description: "Power-cycle charger (OFF 10s → ON) when SOC drops below threshold"
  mode: single
  trigger:
    - trigger: numeric_state
      entity_id: sensor.olins_van_bms_battery # 0–100 %
      below: input_number.shore_charge_reset_threshold
      # Optional (recommended): require it to stay below for a few seconds to avoid noise
      for: "00:00:05"
  condition:
    - condition: state
      entity_id: input_boolean.shore_power_charger_enabled
      state: "on" # only if feature is enabled
    - condition: state
      entity_id: switch.a32_pro_do8_switch04_shore_power_charger
      state: "on" # only makes sense to reset if it's currently on
  action:
    - action: switch.turn_off
      target:
        entity_id: switch.a32_pro_do8_switch04_shore_power_charger
    - delay: "00:00:10" # reset window
    - action: switch.turn_on
      target:
        entity_id: switch.a32_pro_do8_switch04_shore_power_charger

# ────────────────────────────────────────────────────────────────
# Ducking in pulseaudio
# ────────────────────────────────────────────────────────────────
# The following automation is used to setup the ducking module in pulse audio which lowers the volume of music from airplay/audio from PC when HA is playing audio through the VLC media player
- alias: "Bootstrap ducking → VLC"
  mode: single
  trigger:
    - trigger: homeassistant
      event: start # fires when HA has finished booting
  action:
    - delay: "00:00:15" # let hassio_audio come online
    - action: shell_command.load_ducking_docker

# ────────────────────────────────────────────────
# iPhone → Occupancy sensor replacement
# ────────────────────────────────────────────────

# 1. Welcome / lights when presence detected
- id: iphone_home_arrival # keep id for history
  alias: "iPhone Home Arrival - Lights & Welcome"
  mode: single
  trigger:
    - trigger: state
      entity_id: binary_sensor.van_occupied # debounced radar (smooths flicker)
      from: "off" # occupancy confirmed
      to: "on"
  condition:
    # Suppress this welcome flow while sleeping
    - condition: state
      entity_id: input_boolean.sleep_mode
      state: "off"
  action:
    - action: script.power_saving_mode_off
    - if:
        - condition: template
          # away ≥ 15 min
          value_template: >
            {% set away = now() - trigger.from_state.last_changed %}
            {{ away.total_seconds() >= 900 }}
      then:
        - action: media_player.volume_set
          target:
            entity_id: media_player.vlc_telnet
          data:
            volume_level: 0.20

        - delay: "00:00:02"

        # Calculate how long you were away and get battery percentage
        - action: tts.speak
          target:
            entity_id: tts.openai_tts_gpt_4o_mini_tts
          data:
            cache: true
            media_player_entity_id: media_player.vlc_telnet
            message: >
              {% set away_duration = now() - trigger.from_state.last_changed %}
              {% set total_minutes = (away_duration.total_seconds() / 60) | round(0) %}
              {% set days = (total_minutes / 1440) | int %}
              {% set hours = ((total_minutes % 1440) / 60) | int %}
              {% set minutes = (total_minutes % 60) | int %}
              {% set van_battery_pct = states('sensor.olins_van_bms_battery') | default('unknown') %}
              {% set inside_temp = states('sensor.a32_pro_bme280_1_temperature') | default('unknown') %}
              {% set outside_temp = states('sensor.a32_pro_bme280_4_temperature') | default('unknown') %}
              Welcome back. You were away for 
              {%- if days > 0 -%}
                {{ days }} day{% if days != 1 %}s{% endif %}
                {%- if hours > 0 %} and {{ hours }} hour{% if hours != 1 %}s{% endif %}{% endif -%}
              {%- elif hours > 0 -%}
                {{ hours }} hour{% if hours != 1 %}s{% endif %}
                {%- if minutes > 0 %} and {{ minutes }} minute{% if minutes != 1 %}s{% endif %}{% endif -%}
              {%- else -%}
                {{ minutes }} minute{% if minutes != 1 %}s{% endif %}
              {%- endif %}. 
              {% if van_battery_pct != 'unknown' %}
              The van battery is at {{ van_battery_pct }} percent.
              {% else %}
              I couldn't get the van battery level.
              {% endif %}
              {% if inside_temp != 'unknown' and outside_temp != 'unknown' %}
              It's {{ inside_temp | round(1) }} degrees inside and {{ outside_temp | round(1) }} degrees outside.
              {% elif inside_temp != 'unknown' %}
              The inside temperature is {{ inside_temp | round(1) }} degrees.
              {% elif outside_temp != 'unknown' %}
              The outside temperature is {{ outside_temp | round(1) }} degrees.
              {% endif %}

# 2. Auto-power-saving when leaving / returning
- id: auto_power_saving_when_away
  alias: "Auto Power Saving When Away from Van"
  mode: single
  max_exceeded: silent # both monitor rockers pressed back to back
  trigger:
    - id: leave_van
      trigger: state
      entity_id: binary_sensor.van_occupied # debounced radar (smooths flicker)
      from: "on"
      to: "off"
      for: "00:01:00" # away for ≥ 1 min
    - id: return_van
      trigger: state
      entity_id: binary_sensor.van_occupied # debounced radar (smooths flicker)
      from: "off"
      to: "on"
    # A monitor rocker pressed by hand means someone is here, so don't wait
    # for the radar (its 2 s debounce, or it missing someone sitting still).
    # It also covers the radar losing power: from 2026-09-13 to 09-16 it was
    # fed from the top monitor's relay, which power saving switches off.
    - id: return_rocker
      trigger: state
      entity_id:
        - switch.a32_pro_do8_switch06_top_monitor
        - switch.a32_pro_do8_switch07_bottom_monitor
      from: "off"
      to: "on"
  condition:
    # Let sleep mode fully control the environment without presence flips
    - condition: state
      entity_id: input_boolean.sleep_mode
      state: "off"
  action:
    - choose:
        # Enable power-saving after 1 min away
        - conditions: "{{ trigger.id == 'leave_van' and is_state('input_boolean.power_saving_mode','off') }}"
          sequence:
            - action: script.power_saving_mode_on
            - action: system_log.write
              data:
                level: info
                logger: automation.power_saving
                message: "Power saving mode enabled – away for ≥1 min"
        # Disable when back (if not driving). Only a physical rocker press
        # counts: it has no user and no parent context. A dashboard toggle
        # (maybe from away) or our own scene restore does not.
        - conditions: >
            {{ (trigger.id == 'return_van'
                or (trigger.id == 'return_rocker'
                    and trigger.to_state.context.user_id is none
                    and trigger.to_state.context.parent_id is none))
               and is_state('input_boolean.power_saving_mode','on')
               and is_state('binary_sensor.vehicle_is_moving','off') }}
          sequence:
            - action: script.power_saving_mode_off
            - action: system_log.write
              data:
                level: info
                logger: automation.power_saving
                message: >-
                  Power saving mode disabled –
                  {{ 'monitor rocker pressed' if trigger.id == 'return_rocker' else 'presence detected' }}

# ────────────────────────────────────────────────────────────────
# Power Saving Mode Automation - triggers scripts when toggle changes
# ────────────────────────────────────────────────────────────────
- id: power_saving_mode_automation
  alias: "Power Saving Mode Toggle Handler"
  description: "Triggers power saving scripts when toggle changes"
  mode: single
  trigger:
    - trigger: state
      entity_id: input_boolean.power_saving_mode
  action:
    - choose:
        - conditions:
            - condition: state
              entity_id: input_boolean.power_saving_mode
              state: "on"
          sequence:
            - action: script.power_saving_mode_on
        - conditions:
            - condition: state
              entity_id: input_boolean.power_saving_mode
              state: "off"
          sequence:
            - action: script.power_saving_mode_off

# ────────────────────────────────────────────────────────────────
# Fill-up Detection — Auto-update VE Correction
# ────────────────────────────────────────────────────────────────
# OFF since 2026-09-26; leave it off (reviewed 2026-10-08, when the VE was refit
# by hand, see template/sensors.yaml). It can't measure the fuel used:
#   - from_state is not the pre-fill level. The trigger fires at 7 of the 9
#     fills from 2026-09-05 to 10-05, each time with the mean already mid-ramp
#     (63–81 % against a real 20–43 %), so the tank delta came out 30–75 %
#     short. All its suggestions were 0.38–0.48 (09-25: 0.431 took VE 0.49 →
#     0.475 while the real fuel was ~35 % above the estimate).
#   - input_text.last_fillup_ts / ve_correction_history have `initial:`, so a
#     restart wipes them (6 times 08-19 → 09-25) and the next fill is skipped.
#   - No heater fuel is taken off (~11 of 64 L in one Calgary window), and the
#     GPS distance can come up short (119 of 274 km on 09-25).
# Even fixed, one gauge-read window is good to ±5 %, no better than the model,
# so re-check the VE by hand every few fills (docs/vehicle-obd.md).
#
# Fires when the smoothed tank level (sensor.wican_fuel_5_min_mean) jumps up by
# more than 15 percentage points (can't happen from normal consumption — must be
# a fill-up).
# Calls ve_update.py which:
#   1. Queries /vanlife/fuel-stats for the period since the last fill-up
#   2. Computes the actual fuel used (OBD tank delta) over that window
#   3. Derives a new VE correction factor (damped) and appends it to history
#   4. Updates input_number.fuel_ve_correction
- id: fill_up_detected
  alias: "Fill-up Detected — Auto-Update VE Correction"
  description: >
    Detects a fuel fill-up (5-min mean tank level jumps > 15% to a high level)
    and automatically recalibrates the speed-density VE correction factor.
  mode: single
  max_exceeded: silent
  trigger:
    - trigger: state
      entity_id: sensor.wican_fuel_5_min_mean
  condition:
    - condition: template
      value_template: >
        {% set new_fuel = trigger.to_state.state  | float(-1) %}
        {% set old_fuel = trigger.from_state.state | float(-1) %}
        {# A real fill jumps the SMOOTHED mean by >15 pts to a plausibly-high
           level. WiCAN-reconnect and slosh artifacts don't clear all three
           gates (old>0 rules out cold-boot 'unknown'; new>25 rules out noise). #}
        {{ old_fuel > 0 and new_fuel > 25 and (new_fuel - old_fuel) > 15 }}
  action:
    - variables:
        # from_ts = when was the previous fill-up (epoch ms stored in input_text)
        from_ts: "{{ states('input_text.last_fillup_ts') | int(0) }}"
        # to_ts = timestamp of the last stable reading before the jump happened
        to_ts: "{{ (trigger.from_state.last_updated.timestamp() * 1000) | int }}"
        fuel_before: "{{ trigger.from_state.state | float(0) | round(1) }}"
        fuel_after: "{{ trigger.to_state.state | float(0) | round(1) }}"
    # Run the VE update script (queries GPS API, computes correction, stores history)
    - action: shell_command.update_ve_from_fillup
      data:
        from_ts: "{{ from_ts }}"
        to_ts: "{{ to_ts }}"
    # Store the fill-up timestamp for next time (epoch ms at the "tank is now full" point)
    - action: input_text.set_value
      target:
        entity_id: input_text.last_fillup_ts
      data:
        value: "{{ (now().timestamp() * 1000) | int }}"
    # Notify so there's a record
    - action: persistent_notification.create
      data:
        title: "⛽ Fill-up Detected"
        message: >
          Tank: {{ fuel_before }}% → {{ fuel_after }}%
          (+{{ (fuel_after - fuel_before) | round(1) }}%,
          ~{{ ((fuel_after - fuel_before) / 100 * 94.6) | round(1) }} L)

          VE correction updated from GPS distance + tank delta.
          Check input_number.fuel_ve_correction for the new value.
        notification_id: fillup_detected

# ────────────────────────────────────────────────────────────────
# Live Trip computer — baseline reset / end stamping
# ────────────────────────────────────────────────────────────────
# Captures the trip baselines (odometer, fuel total, start time) when a NEW drive
# begins. A trip is anchored to actual MOVEMENT (not engine-on), so merely
# starting the engine to idle/warm up does NOT begin a trip — only driving does.
# "New" = the van had been NOT MOVING (idle OR engine-off, uniformly) for longer
# than input_number.trip_split_minutes, or no trip is recorded yet. Shorter
# stops (the usual 5-30 min fuel/coffee/errand stops) keep accumulating the same
# trip — including any idle fuel burned during them. trigger.from_state is the
# vehicle_is_moving 'off' state, whose last_changed marks when motion stopped, so
# the gap spans the whole stop even across an engine-off period.
- id: live_trip_reset_on_drive_start
  alias: "Live Trip • reset on new drive"
  mode: single
  trigger:
    - trigger: state
      entity_id: binary_sensor.vehicle_is_moving
      from: "off"
      to: "on"
  condition:
    - condition: template
      value_template: >
        {% set gap = (now() - trigger.from_state.last_changed).total_seconds()
                     if trigger.from_state else 999999 %}
        {% set split = states('input_number.trip_split_minutes') | float(35) * 60 %}
        {{ states('input_text.trip_start_ts') | int(0) == 0 or gap > split }}
  action:
    - action: input_number.set_value
      target: { entity_id: input_number.trip_baseline_distance_km }
      data: { value: "{{ states('sensor.vehicle_distance_odometer') | float(0) }}" }
    - action: input_number.set_value
      target: { entity_id: input_number.trip_baseline_fuel_l }
      data: { value: "{{ states('sensor.estimated_fuel_used_total_l') | float(0) }}" }
    # Movement-gated baselines (fuel + time burned/elapsed only while moving).
    - action: input_number.set_value
      target: { entity_id: input_number.trip_baseline_moving_fuel_l }
      data: { value: "{{ states('sensor.moving_fuel_total') | float(0) }}" }
    - action: input_number.set_value
      target: { entity_id: input_number.trip_baseline_moving_s }
      data: { value: "{{ states('sensor.moving_seconds_total') | float(0) }}" }
    # City/highway split baselines (only the highway side; city = total − highway).
    - action: input_number.set_value
      target: { entity_id: input_number.trip_baseline_highway_distance_km }
      data: { value: "{{ states('sensor.highway_distance_total') | float(0) }}" }
    - action: input_number.set_value
      target: { entity_id: input_number.trip_baseline_highway_fuel_l }
      data: { value: "{{ states('sensor.highway_fuel_total') | float(0) }}" }
    - action: input_text.set_value
      target: { entity_id: input_text.trip_start_ts }
      data: { value: "{{ (now().timestamp() * 1000) | int }}" }
    # Clear the previous end so the duration counts live again from now.
    - action: input_text.set_value
      target: { entity_id: input_text.trip_end_ts }
      data: { value: "0" }

# Stamps the trip end when the engine stops, so the card freezes the trip
# duration at the stop instead of ticking forever while parked. (A brief stop
# under 20 min won't reset the trip — see the automation above — so the duration
# simply resumes counting when the engine restarts.)
- id: live_trip_mark_end_on_stop
  alias: "Live Trip • mark end on engine off"
  mode: single
  trigger:
    - trigger: state
      entity_id: binary_sensor.engine_is_running
      from: "on"
      to: "off"
  action:
    - action: input_text.set_value
      target: { entity_id: input_text.trip_end_ts }
      data: { value: "{{ (now().timestamp() * 1000) | int }}" }

# ────────────────────────────────────────────────────────────────
# Auto Power Saving When Driving
# ────────────────────────────────────────────────────────────────
- id: auto_power_saving_when_driving
  alias: "Auto Power Saving When Driving"
  description: "Turn on power saving mode when driving, turn off when stopped"
  mode: single
  max_exceeded: silent # stop_driving landing inside engine_off's 30 s radar wait
  trigger:
    # When vehicle starts moving
    - id: start_driving
      trigger: state
      entity_id: binary_sensor.vehicle_is_moving
      to: "on"
      # Wait 30 seconds to avoid toggling at traffic lights
      for: "00:00:30"

    # When vehicle stops moving. Long enough that if you park and walk away
    # the radar has already dropped (van_occupied needs 3 min of nothing), so
    # power saving just stays on. With 2 min it switched off at every errand
    # stop, restoring lights, monitors and the inverter for the ~3 min until
    # the away rule switched it back on (2026-09-30 to 10-02: 48 changes).
    - id: stop_driving
      trigger: state
      entity_id: binary_sensor.vehicle_is_moving
      to: "off"
      for: "00:05:00"

    # Engine off and still inside. van_occupied never drops during a drive
    # (you are in the van), so return_van in the away rule can't fire and
    # without this you waited the full 5 min above, or pressed the monitor
    # rockers (2026-10-05 to 10-06: 75-146 s after the van stopped).
    # 45 s lets most errand stops empty the van first. Replayed on 09-23 to
    # 10-07 history it fired in 12 of the 14 stays where power saving was
    # still on at 45 s, and in 9 of 28 errand stops (things on until the
    # away rule switches back ~4 min later).
    - id: engine_off
      trigger: state
      entity_id: binary_sensor.engine_is_running
      from: "on"
      to: "off"
      for: "00:00:45"

  action:
    - choose:
        # Turn ON power saving when driving
        - conditions:
            - condition: trigger
              id: start_driving
            # Only if not already in power saving mode
            - condition: state
              entity_id: input_boolean.power_saving_mode
              state: "off"
          sequence:
            - action: script.power_saving_mode_on

        # Turn OFF power saving when stopped
        - conditions:
            - condition: trigger
              id: stop_driving
            # Only if currently in power saving mode
            - condition: state
              entity_id: input_boolean.power_saving_mode
              state: "on"
            # and someone stayed in the van
            - condition: state
              entity_id: binary_sensor.van_occupied
              state: "on"
          sequence:
            - action: script.power_saving_mode_off

        # Turn OFF power saving 45 s after the engine stops if the radar sees
        # someone now or within 30 s. van_occupied alone isn't enough: it
        # holds "on" for 3 min after you leave.
        - conditions:
            - condition: trigger
              id: engine_off
            - condition: state
              entity_id: input_boolean.power_saving_mode
              state: "on"
            - condition: state
              entity_id: binary_sensor.vehicle_is_moving
              state: "off"
            - condition: state
              entity_id: input_boolean.sleep_mode
              state: "off"
            - condition: state
              entity_id: binary_sensor.van_occupied
              state: "on"
          sequence:
            - wait_template: "{{ is_state('binary_sensor.apollo_msr_2_1731d8_radar_target', 'on') }}"
              timeout: "00:00:30"
              continue_on_timeout: false
            # Still parked and still saving after the wait
            - condition: state
              entity_id: input_boolean.power_saving_mode
              state: "on"
            - condition: state
              entity_id: binary_sensor.engine_is_running
              state: "off"
            - action: script.power_saving_mode_off
            - action: system_log.write
              data:
                level: info
                logger: automation.power_saving
                message: "Power saving mode disabled – engine off and someone inside"

# ────────────────────────────────────────────────────────────────
# Ducking in pulseaudio
# ────────────────────────────────────────────────────────────────
# The following automation is used to setup the ducking module in pulse audio which lowers the volume of music from airplay/audio from PC when HA is playing audio through the VLC media player
- alias: "VBAN audio receiver"
  mode: single
  trigger:
    - trigger: homeassistant
      event: start # fires when HA has finished booting
  action:
    - delay: "00:00:15" # let hassio_audio come online
    - action: shell_command.start_vban_receptor

- alias: Shelly EM – one-second ping updater
  mode: single # don’t queue if it takes longer than a second
  max_exceeded: silent # a 1 Hz poll that occasionally runs long shouldn't spam "Already running"
  trigger:
    - trigger: time_pattern
      seconds: "/1" # fires every 1 s
  action:
    - action: homeassistant.update_entity
      target:
        entity_id: binary_sensor.192_168_10_174 # <- your Ping entity

- alias: Inverter, clear pending when ping changes
  mode: queued
  trigger:
    - trigger: state
      entity_id: binary_sensor.192_168_10_174 # your 1 s-updated Ping entity
  action:
    - action: input_boolean.turn_off
      target: { entity_id: input_boolean.inverter_toggle_pending }

# ───────────────────────────────────────────────
#  Bed lift power – auto-off safety timer (30 s)
# ───────────────────────────────────────────────
- id: bed_power_auto_off_30s
  alias: "Bed Power Supply • auto-off after 30 s"
  mode: restart # restarts the 30 s countdown every time the switch is (re)turned on
  trigger:
    # Start / restart the countdown whenever the bed-power switch turns ON
    - trigger: state
      entity_id: switch.a32_pro_switch27_bed_power_supply
      to: "on"
  action:
    # Wait exactly 30 s
    - delay: "00:00:30"
    # Cut power to the bed motor
    - action: switch.turn_off
      target:
        entity_id: switch.a32_pro_switch27_bed_power_supply

- id: keep_home_zone_on_starlink
  alias: Keep Home zone on GPS
  mode: single
  trigger:
    - trigger: time_pattern # every 15 min
      minutes: "/5"
  condition:
    - "{{ state_attr('device_tracker.ublox_gps', 'latitude') not in [none, 'unknown', 'unavailable'] }}"
  action:
    - action: homeassistant.set_location
      data:
        latitude: "{{ state_attr('device_tracker.ublox_gps', 'latitude')  }}"
        longitude: "{{ state_attr('device_tracker.ublox_gps', 'longitude') }}"
        elevation: "{{ (state_attr('device_tracker.ublox_gps', 'altitude') | float(0)) | round(0) | int }}"

# ───────────────────────────────────────────────
# Rolling snapshot of "last active state" @ 1 Hz
# ───────────────────────────────────────────────
# automation: rolling_last_active_snapshot_1hz
- id: rolling_last_active_snapshot_1hz
  alias: "Rolling Snapshot • Last Active State (1 Hz)"
  mode: single
  trigger:
    - trigger: time_pattern
      seconds: "/1"
  condition:
    - condition: state
      entity_id: input_boolean.power_saving_mode
      state: "off"
  action:
    - action: scene.create
      data:
        scene_id: last_active_state
        snapshot_entities:
          - light.led_controller_cct_1
          - light.led_controller_cct_2
          - light.led_controller_sc_1
          - light.led_controller_sc_2
          - switch.a32_pro_do8_switch06_top_monitor
          - switch.a32_pro_do8_switch07_bottom_monitor
          - switch.a32_pro_water_system_master_switch # ← added

# automation: rolling_snapshot_bootstrap_on_start
- id: rolling_snapshot_bootstrap_on_start
  alias: "Rolling Snapshot • Bootstrap on HA start"
  trigger:
    - trigger: homeassistant
      event: start
  condition:
    - condition: state
      entity_id: input_boolean.power_saving_mode
      state: "off"
  action:
    - action: scene.create
      data:
        scene_id: last_active_state
        snapshot_entities:
          - light.led_controller_cct_1
          - light.led_controller_cct_2
          - light.led_controller_sc_1
          - light.led_controller_sc_2
          - switch.a32_pro_do8_switch06_top_monitor
          - switch.a32_pro_do8_switch07_bottom_monitor
          - switch.a32_pro_water_system_master_switch # ← added

# ────────────────────────────────────────────────────────────────
# Shower Mode – on-activation actions
# ────────────────────────────────────────────────────────────────
- id: shower_mode_on_actions
  alias: "Shower Mode – Turn on lights and recirculate"
  mode: single
  trigger:
    - trigger: state
      entity_id: input_boolean.shower_mode
      from: "off"
      to: "on"
  action:
    # Snapshot current shower-related states for later restore
    - action: scene.create
      data:
        scene_id: pre_shower_mode_state
        snapshot_entities:
          - light.shower_lighting_switch
          - light.led_controller_sc_1
          - switch.a32_pro_water_system_master_switch
          - switch.a32_pro_water_system_state_main
          - switch.a32_pro_water_system_state_recirculating_shower

    # Turn shower lights on (linked via blueprint with controller)
    - action: light.turn_on
      target:
        entity_id:
          - light.shower_lighting_switch
          - light.led_controller_sc_1
      data:
        brightness_pct: 100

    # Ensure water system master is ON
    - action: switch.turn_on
      target:
        entity_id: switch.a32_pro_water_system_master_switch

    # Small delay to let master switch settle
    - delay: "00:00:01"

    # Set water system state to Recirculating Shower
    - action: switch.turn_on
      target:
        entity_id: switch.a32_pro_water_system_state_recirculating_shower

    # Open roof fan lid (needed for exhaust)
    - action: cover.open_cover
      target:
        entity_id: cover.ag_pro_roof_fan_lid

    # Set roof fan to exhaust and 60%
    - action: fan.set_direction
      data:
        entity_id: fan.ag_pro_roof_fan
        direction: forward # exhaust
    - action: fan.turn_on
      data:
        entity_id: fan.ag_pro_roof_fan
        percentage: 60

# ────────────────────────────────────────────────────────────────
# Shower Mode – off restores previous state
# ────────────────────────────────────────────────────────────────
- id: shower_mode_off_restore
  alias: "Shower Mode – Restore previous state on OFF"
  mode: single
  trigger:
    - trigger: state
      entity_id: input_boolean.shower_mode
      from: "on"
      to: "off"
  action:
    - action: scene.turn_on
      target:
        entity_id: scene.pre_shower_mode_state

# ────────────────────────────────────────────────────────────────
# Sleep Mode – lights, monitors, inverter and water off at once, the night
# climate starts
#   Triggered by input_boolean.sleep_mode so the dashboard toggle,
#   voice "goodnight", script.sleep_mode_on and Night on the Climate
#   Program card (night_climate_night_starts_sleep) all run this routine.
#   The Night program itself is started by night_climate_start_on_sleep.
#   Until 2026-10-05 this dimmed the lights for a 5-min wind-down; the
#   user asked for everything off when they press Sleep. Since 2026-10-07
#   the inverter and the water system go off too (the user had been
#   switching both off by hand after Sleep). What was on is remembered
#   first: Sleep off puts it back (sleep_mode_off_restore), within the
#   first 5 min the lights as well.
# ────────────────────────────────────────────────────────────────
- id: sleep_mode_on_actions
  alias: "Sleep Mode – lights, inverter and water off on toggle ON"
  # restart: re-pressing (off→on) starts a fresh cycle with a new snapshot
  mode: restart
  trigger:
    - trigger: state
      entity_id: input_boolean.sleep_mode
      from: "off"
      to: "on"
  action:
    # New wind-down cycle: clear the "completed" flag (so an OFF during the
    # next 5 min is treated as a cancel, not a morning wake).
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.sleep_winddown_complete

    # Snapshot current LIGHT states so we can restore them on cancel
    - action: scene.create
      data:
        scene_id: pre_sleep_mode_lights
        # LED controllers ONLY — do not snapshot the physical switches.
        # Restoring controller + mirrored switch together made the linked-
        # entities blueprint cross-fire and clobber brightness on restore.
        # The switches follow their controllers via the blueprint.
        snapshot_entities:
          - light.led_controller_cct_1
          - light.led_controller_cct_2
          - light.led_controller_sc_1
          - light.led_controller_sc_2

    # Snapshot the monitors and the water system. The master alone is
    # enough: switching it on brings back the last state (Main, shower...).
    - action: scene.create
      data:
        scene_id: pre_sleep_mode_devices
        snapshot_entities:
          - switch.a32_pro_do8_switch06_top_monitor
          - switch.a32_pro_do8_switch07_bottom_monitor
          - switch.a32_pro_water_system_master_switch

    # The inverter is a toggle button and a ping, which a scene cannot hold.
    # A helper, so it also survives a restart in the night.
    - action: >-
        input_boolean.turn_{{ 'on' if is_state('binary_sensor.192_168_10_174', 'on') else 'off' }}
      target:
        entity_id: input_boolean.sleep_restore_inverter

    # Turn off both monitors
    - action: switch.turn_off
      target:
        entity_id:
          - switch.a32_pro_do8_switch06_top_monitor
          - switch.a32_pro_do8_switch07_bottom_monitor

    # Every interior light off
    - action: light.turn_off
      target:
        entity_id:
          - light.led_controller_cct_1
          - light.led_controller_cct_2
          - light.led_controller_sc_1
          - light.led_controller_sc_2
          - light.main_lighting_switch
          - light.under_cabinet_lighting_switch

    # Water system off, unless someone is in the shower (as power saving)
    - if:
        - condition: state
          entity_id: input_boolean.shower_mode
          state: "off"
      then:
        - action: switch.turn_off
          target:
            entity_id: switch.a32_pro_water_system_master_switch

    # Inverter off. A manual lock left over from an earlier hand "off" means
    # nothing while it is on (2026-10-07 it was still set from 10-06 04:58),
    # and script.inverter_ensure_on would refuse the morning restore.
    - if:
        - condition: state
          entity_id: binary_sensor.192_168_10_174
          state: "on"
      then:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.inverter_manual_lock
        - action: script.inverter_ensure_off

    # Schedule Starlink sleep start (+30 min). continue_on_error so a Starlink
    # hiccup (e.g. time entity unavailable) can never abort the routine
    # before the 5-min cancel window below.
    - action: script.starlink_sleep_start_after_30m
      continue_on_error: true

    # Set Starlink sleep END to 08:15 MST equivalent in current local time
    - continue_on_error: true
      choose:
        - conditions:
            - condition: template
              value_template: "{{ states('time.starlink_sleep_end') not in ['unknown', 'unavailable'] }}"
          sequence:
            - action: time.set_value
              target:
                entity_id: time.starlink_sleep_end
              data:
                time: >
                  {% set mst_offset = -7 %}  {# MST fixed UTC-7 #}
                  {% set local_offset = (now().utcoffset().total_seconds() / 3600) | int %}
                  {% set delta = local_offset - mst_offset %}
                  {% set hour = (8 + delta) % 24 %}
                  {{ '%02d:%02d:%02d' % (hour, 15, 0) }}

    # 5 min in which Sleep off is a cancel (everything back as it was, the
    # lights too); after that mark as asleep so the next OFF is the morning.
    - delay: "00:05:00"
    - if:
        - condition: state
          entity_id: input_boolean.sleep_mode
          state: "on"
      then:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.sleep_winddown_complete

# ────────────────────────────────────────────────────────────────
# Sleep Mode – cancel or morning (toggle OFF)
#   The monitors, the water system and the inverter go back to how they were
#   before Sleep. The lights:
#     • within 5 min of Sleep on (a cancel) → back as they were
#     • later (the wake time, or by hand)   → the main light alone at 10 %
#       (5000 K, 20 s fade)
#   The user's wish 2026-10-08; from 10-07 the morning was main and
#   under-cabinet at 100 % plus the skylight at 100 %. Until 10-07 it restored the
#   pre-sleep lights plus the under-cabinet at 30 %, forced the water on to
#   Main, and re-applied scene.last_active_state, which
#   rolling_last_active_snapshot_1hz rewrites every second, so it held the
#   sleeping state.
#   Always clears the flag and resets the Starlink schedule (1 AM MST).
# ────────────────────────────────────────────────────────────────
- id: sleep_mode_off_restore
  alias: "Sleep Mode – Cancel restore / morning wake on toggle OFF"
  mode: restart
  trigger:
    - trigger: state
      entity_id: input_boolean.sleep_mode
      from: "on"
      to: "off"
  action:
    # Monitors and water system as before Sleep. scene.create scenes live in
    # memory only: after a restart in the night both simply come back on.
    - if:
        - "{{ states.scene.pre_sleep_mode_devices is not none }}"
      then:
        - action: scene.turn_on
          target:
            entity_id: scene.pre_sleep_mode_devices
      else:
        - action: switch.turn_on
          target:
            entity_id:
              - switch.a32_pro_do8_switch06_top_monitor
              - switch.a32_pro_do8_switch07_bottom_monitor
              - switch.a32_pro_water_system_master_switch

    - choose:
        # ── Morning: the main light low ──
        - conditions:
            - condition: state
              entity_id: input_boolean.sleep_winddown_complete
              state: "on"
          sequence:
            # The controller only: the wall switch follows it (blueprint).
            - action: light.turn_on
              target:
                entity_id: light.led_controller_cct_1   # main
              data:
                brightness_pct: 10
                color_temp_kelvin: 5000
                transition: 20
      # ── Cancel: lights back as they were ──
      default:
        - action: scene.turn_on
          target:
            entity_id: scene.pre_sleep_mode_lights

    # Clear the wind-down flag for the next cycle
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.sleep_winddown_complete

    # Revert Starlink sleep start to the default nightly window
    # (1 AM MST), undoing the +30 min override set on sleep-on.
    - action: script.starlink_sleep_start_default
      continue_on_error: true

    # Inverter last. After a quick cancel it may still be finishing the
    # shutdown Sleep started (about 25 s, the ping still on), and ensure_on
    # only presses the button while it reads off, so give the last press
    # 45 s. ensure_on still respects a manual lock set during the night.
    - if:
        - condition: state
          entity_id: input_boolean.sleep_restore_inverter
          state: "on"
      then:
        - delay: >-
            {% set b = states.button.a32_pro_inverter_on_off_toggle %}
            {{ [0, 45 - ((now() - b.last_changed).total_seconds() if b is not none else 45)] | max | int }}
        - action: script.inverter_ensure_on

# ───────────────────────────────────────────────
#  Heater low-fuel lockout – auto-clear when fuel recovers
# ───────────────────────────────────────────────
# When the stable fuel level rises above 30% (hysteresis above
# the 25% lockout threshold), automatically clear the lockout
# so the heater can be used again without manual intervention.

- id: heater_fuel_lockout_auto_clear
  alias: "Heater – Clear low fuel lockout when fuel > 30%"
  mode: single
  trigger:
    - trigger: numeric_state
      entity_id: sensor.stable_fuel_level
      above: 30
      for:
        minutes: 2
  condition:
    - condition: state
      entity_id: input_boolean.heater_low_fuel_lockout
      state: "on"
  action:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.heater_low_fuel_lockout
    - action: system_log.write
      data:
        message: "Heater low fuel lockout cleared – fuel above 30%."
        level: info

- id: osrm_proxy_start_on_boot
  alias: "OSRM Proxy • Start on HA boot"
  mode: single
  trigger:
    - trigger: homeassistant
      event: start
  action:
    - delay: "00:00:35"
    - action: shell_command.start_osrm_proxy

- id: gps_ublox_start_on_boot
  alias: "GPS u-blox • Start on HA boot"
  mode: single
  trigger:
    - trigger: homeassistant
      event: start
  action:
    - delay: "00:00:40"
    - action: shell_command.start_gps_ublox

- id: gps_filter_start_on_boot
  alias: "GPS Filter • Start on HA boot"
  mode: single
  trigger:
    - trigger: homeassistant
      event: start
  action:
    - delay: "00:00:45"
    - action: shell_command.start_gps_filter

- id: dvr_proxy_start_on_boot
  alias: "DVR Proxy • Start on HA boot"
  mode: single
  trigger:
    - trigger: homeassistant
      event: start
  action:
    - delay: "00:00:40"
    - action: shell_command.start_dvr_proxy

# ───────────────────────────────────────────────
#  Shelly EM – reconnect when inverter turns on
# ───────────────────────────────────────────────
# The Shelly EM is powered by the inverter's AC output.
# When the inverter is off, the Shelly is unreachable and
# HA puts the integration into a retry backoff. When the
# ping sensor detects the Shelly is back, force a config
# entry reload so entities become available immediately.
- id: shelly_em_reconnect_on_inverter
  alias: "Shelly EM • Reconnect when inverter turns on"
  mode: single
  trigger:
    - trigger: state
      entity_id: binary_sensor.192_168_10_174
      from: "off"
      to: "on"
      for: "00:00:05"
  action:
    - action: homeassistant.reload_config_entry
      data:
        entry_id: 01JZ9P031ZD8WK711KS3ER124D

# ───────────────────────────────────────────────
#  Inverter state tracking (input_boolean.inverter_state)
# ───────────────────────────────────────────────
# Uses the fast ping sensor (1s updates) to maintain a
# stored on/off state for the inverter. The frontend reads
# this instead of the slow Shelly voltage sensor (~40s lag).
- id: inverter_state_track_on
  alias: "Inverter State • Track ON"
  mode: single
  trigger:
    - trigger: state
      entity_id: binary_sensor.192_168_10_174
      from: "off"
      to: "on"
      for: "00:00:03"
  action:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.inverter_state

- id: inverter_state_track_off
  alias: "Inverter State • Track OFF"
  mode: single
  trigger:
    - trigger: state
      entity_id: binary_sensor.192_168_10_174
      from: "on"
      to: "off"
      for: "00:00:03"
  action:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.inverter_state

# ───────────────────────────────────────────────
#  Inverter manual lock (respect a manual off)
# ───────────────────────────────────────────────
# When YOU press the inverter button, remember the direction you chose so the
# power-saving / wake "ensure on" flows don't fight you:
#   • you turned it OFF  → set the lock  → ensure_on is suppressed
#   • you turned it ON   → clear the lock → auto behavior resumes
# Script/automation presses run without a user context, so they're ignored.
- id: inverter_manual_lock_manager
  alias: "Inverter • Manual lock follows user press"
  mode: queued
  max: 5
  trigger:
    - trigger: state
      entity_id: button.a32_pro_inverter_on_off_toggle
  condition:
    # Only react to a DIRECT user press of the inverter button: a real user
    # (user_id set) and not a press cascaded from a script/automation
    # (parent_id is None). Scripts pressing the button never satisfy both.
    - "{{ trigger.to_state is not none
          and trigger.to_state.context.user_id is not none
          and trigger.to_state.context.parent_id is none }}"
  action:
    # Wait for the press to land: inverter_state flips once the 1 s ping has
    # seen the change for 3 s. Switching OFF takes ~25 s (the inverter's own
    # shutdown); a fixed 10 s wait read it as still on and cleared the lock
    # instead of setting it, so the next power-saving exit switched it back on
    # (2026-10-01 20:37, 2026-10-02 15:32).
    - variables:
        was_on: "{{ is_state('input_boolean.inverter_state', 'on') }}"
    - wait_template: "{{ is_state('input_boolean.inverter_state', 'off' if was_on else 'on') }}"
      timeout: "00:01:00"
      continue_on_timeout: true
    - if:
        - condition: state
          entity_id: input_boolean.inverter_state
          state: "off"
      then:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.inverter_manual_lock
      else:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.inverter_manual_lock

# ────────────────────────────────────────────────────────────────
# WiCAN OBD — PID Logging on Engine Start (native integration)
# ────────────────────────────────────────────────────────────────
- id: wican_drive_start_log
  alias: "WiCAN • Log PIDs on engine start"
  mode: single
  trigger:
    - trigger: state
      entity_id: binary_sensor.engine_is_running
      from: "off"
      to: "on"
      for: "00:00:10"
  action:
    - action: system_log.write
      data:
        level: info
        logger: automation.wican_drive_log
        message: >
          === DRIVE START — PID Snapshot ===
          Time: {{ now().isoformat() }}
          Speed: {{ states('sensor.192_168_10_90_0d_vehiclespeed') }} km/h
          RPM: {{ states('sensor.192_168_10_90_0c_enginerpm') }}
          Fuel: {{ states('sensor.192_168_10_90_2f_fueltanklevel') }}%
          Coolant: {{ states('sensor.192_168_10_90_05_enginecoolanttemp') }}°C
          Throttle: {{ states('sensor.192_168_10_90_11_throttleposition') }}%
          Load: {{ states('sensor.192_168_10_90_04_calcengineload') }}%
          ECU Volt: {{ states('sensor.192_168_10_90_42_controlmodulevolt') }} V
          Ambient: {{ states('sensor.192_168_10_90_46_ambientairtemp') }}°C
          Tires FL/FR/RL/RR: {{ states('sensor.192_168_10_90_tyre_p_fl') }}/{{ states('sensor.192_168_10_90_tyre_p_fr') }}/{{ states('sensor.192_168_10_90_tyre_p_rl') }}/{{ states('sensor.192_168_10_90_tyre_p_rr') }} psi
          Trans: {{ states('sensor.192_168_10_90_tran_f_temp') }}°C
          Gear: {{ states('sensor.192_168_10_90_gear') }}
          Oil Life: {{ states('sensor.192_168_10_90_oil_life') }}%
          Wastegate: {{ states('sensor.192_168_10_90_wastegate') }}%
          Intake Air: {{ states('sensor.192_168_10_90_intake_air_tmp') }}°C
          Fuel Pressure: {{ states('sensor.192_168_10_90_fuel_pressure') }} kPa
          DTC Count: {{ states('sensor.dtc_count') }} | CEL: {{ states('binary_sensor.check_engine_light') }}
    - action: persistent_notification.create
      data:
        title: "Drive Start — OBD Snapshot {{ now().strftime('%H:%M') }}"
        message: >
          Speed: {{ states('sensor.192_168_10_90_0d_vehiclespeed') }} km/h | RPM: {{ states('sensor.192_168_10_90_0c_enginerpm') }}
          Fuel: {{ states('sensor.192_168_10_90_2f_fueltanklevel') }}% | Coolant: {{ states('sensor.192_168_10_90_05_enginecoolanttemp') }}°C
          Throttle: {{ states('sensor.192_168_10_90_11_throttleposition') }}% | Load: {{ states('sensor.192_168_10_90_04_calcengineload') }}%
          Tires FL/FR/RL/RR: {{ states('sensor.192_168_10_90_tyre_p_fl') }}/{{ states('sensor.192_168_10_90_tyre_p_fr') }}/{{ states('sensor.192_168_10_90_tyre_p_rl') }}/{{ states('sensor.192_168_10_90_tyre_p_rr') }} psi
          Trans: {{ states('sensor.192_168_10_90_tran_f_temp') }}°C | Gear: {{ states('sensor.192_168_10_90_gear') }}
          Oil: {{ states('sensor.192_168_10_90_oil_life') }}% | Wastegate: {{ states('sensor.192_168_10_90_wastegate') }}%
          DTC: {{ states('sensor.dtc_count') }} | CEL: {{ states('binary_sensor.check_engine_light') }}
