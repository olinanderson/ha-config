# ────────────────────────────────────────────────────────────────
# Host Python daemons — liveness watchdog
# ────────────────────────────────────────────────────────────────
# The osrm_proxy / gps_ublox / gps_filter / dvr_proxy daemons run inside the HA
# Core container and are otherwise only (re)started on full HA boot. When one
# crashes mid-run (e.g. osrm_proxy + gps_filter both found dead 2026-06-23,
# gps_filter down since ~06-22) nothing relaunches it and the vanlife map goes
# blank until the next restart.
#
# This re-runs the idempotent start_* commands every 3 min. Each one self-guards
# (port nc-check for the proxies, /tmp pid-file + kill -0 for the gps daemons),
# so it's a no-op when the daemon is alive and a clean relaunch when it's dead —
# crash recovery within ~3 min instead of waiting for a reboot. When a daemon was
# actually dead its start command prints "...started" (not "already running"), so
# we log a warning naming it: a crash trail for root-causing repeat offenders.
- id: daemons_liveness_watchdog
  alias: "Daemons • Liveness watchdog"
  initial_state: true  # always armed after a restart, regardless of restored state
  mode: single
  max_exceeded: silent
  trigger:
    - trigger: time_pattern
      minutes: "/3"
  action:
    - action: shell_command.start_osrm_proxy
      response_variable: osrm_r
    - action: shell_command.start_gps_ublox
      response_variable: ublox_r
    - action: shell_command.start_gps_filter
      response_variable: filter_r
    - action: shell_command.start_dvr_proxy
      response_variable: dvr_r
    # Each start_* echoes one of three things: "...already running" (was alive,
    # no-op), "...started" (was dead → relaunched: the crash event we want a
    # trail of), or an error with neither (start was attempted but not confirmed,
    # e.g. gps_filter with a missing token). Split those so the warning labels are
    # accurate instead of calling a failed start a "relaunch".
    - variables:
        relaunched: >-
          {% set ns = namespace(d=[]) %}
          {% if 'started' in (osrm_r.stdout | default('')) %}{% set ns.d = ns.d + ['osrm_proxy (8765)'] %}{% endif %}
          {% if 'started' in (ublox_r.stdout | default('')) %}{% set ns.d = ns.d + ['gps_ublox'] %}{% endif %}
          {% if 'started' in (filter_r.stdout | default('')) %}{% set ns.d = ns.d + ['gps_filter'] %}{% endif %}
          {% if 'started' in (dvr_r.stdout | default('')) %}{% set ns.d = ns.d + ['dvr_proxy (8766)'] %}{% endif %}
          {{ ns.d | join(', ') }}
        failed: >-
          {% set ns = namespace(d=[]) %}
          {% set o = osrm_r.stdout | default('') %}{% if 'already running' not in o and 'started' not in o %}{% set ns.d = ns.d + ['osrm_proxy (8765)'] %}{% endif %}
          {% set u = ublox_r.stdout | default('') %}{% if 'already running' not in u and 'started' not in u %}{% set ns.d = ns.d + ['gps_ublox'] %}{% endif %}
          {% set f = filter_r.stdout | default('') %}{% if 'already running' not in f and 'started' not in f %}{% set ns.d = ns.d + ['gps_filter'] %}{% endif %}
          {% set v = dvr_r.stdout | default('') %}{% if 'already running' not in v and 'started' not in v %}{% set ns.d = ns.d + ['dvr_proxy (8766)'] %}{% endif %}
          {{ ns.d | join(', ') }}
    # Relaunched a dead daemon → warning (the crash trail for root-causing).
    - if: "{{ relaunched | trim | length > 0 }}"
      then:
        - action: system_log.write
          data:
            level: warning
            logger: watchdog.daemons
            message: "Relaunched dead host daemon(s): {{ relaunched | trim }}"
    # Start attempted but daemon never confirmed up → error (won't self-heal).
    - if: "{{ failed | trim | length > 0 }}"
      then:
        - action: system_log.write
          data:
            level: error
            logger: watchdog.daemons
            message: "Host daemon(s) failed to start (check their .log): {{ failed | trim }}"

# ────────────────────────────────────────────────────────────────
# Ready-to-Drive Guard — warn on camp items still active at departure
# ────────────────────────────────────────────────────────────────
# When the van heads toward driving (engine start / park-brake release / motion),
# if any "hard" camp-teardown item is still active (sensor.rtd_offenders > 0),
# raise a persistent_notification listing the offenders. A fixed notification_id
# means the 3 triggers update ONE card instead of stacking — so no de-nag helper
# is needed. Suppressed while input_boolean.rtd_guard_override ("I know") is on.
# The React "Ready to Drive" banner (Home page) is the always-live visual; this
# automation is the notification so you're warned even without the dashboard open.
- id: rtd_guard_warn
  alias: "Ready-to-Drive Guard • warn on camp items"
  mode: single
  trigger:
    - trigger: state
      entity_id: binary_sensor.engine_is_running
      from: "off"
      to: "on"
      for: "00:00:05"          # debounce the start-up RPM flicker
    - trigger: state
      entity_id: sensor.192_168_10_90_park_brake
      to: "0"                  # park brake released
    - trigger: state
      entity_id: binary_sensor.vehicle_is_moving
      from: "off"
      to: "on"                 # last-ditch net
  condition:
    - condition: state
      entity_id: input_boolean.rtd_guard_override
      state: "off"
    - condition: state
      entity_id: binary_sensor.rtd_needs_attention
      state: "on"
  action:
    - action: persistent_notification.create
      data:
        notification_id: rtd_guard
        title: "⚠ Not ready to drive — {{ states('sensor.rtd_offenders') }} item(s)"
        message: "• {{ state_attr('sensor.rtd_offenders', 'summary') }}"

# Clear the warning automatically once everything is stowed/off.
- id: rtd_guard_clear
  alias: "Ready-to-Drive Guard • dismiss when clear"
  mode: single
  trigger:
    - trigger: state
      entity_id: binary_sensor.rtd_needs_attention
      # A template reload flips the sensor on → unavailable → off → on within
      # a second (seen 2026-09-14 and 09-16). Without `from`, that dismissed
      # the warning while items were still out.
      from: "on"
      to: "off"
  action:
    - action: persistent_notification.dismiss
      data:
        notification_id: rtd_guard

# "I know" only lasts the current drive — clear the override when the engine stops.
- id: rtd_guard_override_autoclear
  alias: "Ready-to-Drive Guard • clear override on engine off"
  mode: single
  trigger:
    - trigger: state
      entity_id: binary_sensor.engine_is_running
      from: "on"
      to: "off"
      for: "00:00:30"
  condition:
    - condition: state
      entity_id: input_boolean.rtd_guard_override
      state: "on"
  action:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.rtd_guard_override

# ────────────────────────────────────────────────────────────────
# NWS severe-weather alert — notify on a NEW Severe/Extreme alert at the van
# ────────────────────────────────────────────────────────────────
# sensor.nws_highest_alert (rest, resource_template = live GPS) tracks the
# highest active NWS alert at the van's location. Fire a persistent_notification
# only when a Severe/Extreme alert appears whose id we haven't already notified
# (input_text.nws_last_notified_id), so a 5-min re-poll of the same alert stays
# silent. persistent_notification is the only delivery configured (no mobile push).
- id: nws_severe_alert_notify
  alias: "NWS • notify on new severe alert at van location"
  mode: single
  trigger:
    - trigger: state
      entity_id: sensor.nws_highest_alert
  condition:
    - condition: template
      value_template: "{{ states('sensor.nws_highest_alert') not in ['none','unknown','unavailable',''] }}"
    - condition: template
      value_template: "{{ state_attr('sensor.nws_highest_alert','highest_severity') in ['Extreme','Severe'] }}"
    - condition: template
      value_template: "{{ state_attr('sensor.nws_highest_alert','alert_id') != states('input_text.nws_last_notified_id') }}"
  action:
    - action: persistent_notification.create
      data:
        notification_id: nws_alert
        title: "⚠️ {{ states('sensor.nws_highest_alert') }}"
        message: >
          {{ state_attr('sensor.nws_highest_alert','headline')
             or 'Severe weather alert active at your location.' }}
    - action: input_text.set_value
      target:
        entity_id: input_text.nws_last_notified_id
      data:
        value: "{{ state_attr('sensor.nws_highest_alert','alert_id') }}"


# ────────────────────────────────────────────────────────────────
# Starlink • auto-recover from the PoE DC-DC converter lockup
# ────────────────────────────────────────────────────────────────
# While driving, the DC-DC converter feeding the Starlink PoE injector sometimes
# latches up: the dish goes completely unreachable and stays that way until the
# injector is fully de-energised long enough to drain (or the ethernet is pulled
# at the dish end). See script.starlink_recover for the timing rationale.
#
# The 15-minute debounce is set from 45 days of history, not taste. Short
# `unavailable` blips are extremely common and self-heal — 789 spans under a
# minute, ~36 more under 15 minutes. Everything that actually needed hands ran
# far longer (2026-08-07: 91 min; 2026-08-06: 242 min; 2026-07-18: 230 min), so
# 15 min cleanly separates "real lockup" from "integration hiccup" while still
# cutting today's outage from 91 minutes down to about 17.
#
# A template trigger (not a state trigger) so it also re-arms correctly if HA
# restarts or reloads while the dish is already dark — a state trigger would
# need a transition that has already happened and would never fire.
#
# The supply switch is part of the template so the trigger re-arms when the
# supply comes back on. Without it, the 23:00 night-off made the dish
# unreachable, the 15 minutes ran out while the supply was still off (so the
# condition below blocked it), and the template then stayed true all night: on
# 2026-09-29 the dish failed to come back at 08:00 and nothing retried it until
# it was cycled by hand at 15:00.
- id: starlink_auto_recover
  alias: "Starlink • auto power-cycle when the link drops"
  mode: single
  trigger:
    - trigger: template
      value_template: >
        {{ is_state('switch.a32_pro_switch26_starlink_power_supply', 'on')
           and states('binary_sensor.starlink_connectivity') in ['unavailable', 'unknown'] }}
      for: "00:15:00"
  condition:
    - condition: state
      entity_id: input_boolean.starlink_auto_recovery
      state: "on"
    # Never fight a deliberate manual cut — if YOU switched the supply off, the
    # dish being unreachable is the intended outcome, not a fault.
    - condition: state
      entity_id: switch.a32_pro_switch26_starlink_power_supply
      state: "on"
    - condition: state
      entity_id: input_boolean.starlink_recovery_in_progress
      state: "off"
    # Already tried twice and gave up — don't cycle the supply forever.
    # Cleared by starlink_recovery_reset once the link genuinely returns.
    - condition: state
      entity_id: input_boolean.starlink_recovery_failed
      state: "off"
  action:
    - action: script.turn_on
      target:
        entity_id: script.starlink_recover

# Link is genuinely back → clear the latch so the banner disappears and the next
# lockup gets a fresh pair of attempts. The 5-minute hold stops a dish that is
# flapping in and out from re-arming the retries every few seconds.
- id: starlink_recovery_reset
  alias: "Starlink • clear recovery latch when the link returns"
  mode: single
  trigger:
    - trigger: template
      value_template: >
        {{ states('binary_sensor.starlink_connectivity') not in ['unavailable', 'unknown'] }}
      for: "00:05:00"
  condition:
    - condition: state
      entity_id: input_boolean.starlink_recovery_in_progress
      state: "off"
    # Only act when there is actually something to clear.
    - condition: template
      value_template: >
        {{ is_state('input_boolean.starlink_recovery_failed', 'on')
           or states('input_number.starlink_recovery_attempts') | int(0) > 0 }}
  action:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.starlink_recovery_failed
    - action: input_number.set_value
      target:
        entity_id: input_number.starlink_recovery_attempts
      data:
        value: 0
    - action: persistent_notification.dismiss
      data:
        notification_id: starlink_recovery

# Fail-safe: never leave the dish de-energised because HA restarted mid-cycle.
# script.starlink_recover holds the supply OFF for 90 s. A restart (or a crash)
# inside that window kills the script without its turn_on step ever running, and
# the ESPHome switch's RESTORE_DEFAULT_ON only helps if the ESP itself reboots —
# not if HA does. in_progress still being ON at startup is exactly that
# signature, so re-energise and clear the flag.
- id: starlink_recovery_resume_after_restart
  alias: "Starlink • re-energise supply if a restart interrupted recovery"
  mode: single
  trigger:
    - trigger: homeassistant
      event: start
  condition:
    - condition: state
      entity_id: input_boolean.starlink_recovery_in_progress
      state: "on"
  action:
    - action: switch.turn_on
      target:
        entity_id: switch.a32_pro_switch26_starlink_power_supply
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.starlink_recovery_in_progress
    - action: persistent_notification.create
      data:
        notification_id: starlink_recovery
        title: "🛰 Starlink recovery interrupted"
        message: >
          Home Assistant restarted while the Starlink power supply was cut. The
          supply has been switched back on. If the dish is still offline, the
          recovery will start again on its own in about 15 minutes.

# ════════════════════════════════════════════════════════════════
#  SHOP MODE — hands-off lockout while the van is at a shop
# ════════════════════════════════════════════════════════════════
# Arm by toggling input_boolean.shop_mode (dashboard, voice, or
# script.shop_mode_enter). What the mode actually does lives in
# script.shop_mode_apply — these automations only drive it.
#
# What this CANNOT do, and you should plan around:
#   • The physical rocker switches are wired to the a32_pro directly. HA
#     turning a light "off" does not stop someone flipping the rocker.
#   • It cannot stop the shop pulling the battery disconnect — which is the
#     standard advice for shop visits anyway, and is strictly safer than
#     anything HA can do in software.
# ════════════════════════════════════════════════════════════════

- id: shop_mode_on_actions
  alias: "Shop Mode • arm lockout"
  mode: single
  trigger:
    - trigger: state
      entity_id: input_boolean.shop_mode
      from: "off"
      to: "on"
  action:
    # Record which automations were ALREADY disabled before arming, so exit can
    # put things back exactly as they were instead of blanket-enabling. Written
    # BEFORE script.shop_mode_apply disables everything, or the list would just
    # be "all of them". 'OVERFLOW' means it did not fit the 255-char input_text
    # cap, and exit falls back to enabling everything.
    - action: input_text.set_value
      target:
        entity_id: input_text.shop_mode_prev_disabled
      data:
        value: >-
          {% set off = states.automation | selectattr('state', 'eq', 'off')
               | map(attribute='entity_id') | map('replace', 'automation.', '')
               | list %}
          {% set j = off | join(',') %}
          {{ 'none' if off | count == 0 else (j if j | length <= 255 else 'OVERFLOW') }}

    # Snapshot ONLY the comfort items we are willing to bring back automatically
    # on exit. Gas, water, heat, bed lift and the compressor are deliberately
    # excluded — those get turned back on by hand, deliberately, not by a toggle
    # tapped in a shop parking lot.
    - action: scene.create
      data:
        scene_id: pre_shop_mode_state
        snapshot_entities:
          - light.led_controller_cct_1
          - light.led_controller_cct_2
          - light.led_controller_sc_1
          - light.led_controller_sc_2
          - light.main_lighting_switch
          - light.under_cabinet_lighting_switch
          - switch.a32_pro_do8_switch06_top_monitor
          - switch.a32_pro_do8_switch07_bottom_monitor

    - action: script.shop_mode_apply

    - action: persistent_notification.create
      data:
        notification_id: shop_mode
        title: "🔧 Shop Mode ARMED"
        message: >-
          Automations disabled, actuators forced off. LPG valve closed, hydronic
          heater off, water system off, bed lift dead, air compressor off, roof
          lid closed, inverter off + locked.


          Still live: GPS tracking, BMS/battery monitoring, Starlink (remote
          access). Trip + VE logging is suppressed, so shop test drives will NOT
          pollute your fuel data.

          {% if states('input_text.shop_mode_prev_disabled') == 'OVERFLOW' %}

          WARNING: too many automations were already disabled to record them
          all — disarming will enable ALL automations. Re-check any you had off.
          {% endif %}


          The physical rockers still work, and the battery disconnect is still
          the real lockout.

- id: shop_mode_off_restore
  alias: "Shop Mode • disarm and restore"
  mode: single
  trigger:
    - trigger: state
      entity_id: input_boolean.shop_mode
      from: "on"
      to: "off"
  action:
    - variables:
        prev: "{{ states('input_text.shop_mode_prev_disabled') }}"

    # Release the inverter so script.inverter_ensure_on works normally again.
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.inverter_manual_lock

    # Re-energise the hydronic heater's power supply. Switch32 is the heater's
    # STANDBY supply, not the heater itself: it is normally always on and
    # script.shop_mode_apply is the only thing that ever cuts it. While it is
    # off the a32_pro refuses to turn Switch24 on at all — it logs "Cannot turn
    # on hydronic heater: Power Supply is OFF!" and does nothing — and nothing
    # on the dashboard exposed Switch32, so after the 2026-08-22 shop visit the
    # heater looked dead for two weeks (2026-09-06: thermostat calling for
    # heat at 10.9 °C, heater "Idle.", dashboard switch snapping back off).
    # The heater enable (Switch24) and its thermostat stay OFF as before —
    # restoring the supply is what makes turning them back on by hand possible.
    - action: switch.turn_on
      target:
        entity_id: switch.a32_pro_switch32_hydronic_heater_power_supply

    # Bring back lights/monitors only if the snapshot survived. scene.create
    # scenes are in-memory, so after a reboot at the shop this is simply gone —
    # that is expected, not an error.
    #
    # ORDER MATTERS: this runs BEFORE automations are re-armed. Re-arming first
    # would restart rolling_last_active_snapshot_1hz, which would capture the
    # still-all-off state into scene.last_active_state within 1 s and blow away
    # the Power Saving Mode restore point. Restoring the lights first means the
    # rolling snapshot only ever sees the good state.
    - if:
        - condition: template
          value_template: "{{ states.scene.pre_shop_mode_state is not none }}"
      then:
        - action: scene.turn_on
          target:
            entity_id: scene.pre_shop_mode_state

    # Re-arm everything, then re-disable exactly what was off beforehand.
    # Same ghost filter as script.shop_mode_apply — only real, loaded automations.
    - action: automation.turn_on
      target:
        entity_id: >-
          {{ states.automation
             | selectattr('state', 'in', ['on', 'off'])
             | map(attribute='entity_id') | list }}

    - if:
        - condition: template
          value_template: >-
            {{ prev not in ['none', 'OVERFLOW', 'unknown', 'unavailable', ''] }}
      then:
        - action: automation.turn_off
          data:
            stop_actions: true
          target:
            # Filter against automations that actually exist, so a stale or
            # truncated entry can never abort the whole call.
            entity_id: >-
              {% set live = states.automation | map(attribute='entity_id') | list %}
              {{ prev.split(',') | map('trim')
                 | map('regex_replace', '^', 'automation.')
                 | select('in', live) | list }}

    - action: persistent_notification.dismiss
      data:
        notification_id: shop_mode
    - action: persistent_notification.create
      data:
        notification_id: shop_mode_disarmed
        title: "✅ Shop Mode disarmed"
        message: >-
          Automations re-armed. Lights and monitors restored.


          Still OFF on purpose — turn these back on yourself when you are ready:
          LPG valve, hydronic heater + its thermostat, water system, bed lift
          power, air compressor, shore charger. The heater's power supply is
          back on, so the dashboard heater switch works again.

- id: shop_mode_guard
  alias: "Shop Mode • re-shut anything that comes back on"
  # queued so a burst of entities coming back at once is handled one at a time
  # rather than dropped; silent because that burst is normal, not an error.
  mode: queued
  max: 30
  max_exceeded: silent
  trigger:
    - trigger: state
      id: turned_on
      to: "on"
      # Must stay in sync with script.shop_mode_apply. Every entity that script
      # forces off is watched here, so anything that comes back on — an a32_pro
      # relay reasserting itself, a stray service call — gets re-shut.
      entity_id:
        - switch.a32_pro_switch16_lpg_valve
        - switch.a32_pro_switch24_hydronic_heater
        - switch.a32_pro_switch32_hydronic_heater_power_supply
        - switch.a32_pro_switch27_bed_power_supply
        - switch.a32_pro_switch07_bed_up
        - switch.a32_pro_switch08_bed_down
        - switch.a32_pro_switch28_compressor
        - switch.a32_pro_switch06_grey_water_tank_valve
        - switch.ag_pro_ceiling_fan_mode
        # The three water_system_state_* template switches are deliberately not
        # watched: they are derived from last_water_state and cannot be turned
        # off, so guarding them would fire a no-op on every mode change.
        - switch.a32_pro_water_system_master_switch
        - switch.a32_pro_switch29_shower_system_water_pump
        - switch.a32_pro_switch30_main_system_water_pump
        - switch.a32_pro_switch10_water_system_overall
        - switch.a32_pro_switch11_water_system_state_main
        - switch.a32_pro_switch12_water_system_state_recirculating_shower
        - switch.a32_pro_switch13_water_system_state_recirculating_shower_flush
        - switch.a32_pro_switch01_water_system_valve_1
        - switch.a32_pro_switch02_water_system_valve_2
        - switch.a32_pro_switch03_water_system_valve_3
        - switch.a32_pro_switch14_uv_filter
        - switch.a32_pro_switch17_silicone_heating_pads_shower_water_tank_x2
        - switch.a32_pro_switch18_silicone_heating_pads_fresh_water_tank_x4
        - switch.a32_pro_switch19_silicone_heating_pads_grey_water_tank_x4
        - switch.a32_pro_switch20_heating_pads_auto_thermostat_grey_water_tank_x2
        - switch.a32_pro_fresh_water_tank_heater_enable
        - switch.a32_pro_grey_water_tank_heater_enable
        - switch.a32_pro_shower_water_tank_heater_enable
        - switch.a32_pro_do8_switch04_shore_power_charger
        - switch.a32_pro_do8_switch06_top_monitor
        - switch.a32_pro_do8_switch07_bottom_monitor
        - switch.a32_pro_do8_switch08_air_fryer_ventilation_fans
        - switch.a32_pro_air_fryer_ventilation_enable
        - switch.a32_pro_switch21_left_outdoor_lights
        - switch.a32_pro_switch22_right_outdoor_lights
        - switch.a32_pro_switch23_rear_outdoor_lights
        - switch.a32_pro_switch31_lightbar
        - switch.a32_pro_switch09_shower_button_led
        - fan.ag_pro_roof_fan
        - light.led_controller_cct_1
        - light.led_controller_cct_2
        - light.led_controller_sc_1
        - light.led_controller_sc_2
        - light.main_lighting_switch
        - light.under_cabinet_lighting_switch
        - light.a32_pro_a32_pro_dac_0
        - light.a32_pro_a32_pro_dac_1
        - light.0xa4c138fd668411cd
    - trigger: state
      id: lid_opened
      entity_id: cover.ag_pro_roof_fan_lid
      to: "open"
    # The hydronic PID climate runs ON the a32_pro and re-lights the heater by
    # itself whenever it is in `heat` and the supply is live (its on_state
    # handler re-evaluates on every temperature sample). script.shop_mode_apply
    # turns it off; this catches anything turning it back on mid-visit. Its
    # state is heat/off rather than on/off, so it needs its own trigger.
    - trigger: state
      id: climate_heat
      entity_id: climate.a32_pro_van_hydronic_heating_pid
      to: heat
  condition:
    - condition: state
      entity_id: input_boolean.shop_mode
      state: "on"
  action:
    - choose:
        - conditions:
            - condition: trigger
              id: turned_on
          sequence:
            # homeassistant.turn_off is domain-agnostic, so one call covers
            # switch / light / fan without a per-domain branch.
            - action: homeassistant.turn_off
              target:
                entity_id: "{{ trigger.entity_id }}"
        - conditions:
            - condition: trigger
              id: lid_opened
          sequence:
            - action: cover.close_cover
              target:
                entity_id: cover.ag_pro_roof_fan_lid
        - conditions:
            - condition: trigger
              id: climate_heat
          sequence:
            - action: climate.set_hvac_mode
              target:
                entity_id: climate.a32_pro_van_hydronic_heating_pid
              data:
                hvac_mode: "off"

- id: shop_mode_reassert_on_start
  alias: "Shop Mode • re-assert after HA restart"
  # initial_state: true is the whole point of this automation — without it a
  # restart could restore it in the OFF state, and the van would silently come
  # back to life the first time the shop cycles power to the Pi.
  initial_state: true
  mode: single
  trigger:
    - trigger: homeassistant
      event: start
  condition:
    - condition: state
      entity_id: input_boolean.shop_mode
      state: "on"
  action:
    # Let MQTT / BLE / the a32_pro entities actually come online first —
    # applying against `unavailable` entities would be a silent no-op.
    - delay: "00:01:00"
    - action: script.shop_mode_apply
    - action: persistent_notification.create
      data:
        notification_id: shop_mode
        title: "🔧 Shop Mode re-armed after restart"
        message: >-
          HA restarted while Shop Mode was active. The lockout has been
          re-applied automatically.

# ───────────────────────────────────────────────
#  Shoe dryer – blower off when the timer ends
# ───────────────────────────────────────────────
# Fires on finished AND cancelled so the Stop button takes the same path as
# natural expiry. The ha_start leg is the restart reconciler: a timer that
# EXPIRES while HA is down fires timer.finished during timer setup — before
# automation triggers are armed — so that event is always lost, and with the
# ESP never having rebooted the blower would run at 100% forever. The durable
# input_boolean.shoe_dryer_active flag survives the restart and lets this leg
# finish the job. (restore: true on the timer covers the other case: a restart
# shorter than the time remaining resumes the countdown; the condition below
# sees the timer still active and leaves it alone.)
- id: shoe_dryer_auto_off
  alias: "Shoe Dryer • blower off when timer ends"
  mode: single
  trigger:
    - trigger: event
      id: finished
      event_type: timer.finished
      event_data:
        entity_id: timer.shoe_dryer
    - trigger: event
      id: cancelled
      event_type: timer.cancelled
      event_data:
        entity_id: timer.shoe_dryer
    - trigger: homeassistant
      id: ha_start
      event: start
  condition:
    # Only ever act on a dry that is actually in progress...
    - condition: state
      entity_id: input_boolean.shoe_dryer_active
      state: "on"
    # ...and on the startup leg, only if the timer did NOT survive the
    # restart (still active = the dry legitimately continues, hands off).
    - condition: template
      value_template: "{{ trigger.id != 'ha_start' or is_state('timer.shoe_dryer', 'idle') }}"
  action:
    # After a restart the a32_pro needs time to reconnect — commanding an
    # `unavailable` entity is a silent no-op (same reason
    # shop_mode_reassert_on_start waits a minute before applying).
    - if:
        - condition: trigger
          id: ha_start
      then:
        - wait_template: >-
            {{ has_value('light.a32_pro_a32_pro_dac_0')
               and has_value('climate.a32_pro_van_hydronic_heating_pid') }}
          timeout: "00:05:00"
          continue_on_timeout: true
    - action: light.turn_off
      target:
        entity_id: light.a32_pro_a32_pro_dac_0
      continue_on_error: true
    # Restore heating only if it was on before the dry AND nobody has taken
    # the climate over since we paused it — if the user re-enabled heat
    # mid-dry, their newer intent wins over our stale snapshot.
    - if:
        - condition: state
          entity_id: climate.a32_pro_van_hydronic_heating_pid
          state: "off"
        - condition: state
          entity_id: input_boolean.shoe_dryer_resume_heat
          state: "on"
      then:
        - action: climate.set_temperature
          target:
            entity_id: climate.a32_pro_van_hydronic_heating_pid
          data:
            temperature: >-
              {{ states('input_number.shoe_dryer_prev_setpoint') | float(21) }}
            hvac_mode: heat
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.shoe_dryer_active

# If something re-enables the hydronic climate mid-dry (app, voice, wall
# tablet), its PID re-takes the blower within ~10 s and the dry is dead
# anyway — cancel the timer so the dashboard card stops claiming otherwise.
# The cancel routes through shoe_dryer_auto_off, whose climate-off guard then
# correctly SKIPS the snapshot restore (the user's newer intent wins). This
# can't self-trigger from the start script: that only ever moves the climate
# heat→off, never off→heat.
- id: shoe_dryer_cancel_on_climate_takeover
  alias: "Shoe Dryer • cancel when heating retakes the blower"
  mode: single
  trigger:
    - trigger: state
      entity_id: climate.a32_pro_van_hydronic_heating_pid
      from: "off"
      to: heat
  condition:
    - condition: state
      entity_id: timer.shoe_dryer
      state: active
  action:
    - action: timer.cancel
      target:
        entity_id: timer.shoe_dryer

# ────────────────────────────────────────────────────────────────
# Night Climate – hold a night target, warm up for the wake time
#   Mode (input_select.night_climate_mode) is what runs now:
#     Program       heater when cold; when warm, on shore power the A/C
#                   (above "A/C above", at the card's A/C fan level), off shore the roof fan while
#                   it is cooler outside (its own thermostat, or HA from the
#                   room sensor when that sits idle); night target, then the
#                   wake target from the warm-up
#     Hold          the same, at the hold target, with no end (daytime use)
#     Fan all night / A/C all night / Heater
#                   one appliance until the wake time
#   Sleep Mode ON starts the Program, and Night picked on the card turns
#   Sleep Mode on; the wake time ends everything and turns Sleep Mode off
#   (wake_up_routine). The heater is left where the
#   warm-up put it (the old 07:30 scheduler entry is gone since 2026-09-17,
#   the warm-up is the morning heat). Sensors in template/night_climate.yaml.
#   One-way IR is backed up three ways since the night of 2026-09-18: the AG
#   Pro spaces fan and A/C frames, the fan's off is sent twice, and
#   night_climate_fan_watchdog re-sends it if the motor still draws power.
# ────────────────────────────────────────────────────────────────
- id: night_climate_start_on_sleep
  alias: "Night Climate – start with Sleep Mode"
  mode: single
  trigger:
    - trigger: state
      entity_id: input_boolean.sleep_mode
      from: "off"
      to: "on"
  condition:
    # A daytime Hold becomes the night Program at bedtime.
    - "{{ states('input_select.night_climate_mode') in ['Off', 'Hold'] }}"
  action:
    - action: input_select.select_option
      target:
        entity_id: input_select.night_climate_mode
      data:
        option: Program

# Night on the Climate Program card is bedtime: it turns Sleep Mode on (lights
# and monitors off), the user's wish since 2026-10-05. Only when a person picked
# it, so the 00:30 Night schedule never switches the lights off by itself.
- id: night_climate_night_starts_sleep
  alias: "Night Climate – Night on the card turns Sleep Mode on"
  mode: single
  trigger:
    - trigger: state
      entity_id: input_select.night_climate_mode
      to: Program
  condition:
    - condition: state
      entity_id: input_boolean.sleep_mode
      state: "off"
    - "{{ trigger.to_state.context.user_id is not none }}"
  action:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.sleep_mode

- id: night_climate_stop_on_sleep_off
  alias: "Night Climate – stop when Sleep Mode ends"
  mode: single
  trigger:
    - trigger: state
      entity_id: input_boolean.sleep_mode
      from: "on"
      to: "off"
  condition:
    - "{{ not is_state('input_select.night_climate_mode', 'Off') }}"
  action:
    - action: input_select.select_option
      target:
        entity_id: input_select.night_climate_mode
      data:
        option: "Off"

# Ending the program stops the roof fan and the A/C; the heater is deliberately
# left where it is. At the wake (the wake time, or Sleep Mode ending) a running
# A/C stays on as a fan instead: set point to the unit's top, 32 °C, so the
# compressor stays off. The user's wish 2026-10-08. Off picked by a person
# (the card, voice) still switches it off.
- id: night_climate_mode_off
  alias: "Night Climate – fan and A/C off when the program ends"
  mode: single
  trigger:
    - trigger: state
      entity_id: input_select.night_climate_mode
      to: "Off"
  action:
    - if:
        # Set by night_climate_wake or night_climate_stop_on_sleep_off: an
        # automation's own state carries the context of its service calls.
        - >-
          {{ trigger.to_state.context.id in states.automation
             | selectattr('attributes.id', 'in', ['night_climate_wake', 'night_climate_stop_on_sleep_off'])
             | map(attribute='context.id') | list }}
      then:
        - action: script.night_climate_fan_off
        - action: script.night_climate_ac_fan_only
      else:
        - action: script.night_climate_actuators_off
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.night_climate_fan_by_room

# The wake time is in HA's time zone, Mountain (America/Edmonton), wherever
# the van is: the user wakes at 8:25 Mountain time (2026-10-07; the 07:30 they
# had set read as Pacific to them and ended Sleep at 06:30 their time).
- id: night_climate_wake
  alias: "Night Climate – wake time"
  mode: single
  trigger:
    - trigger: time
      at: input_datetime.night_climate_wake_time
  action:
    # Hold has no end; the night modes stop here. Mode Off also switches the
    # roof fan off (night_climate_mode_off); a running A/C stays on as a fan
    # at its top set point (until 2026-10-08 it went off here).
    - if:
        - "{{ states('input_select.night_climate_mode') not in ['Off', 'Hold'] }}"
      then:
        # No heater call here on purpose: the warm-up already put the heater
        # at the wake target, and it stays there until someone changes it.
        - action: input_select.select_option
          target:
            entity_id: input_select.night_climate_mode
          data:
            option: "Off"
    # Sleep Mode ends at the wake time whatever the climate mode is (until
    # 2026-10-07 only while a night mode was running).
    - if:
        - condition: state
          entity_id: input_boolean.sleep_mode
          state: "on"
      then:
        - action: script.wake_up_routine

# The loop. Every 5 min (and on any setting change) hold sensor.night_climate_
# target with what the mode allows. The scripts only send a command when the
# appliance is not already where it should be; the fan and the A/C beep on
# every IR frame, so that is deliberate. The A/C cools at least 30 min before
# it becomes a fan (compressor and the beeps); the heater has its own PID.
- id: night_climate_controller
  alias: "Night Climate – controller"
  mode: single
  max_exceeded: silent
  trigger:
    - trigger: time_pattern
      minutes: "/5"
    # Setting changes act at once. `to:` empty = state changes only, not the
    # attribute churn on the target sensor.
    - trigger: state
      entity_id:
        - input_select.night_climate_mode
        - input_select.night_climate_fan_direction
        - input_number.night_climate_fan_speed
        - input_boolean.night_climate_use_heater
        - input_boolean.night_climate_use_ac
        - input_boolean.night_climate_use_fan
        - sensor.night_climate_target
      to:
  condition:
    - "{{ states('input_select.night_climate_mode') not in ['Off', 'unknown', 'unavailable'] }}"
    # A template reload (every deploy) leaves these unavailable for a moment;
    # shore power reading "off" then would switch the A/C off at once.
    - >-
      {{ states('binary_sensor.shore_power_present') in ['on', 'off']
         and states('sensor.night_climate_target') not in ['unknown', 'unavailable'] }}
  action:
    - variables:
        mode: "{{ states('input_select.night_climate_mode') }}"
        target: "{{ states('sensor.night_climate_target') | float(15) }}"
        room: "{{ states('sensor.living_space_temperature') | float(none) }}"
        # Charger drew power within the last 3 h (template/night_climate.yaml)
        shore: "{{ is_state('binary_sensor.shore_power_present', 'on') }}"
        cool_above: "{{ states('input_number.night_climate_cool_above') | float(24) }}"
        heater_on: "{{ is_state('climate.a32_pro_van_hydronic_heating_pid', 'heat') }}"
        ac_on: "{{ is_state('climate.ag_pro_24v_air_conditioner', 'cool') }}"
        # The Night program's warm-up (template/night_climate.yaml)
        warmup: >-
          {{ mode == 'Program' and state_attr('sensor.night_climate_target', 'phase') == 'warmup' }}
        # Cooling at its top set point the A/C only runs its fan: the
        # compressor never starts (the room never reaches 32 °C).
        ac_fan_only: >-
          {{ ac_on and state_attr('climate.ag_pro_24v_air_conditioner', 'temperature') | float(0)
             >= state_attr('climate.ag_pro_24v_air_conditioner', 'max_temp') | float(32) - 0.5 }}
        ac_settled: >-
          {{ states.climate.ag_pro_24v_air_conditioner is none
             or (now() - states.climate.ag_pro_24v_air_conditioner.last_changed).total_seconds() > 1800 }}
        use_heater: "{{ is_state('input_boolean.night_climate_use_heater', 'on') }}"
        use_ac: "{{ is_state('input_boolean.night_climate_use_ac', 'on') }}"
        use_fan: "{{ is_state('input_boolean.night_climate_use_fan', 'on') }}"
        fan_thermo: "{{ is_state('switch.ag_pro_roof_fan_thermostat', 'on') }}"
        # Underneath-van sensor reads ~3.5 °C warm, so this is conservative.
        outdoor: "{{ states('sensor.a32_pro_bme280_4_temperature') | float(none) }}"
        fan_on: "{{ is_state('fan.ag_pro_roof_fan', 'on') }}"
        fan_by_room: "{{ is_state('input_boolean.night_climate_fan_by_room', 'on') }}"
        # Cooler outside: worth starting (1 °C) and worth keeping (0.3 °C)
        fan_ok: "{{ room is not none and outdoor is not none and outdoor < room - 1 }}"
        fan_keep: "{{ room is not none and outdoor is not none and outdoor < room - 0.3 }}"
        # On shore power the A/C is the cooling tool and the roof fan stays
        # off; off shore the roof fan takes its place (the user's rule since
        # 2026-10-05, replacing "the fan whenever it is 3 °C colder outside").
        ac_ok: "{{ use_ac and shore }}"
        # 20 min on its own thermostat in a warm room and the motor has not
        # turned for 10 min: that thermostat is not doing the job (2026-09-18:
        # in Intake its sensor sits in the incoming air; 103 s of running all night).
        fan_idle: >-
          {% set run = states.binary_sensor.roof_fan_running %}
          {{ fan_thermo and run is not none and run.state == 'off'
             and (now() - run.last_changed).total_seconds() > 600
             and (now() - states.switch.ag_pro_roof_fan_thermostat.last_changed).total_seconds() > 1200 }}
        ac_wanted: >-
          {{ ac_ok and room is not none and room > cool_above }}
        fan_settings:
          direction: "{{ states('input_select.night_climate_fan_direction') }}"
          speed: "{{ states('input_number.night_climate_fan_speed') | int(30) }}"
    - choose:
        # ── Heater: just the thermostat at the target ──
        - conditions: "{{ mode == 'Heater' }}"
          sequence:
            - action: script.night_climate_actuators_off
            - action: script.night_climate_heater_to
              data:
                target: "{{ target }}"

        # ── Fan all night: fixed speed and direction; the heater is left alone ──
        - conditions: "{{ mode == 'Fan all night' }}"
          sequence:
            - if:
                - "{{ ac_on }}"
              then:
                - action: script.night_climate_ac_off
            - action: script.night_climate_fan_on
              data:
                speed: "{{ states('input_number.night_climate_fan_speed') | int(30) }}"
                direction: "{{ states('input_select.night_climate_fan_direction') }}"

        # ── A/C all night: the unit's own thermostat at the target, shore power only ──
        - conditions: "{{ mode == 'A/C all night' }}"
          sequence:
            - if:
                - "{{ is_state('fan.ag_pro_roof_fan', 'on') }}"
              then:
                - action: fan.turn_off
                  target:
                    entity_id: fan.ag_pro_roof_fan
            - if:
                - "{{ shore }}"
              then:
                - action: script.night_climate_ac_on
                  data:
                    target: "{{ target }}"
              else:
                - if:
                    - "{{ ac_on }}"
                  then:
                    - action: script.night_climate_ac_off

        # ── Program / Hold: heater below target−1. Above target+2: on shore
        #    power the A/C, from the "A/C above" temperature, cooling to the
        #    target (16 °C at the least, the card's A/C fan level). Once on it
        #    is not switched off while it may run: back under the target, or
        #    when the heater takes over, it becomes a fan (top set point, no
        #    compressor) and cools again only where it would start anyway.
        #    Off shore the roof fan while it is cooler outside: on its own thermostat
        #    first, and if that sits idle (its sensor is in the incoming air)
        #    HA runs the fan from the room sensor instead. Fan and A/C never
        #    run together. Between the bands whatever is running holds its
        #    own target.
        - conditions: "{{ mode in ['Program', 'Hold'] }}"
          sequence:
            # Clearly over target: the heater has no business running
            - if:
                - "{{ heater_on and room is not none and room > target + 2 }}"
              then:
                - action: climate.set_hvac_mode
                  target:
                    entity_id: climate.a32_pro_van_hydronic_heating_pid
                  data:
                    hvac_mode: "off"
            - choose:
                # Too cold: heater to target, roof fan off. A running A/C
                # stays on as a fan (top set point, no compressor): the user's
                # wish 2026-10-07 for the warm-up, after it went off at 06:20,
                # and whenever the heater starts since 10-08. It no longer
                # asks for the warm-up: the phase attribute is written 50 ms
                # after the target, so the run the warm-up's start triggers
                # would read "night" and switch the A/C off.
                - conditions: "{{ room is not none and use_heater and room < target - 1 }}"
                  sequence:
                    - if:
                        - "{{ ac_on and ac_ok }}"
                      then:
                        - action: script.night_climate_heater_to
                          data:
                            target: "{{ target }}"
                        - action: script.night_climate_fan_off
                        - action: script.night_climate_ac_fan_only
                      else:
                        - action: script.night_climate_actuators_off
                        - action: script.night_climate_heater_to
                          data:
                            target: "{{ target }}"

                # A/C running: keep it only while it is still the right tool
                - conditions: "{{ ac_on }}"
                  sequence:
                    - choose:
                        # Shore power gone or the A/C no longer allowed: off now
                        - conditions: "{{ not ac_ok }}"
                          sequence:
                            - action: script.night_climate_ac_off
                        # A/C as a fan: it stays so, even with the heater off
                        # for a while, and cools again only where an A/C that
                        # is off would start (above target+2 and "A/C above"),
                        # never in the warm-up
                        - conditions: "{{ ac_fan_only }}"
                          sequence:
                            - if:
                                - "{{ fan_thermo or fan_on }}"
                              then:
                                - action: script.night_climate_fan_off
                            - if:
                                - "{{ not warmup and ac_wanted and room > target + 2 }}"
                              then:
                                - action: script.night_climate_ac_on
                                  data:
                                    target: "{{ target }}"
                        # Back under target: a fan once the 30-min dwell is
                        # over. Until 2026-10-08 it went off here (04:00 that
                        # night, the room at 15.4 °C against 16).
                        - conditions: >-
                            {{ ac_settled and room is not none and room < target - 0.5 }}
                          sequence:
                            - action: script.night_climate_ac_fan_only
                      default:
                        - if:
                            - "{{ fan_thermo or fan_on }}"
                          then:
                            - action: script.night_climate_fan_off
                        # Keeps the unit's own target in step (the warm-up raises it)
                        - action: script.night_climate_ac_on
                          data:
                            target: "{{ target }}"

                # Too warm: on shore power the A/C, off shore the roof fan while
                # it is cooler outside
                - conditions: "{{ room is not none and room > target + 2 }}"
                  sequence:
                    - choose:
                        - conditions: "{{ ac_wanted and ac_settled }}"
                          sequence:
                            - if:
                                - "{{ fan_thermo or fan_on }}"
                              then:
                                - action: script.night_climate_fan_off
                            - action: script.night_climate_ac_on
                              data:
                                target: "{{ target }}"
                        - conditions: "{{ use_fan and fan_ok and not ac_ok }}"
                          sequence:
                            - choose:
                                # Its own thermostat sat idle: HA runs the fan from
                                # the room sensor for the rest of this program
                                - conditions: "{{ fan_by_room or fan_idle }}"
                                  sequence:
                                    - if:
                                        - "{{ not fan_by_room }}"
                                      then:
                                        - action: input_boolean.turn_on
                                          target:
                                            entity_id: input_boolean.night_climate_fan_by_room
                                        - action: system_log.write
                                          data:
                                            level: warning
                                            logger: night_climate
                                            message: >-
                                              Roof fan sat idle on its own thermostat with the room at
                                              {{ room }} °C (target {{ target }}): running it from the room sensor
                                    - action: script.night_climate_fan_on
                                      data:
                                        speed: "{{ fan_settings.speed }}"
                                        direction: "{{ fan_settings.direction }}"
                              default:
                                - action: script.night_climate_fan_auto
                                  data:
                                    target_c: "{{ target }}"
                                    direction: "{{ fan_settings.direction }}"
                                    speed: "{{ fan_settings.speed }}"
                      # Nothing can cool right now: do not leave the fan running for nothing
                      default:
                        - if:
                            - "{{ fan_thermo or (fan_on and fan_by_room) }}"
                          then:
                            - action: script.night_climate_fan_off

                # In band, fan run from the room sensor: off near the target, when
                # outside stops helping (1.5 °C of hysteresis, few beeps) or on
                # shore power (the A/C's job there)
                - conditions: "{{ fan_on and fan_by_room }}"
                  sequence:
                    - if:
                        - "{{ not use_fan or ac_ok or not fan_keep or (room is not none and room <= target + 0.5) }}"
                      then:
                        - action: script.night_climate_fan_off
                      else:
                        - action: script.night_climate_fan_on
                          data:
                            speed: "{{ fan_settings.speed }}"
                            direction: "{{ fan_settings.direction }}"
                # In band, fan on its thermostat: keep it in step; off when outside
                # stops helping or on shore power
                - conditions: "{{ fan_thermo }}"
                  sequence:
                    - if:
                        - "{{ use_fan and fan_keep and not ac_ok }}"
                      then:
                        - action: script.night_climate_fan_auto
                          data:
                            target_c: "{{ target }}"
                            direction: "{{ fan_settings.direction }}"
                            speed: "{{ fan_settings.speed }}"
                      else:
                        - action: script.night_climate_fan_off
                # Heater running in band: keep its target in step
                - conditions: "{{ heater_on and use_heater }}"
                  sequence:
                    - action: script.night_climate_heater_to
                      data:
                        target: "{{ target }}"

# The A/C fan level on the Climate Program card: the program starts the A/C at
# it (script.night_climate_ac_on), and a change while a program mode has the
# A/C on goes to the unit as well, the warm-up's fan-only A/C included. 5 s
# after the last change, so a run of taps sends one level (the firmware walks
# the level one IR press at a time and every press beeps). Not when the helper
# first appears (it starts at 1) or comes back from unavailable.
- id: night_climate_ac_fan_level
  alias: "Night Climate – A/C fan level to the running A/C"
  mode: single
  max_exceeded: silent
  trigger:
    - trigger: state
      entity_id: input_number.night_climate_ac_fan_level
      to:
      for: "00:00:05"
  condition:
    - >-
      {{ trigger.from_state is not none
         and trigger.from_state.state not in ['unknown', 'unavailable']
         and trigger.to_state.state not in ['unknown', 'unavailable'] }}
    - "{{ states('input_select.night_climate_mode') in ['Program', 'Hold', 'A/C all night'] }}"
    - condition: state
      entity_id: climate.ag_pro_24v_air_conditioner
      state: cool
    - >-
      {{ states('number.ag_pro_24v_ac_fan_level') | int(0)
         != states('input_number.night_climate_ac_fan_level') | int(0) }}
  action:
    - action: number.set_value
      target:
        entity_id: number.ag_pro_24v_ac_fan_level
      data:
        value: "{{ states('input_number.night_climate_ac_fan_level') | int }}"

# The roof fan hears one-way IR, so HA only assumes a frame landed. If the motor
# draws power while HA has it off (fan off, thermostat off) during a program or
# within an hour of one ending, the off frame was missed: on 2026-09-18 the lid
# stayed open in auto and the fan gulped 8 °C air every 12 min against the
# heater. Send it again. Outside that window the fan is left alone, it may be
# the handheld remote.
- id: night_climate_fan_watchdog
  alias: "Night Climate – roof fan runs while it should be off"
  mode: single
  max_exceeded: silent
  trigger:
    - trigger: numeric_state
      entity_id: sensor.roof_fan_power_12v
      above: 5
      for: "00:00:12"
  condition:
    - "{{ is_state('fan.ag_pro_roof_fan', 'off') and is_state('switch.ag_pro_roof_fan_thermostat', 'off') }}"
    - >
      {{ states('input_select.night_climate_mode') not in ['Off', 'unknown', 'unavailable']
         or (now() - states.input_select.night_climate_mode.last_changed).total_seconds() < 3600 }}
    - >
      {{ states.button.ag_pro_roof_fan_force_off is not none
         and not is_state('button.ag_pro_roof_fan_force_off', 'unavailable') }}
  action:
    - action: button.press
      target:
        entity_id: button.ag_pro_roof_fan_force_off
    - action: system_log.write
      data:
        level: warning
        logger: night_climate
        message: >-
          Roof fan draws {{ states('sensor.roof_fan_power_12v') }} W while HA has it off:
          sent off / lid closed again
    # One re-send per burst at most
    - delay: "00:01:00"

# Shore power has no sensor of its own; the charger's draw is the only sign and
# it reads 0 W whenever the battery is full. binary_sensor.shore_power_present
# (template/night_climate.yaml) = the charger drew power in the last 3 h; this
# keeps the time stamp. An hour of the A/C drawing power with the charger silent
# all the while means unplugged (on shore it would have topped up by then), so
# that clears it and the program stops the A/C.
- id: shore_power_seen
  alias: "Shore power – remember when the charger last drew power"
  mode: queued
  max: 5
  max_exceeded: silent
  trigger:
    - trigger: numeric_state
      entity_id: sensor.shore_power_charger_power_24v
      above: 50
      id: seen
    - trigger: time_pattern
      minutes: "/10"
      id: seen
    - trigger: state
      entity_id: binary_sensor.ag_pro_24v_ac_power_detected
      to: "on"
      for: "01:00:00"
      id: ac_hour
  action:
    - choose:
        - conditions:
            - condition: trigger
              id: seen
            - "{{ states('sensor.shore_power_charger_power_24v') | float(0) > 50 }}"
          sequence:
            - action: input_datetime.set_datetime
              target:
                entity_id: input_datetime.shore_power_last_seen
              data:
                datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
        - conditions:
            - condition: trigger
              id: ac_hour
            - "{{ states('sensor.shore_power_charger_power_24v') | float(0) <= 50 }}"
            - >
              {{ as_timestamp(now())
                 - (state_attr('input_datetime.shore_power_last_seen', 'timestamp') | float(0)) > 3600 }}
          sequence:
            - action: input_datetime.set_datetime
              target:
                entity_id: input_datetime.shore_power_last_seen
              data:
                datetime: "1970-01-02 00:00:00"

# ────────────────────────────────────────────────────────────────
# Starlink duty cycle (2026-09-29; replaces the 23:00–08:00 night-off)
# The dish draws ~33 W, the biggest load HA can cut. With
# input_boolean.starlink_duty_cycle on, Starlink runs in a short window at the
# top of each hour (every 30 min until 2026-09-29; hourly halves the power
# cycles, and the dish sometimes fails to come back after one). In each window the atlantis relay (relay/ in this repo) reconnects,
# stores the latest state for the dashboard it serves, sends any commands queued
# while the van was offline, and marks input_datetime.starlink_relay_last_sync.
# The window then closes:
#   - once the relay has synced, at least 3 min after it opened (power-on to
#     reachable over Tailscale measured 2 min 46–48 s on 2026-09-28), plus the
#     relay's own 60 s hold so results of sent commands come back;
#   - not at all while the relay hasn't synced: a dish that doesn't come back
#     stays powered, so starlink_auto_recover can power-cycle it (an 8 min cap
#     here, removed the same day, cut it off first; the van stayed offline);
#     if atlantis itself is down, Starlink simply stays on;
#   - never while starlink_relay_hold_until is in the future (the relay pushes
#     it forward while someone is actively using the dashboard).
# binary_sensor.starlink_duty_cycle_paused keeps Starlink on while driving, on
# shore power, or with someone in the van by day.
# Each window is also a power cycle, which is what clears the PoE converter
# latch-up (see starlink_auto_recover). It isn't only long offs that trigger
# it: after 9 h off on 2026-09-28/29, but also after 8 and 22 min off on the
# first duty-cycle afternoon; a window stays open until the relay syncs, so
# auto-recover gets to power-cycle a dish that didn't come back.
# There is deliberately no low-battery cut: a guard that held Starlink off
# below 30 % (added 2026-09-26, removed 2026-09-29) left the van unreachable
# for hours, with no way to check on it or undo the hold remotely.
# ────────────────────────────────────────────────────────────────
- id: starlink_duty_window_open
  alias: "Starlink • duty cycle: open a window (every hour at :00)"
  mode: single
  trigger:
    - trigger: time_pattern
      minutes: 0
  condition:
    - condition: state
      entity_id: input_boolean.starlink_duty_cycle
      state: "on"
    - condition: state
      entity_id: switch.a32_pro_switch26_starlink_power_supply
      state: "off"
  action:
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.starlink_window_started
      data:
        timestamp: "{{ now().timestamp() }}"
    - action: switch.turn_on
      target:
        entity_id: switch.a32_pro_switch26_starlink_power_supply

- id: starlink_duty_window_close
  alias: "Starlink • duty cycle: close the window once synced"
  mode: single
  trigger:
    - trigger: time_pattern
      minutes: "/1"
  condition:
    - condition: state
      entity_id: input_boolean.starlink_duty_cycle
      state: "on"
    - condition: state
      entity_id: binary_sensor.starlink_duty_cycle_paused
      state: "off"
    - condition: state
      entity_id: switch.a32_pro_switch26_starlink_power_supply
      state: "on"
    # Never cut the supply in the middle of a recovery power cycle.
    - condition: state
      entity_id: input_boolean.starlink_recovery_in_progress
      state: "off"
    - condition: template
      value_template: >
        {% set t = now().timestamp() %}
        {% set opened = as_timestamp(states('input_datetime.starlink_window_started'), 0) %}
        {% set synced = as_timestamp(states('input_datetime.starlink_relay_last_sync'), 0) %}
        {% set hold = as_timestamp(states('input_datetime.starlink_relay_hold_until'), 0) %}
        {# No time cap: a window that never syncs stays open, so a dish stuck
           after power-on gets starlink_auto_recover's power cycle (15 min)
           instead of being switched off again first. #}
        {{ t >= hold and synced > opened and t - opened >= 180 }}
  action:
    - action: switch.turn_off
      target:
        entity_id: switch.a32_pro_switch26_starlink_power_supply

# Paused (driving, shore power, someone in the van) or duty cycle switched off:
# Starlink on now, not at the next window.
- id: starlink_duty_resume_power
  alias: "Starlink • on while the duty cycle is paused or off"
  mode: single
  trigger:
    - trigger: state
      entity_id: binary_sensor.starlink_duty_cycle_paused
      to: "on"
    - trigger: state
      entity_id: input_boolean.starlink_duty_cycle
      to: "off"
  action:
    - action: switch.turn_on
      target:
        entity_id: switch.a32_pro_switch26_starlink_power_supply

# Pause ended or duty cycle switched on while Starlink is running: treat the
# time from now as a window, so it closes once the relay has synced instead of
# straight away.
- id: starlink_duty_restart_window
  alias: "Starlink • duty cycle: start a window when it takes over"
  mode: single
  trigger:
    - trigger: state
      entity_id: binary_sensor.starlink_duty_cycle_paused
      to: "off"
    - trigger: state
      entity_id: input_boolean.starlink_duty_cycle
      to: "on"
  action:
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.starlink_window_started
      data:
        timestamp: "{{ now().timestamp() }}"

# GasBuddy's "Cheapest Regular Nearby" station got postal code V9Y 8Y5 (Port
# Alberni) on 2026-10-08: neither Ucluelet station had a current price, so the
# search around the van found nothing and the integration never started. The
# code has to be cleared when the van leaves, or the price stays Port Alberni's
# all trip. This says so once the van is 100 km away and the price still comes
# from there; daily at 09:00 until it's done. distance() goes through zone.home,
# which moves with the van: from plain coordinates it has no entity to follow,
# and the trigger would never re-check.
- id: gasbuddy_postal_code_reminder
  alias: "GasBuddy - clear the Port Alberni postal code"
  mode: single
  trigger:
    - trigger: template
      value_template: "{{ distance('zone.home', 49.234, -124.805) > 100 }}"
      for: "00:30:00"
    - trigger: time
      at: "09:00:00"
  condition:
    - condition: template
      value_template: >
        {{ distance('zone.home', 49.234, -124.805) > 100
           and 'Port Alberni' in (state_attr('sensor.cheapest_regular_nearby_regular_gas', 'address') or '') }}
  action:
    - action: persistent_notification.create
      data:
        notification_id: gasbuddy_postal_code
        title: "GasBuddy still searches Port Alberni"
        message: >
          The van is {{ distance('zone.home', 49.234, -124.805) | round(0) | int }} km from Port
          Alberni, but GasBuddy still searches postal code V9Y 8Y5. Clear it so the
          gas price follows the van: Settings → Devices & services → GasBuddy →
          Cheapest Regular Nearby → ⋮ → Reconfigure, empty Postal code, Submit twice.
