# ===========================
# automations.yaml
# ===========================

# ───────────────────────────────────────────────
#  BMS BLE – reload after boot with retry
# ───────────────────────────────────────────────
# The bms_ble integration checks for the BLE device at setup.
# If the ESP32 BLE proxy hasn't reconnected yet, setup fails
# or gets cancelled. This automation retries the reload
# every 30s (up to 30 attempts = ~15 min window) until BMS comes online.
# HA's own setup retry (every 80 s) covers most of this; the loops mainly
# add log noise. What kept the BMS down for hours (09-06: 3 h, 09-16: 7 h)
# was the HA box's Realtek USB Bluetooth dongle: it connects to the JBD
# but never gets a reply, and HA preferred it for its stronger signal.
# Its bluetooth config entry is disabled since 2026-09-16, so the BMS
# goes through the a32-pro proxy (.github/copilot-instructions.md,
# "Bluetooth").

- id: bms_ble_reload_after_boot
  alias: "BMS BLE - reload integration after boot"
  mode: single
  trigger:
    - trigger: homeassistant
      event: start
  action:
    - delay:
        seconds: 20
    - repeat:
        while:
          - condition: state
            entity_id: sensor.olins_van_bms_battery
            state: "unavailable"
          - "{{ repeat.index <= 30 }}"
        sequence:
          - action: homeassistant.reload_config_entry
            data:
              entry_id: "{{ config_entry_id('sensor.olins_van_bms_battery') }}"
          - delay:
              seconds: 30

# ───────────────────────────────────────────────
#  BMS BLE – runtime recovery when unavailable
# ───────────────────────────────────────────────
# If BMS goes unavailable outside of boot (BLE proxy dropout,
# connection slot exhaustion, etc.), wait 60s then reload.
# Max 5 retries, resets after BMS comes back.

- id: bms_ble_runtime_recovery
  alias: "BMS BLE - reload when unavailable (runtime)"
  mode: single
  trigger:
    - trigger: state
      entity_id: sensor.olins_van_bms_battery
      to: "unavailable"
      for:
        seconds: 60
  action:
    - repeat:
        while:
          - condition: state
            entity_id: sensor.olins_van_bms_battery
            state: "unavailable"
          - "{{ repeat.index <= 5 }}"
        sequence:
          - action: homeassistant.reload_config_entry
            data:
              entry_id: "{{ config_entry_id('sensor.olins_van_bms_battery') }}"
          - delay:
              seconds: 60

# ───────────────────────────────────────────────
#  Kidde HomeSafe – reload while unavailable
# ───────────────────────────────────────────────
# The kidde_homesafe custom component (HACS; upstream 1.0.4 is the same
# here) reads the Kidde cloud once at setup and builds its entities from that
# answer. If HA starts before the van has internet (Starlink takes minutes
# after a power-up), that read fails, every platform crashes on the empty
# answer and nothing polls again until the integration is reloaded. That kept
# it down from the 2026-09-30 power-off to 10-08. Reloads every 15 min once
# the detector has been unavailable 15 min; a reload while the internet is
# still down just fails and leaves it as it was.
- id: kidde_reload_when_unavailable
  alias: "Kidde - reload integration while unavailable"
  mode: single
  trigger:
    - trigger: time_pattern
      minutes: "/15"
  condition:
    - condition: state
      entity_id: binary_sensor.smoke_co_and_iac_detector_online
      state: "unavailable"
      for: "00:15:00"
  action:
    - action: homeassistant.reload_config_entry
      data:
        entry_id: "{{ config_entry_id('binary_sensor.smoke_co_and_iac_detector_online') }}"

# ───────────────────────────────────────────────
#  Filtered GPS tracker – MQTT update logic
# ───────────────────────────────────────────────

# 1️⃣  (Optional) Republish last known fix on HA boot
#     – only if broker has NO retained packet
- id: starlink_bootstrap_if_missing
  alias: "GPS • bootstrap retained message if none"
  mode: single
  trigger:
    - trigger: homeassistant
      event: start
  condition:
    # Run only when tracker state is 'unknown' (means broker lost retain)
    - "{{ states('device_tracker.ublox_gps_filtered') in ['unknown', 'unavailable'] }}"
    # …and only if the raw tracker actually has a real fix (never bootstrap 0,0).
    - condition: template
      value_template: >
        {{ state_attr('device_tracker.ublox_gps','latitude') | float(0) != 0
           and state_attr('device_tracker.ublox_gps','longitude') | float(0) != 0 }}
  action:
    - action: mqtt.publish
      data:
        topic: homeassistant/device_tracker/ublox_gps_filtered/attributes
        qos: 1
        retain: true
        payload: >
          {
            "latitude": {{ state_attr('device_tracker.ublox_gps','latitude') | float(0) }},
            "longitude": {{ state_attr('device_tracker.ublox_gps','longitude') | float(0) }},
            "gps_accuracy": {{ state_attr('device_tracker.ublox_gps','gps_accuracy') | float(0) }},
            "elevation": {{ state_attr('device_tracker.ublox_gps','altitude') | float(0) }},
            "source_type": "gps"
          }
    - action: mqtt.publish
      data:
        topic: homeassistant/device_tracker/ublox_gps_filtered/state
        qos: 1
        retain: true
        payload: "home"

# 2️⃣  While the van is moving: publish new GPS fix each second
- id: starlink_filtered_while_moving
  alias: "GPS • filtered coords 1 Hz while moving"
  mode: queued
  max: 3
  trigger:
    - trigger: time_pattern
      seconds: "/1"
  condition:
    - condition: state
      entity_id: binary_sensor.vehicle_is_moving
      state: "on"
    # Don't republish a (0,0) fix if the raw tracker momentarily has no fix.
    - condition: template
      value_template: >
        {{ state_attr('device_tracker.ublox_gps','latitude') | float(0) != 0
           and state_attr('device_tracker.ublox_gps','longitude') | float(0) != 0 }}
  action:
    - action: mqtt.publish
      data:
        topic: homeassistant/device_tracker/ublox_gps_filtered/attributes
        qos: 1
        retain: true
        payload: >
          {
            "latitude": {{ state_attr('device_tracker.ublox_gps','latitude') | float(0) }},
            "longitude": {{ state_attr('device_tracker.ublox_gps','longitude') | float(0) }},
            "gps_accuracy": {{ state_attr('device_tracker.ublox_gps','gps_accuracy') | float(0) }},
            "elevation": {{ state_attr('device_tracker.ublox_gps','altitude') | float(0) }},
            "source_type": "gps"
          }
    # Tracker’s textual state stays constant
    - action: mqtt.publish
      data:
        topic: homeassistant/device_tracker/ublox_gps_filtered/state
        qos: 1
        retain: true
        payload: "home"

