# Unbounded LIFETIME Riemann total of the speed-density fuel rate (L). This is
# NOT remaining/used-this-trip fuel and NOT tank-relative. The osrm_proxy
# fuel-trips/fuel-stats endpoints read DELTAS of this sensor (litres burned over
# a window) and divide by GPS distance to get L/100km. Resets to 0 on HA restart,
# so consumers must guard delta < 0. Never surface it raw on a fuel-level card.
# Stays trapezoidal (checked 2026-10-17): its rpm attribute rewrites the
# template every second once the engine turns, so the first non-zero rate is
# never booked over a silent stretch; the hourly check found no phantom
# litres after its first day (2026-06-03). The VE fit in template/sensors.yaml
# was made on this method's totals.
- platform: integration
  name: "Estimated Fuel Used Total (L)"
  unique_id: "estimated_fuel_used_total_l"
  source: sensor.estimated_fuel_rate
  unit_time: h
  method: trapezoidal
  round: 3

