# ================================
# integrations/sensor.yaml
# ================================
# Platform-based sensors: statistics, history_stats, integration (Riemann sum)

# ─── Fuel level • 5-minute rolling mean ───
- platform: statistics
  name: "WiCAN Fuel 5 min mean"
  entity_id: sensor.192_168_10_90_2f_fueltanklevel
  state_characteristic: mean
  max_age:
    minutes: 5
  sampling_size: 300

# ─── Water tank levels • rolling median (fresh 5 min, grey 30 min) ───
# Feed sensor.stable_fresh_water_level / stable_grey_water_level
# (template/triggered.yaml). A median, not a mean: the grey sender spikes from
# ~10 % to 30–50 % for seconds at a time even parked (2026-09-24), and a mean
# would carry those spikes. The senders publish about once a second.
# Grey also wanders for several minutes at a time while parked (its 5-min
# medians went 19 → 36 → 20 → 16 % within an hour on 2026-09-25, against a
# steady 7 % overnight), so it gets 30 min. Replaying 72 h of history with the
# stable sensor's latch: 7.0 → 2.5 changes per parked hour, still following the
# dumps and fills. Fresh already changes about once every two parked hours on
# 5 min, and a shorter window shows real use sooner.
- platform: statistics
  name: "Fresh Water Level 5 min median"
  unique_id: fresh_water_level_5_min_median
  entity_id: sensor.a32_pro_fresh_water_tank_level
  state_characteristic: median
  max_age:
    minutes: 5
  sampling_size: 400
  precision: 1

- platform: statistics
  name: "Grey Water Level 30 min median"
  unique_id: grey_water_level_30_min_median
  entity_id: sensor.a32_pro_grey_water_tank_level
  state_characteristic: median
  max_age:
    minutes: 30
  sampling_size: 2400
  precision: 1

# ─── Battery net power • 5-minute rolling mean ───
# Smooths the noisy BMS net power so the "time to full / empty" estimate doesn't
# jump on momentary load spikes. + = charging, − = discharging. Used by the
# template sensor.battery_time_estimate (which falls back to instantaneous power
# until this populates after a restart).
- platform: statistics
  name: "Olins Van BMS Power 5 min mean"
  unique_id: olins_van_bms_power_5min
  entity_id: sensor.olins_van_bms_power
  state_characteristic: mean
  max_age:
    minutes: 5
  sampling_size: 300

# ─── Hydronic heater run-time tracking ───
- platform: history_stats
  name: "Hydronic Heater Total On-Time"
  entity_id: switch.a32_pro_switch24_hydronic_heater
  state: "on"
  type: time
  start: "{{ as_datetime('2025-01-24 00:00:00') }}"
  end: "{{ now() }}"

# ─── Riemann sum energy integrations (Wh) ───
# method: left + max_sub_interval 5 min since 2026-10-17 (trapezoidal before).
# The power templates (template/sensors.yaml) write only when their value
# changes, so a channel that is off sits at exactly 0 W with no writes for
# hours (an A32 or BMS dropout reads 0 W too, through float(0)). Trapezoidal
# then books the next step at half its value over the whole silent stretch:
# on 2026-09-28 the alternator template held 0 W from 21:25 to 09:48, the
# engine started, the first sample was 736 W, and the integral jumped
# 4,556 Wh at once (that hour really had 287 Wh). Noise blips and the shore
# charger's float pulses did the same on a small scale every day: Aug 18 –
# Oct 16 2026 the alternator total read 22 % high, the inverter 11 %, the
# shore charger 7 %. HA's docs prefer left for sources that hold their state
# for long periods, and max_sub_interval for sources that stay constant
# (their energy example uses 5 min). Left holds each value until the next
# one, which is what these step-like sources do: replaying the raw states
# with it matches the recorder's time-weighted means to within 1 Wh an hour.
# The timer books a steady load in the hour it happens instead of at the
# next change.
# Legacy platform: loaded at an HA restart only, no reload. Days whose totals
# are wrong from before the change: docs/entities.md, Energy Sensors.
- platform: integration
  name: "Air Conditioning Energy (Wh)"
  unique_id: "air_conditioning_energy_wh"
  source: sensor.air_conditioning_power_24v
  method: left
  max_sub_interval:
    minutes: 5
  round: 2

- platform: integration
  name: "All 24V Devices Energy (Wh)"
  unique_id: "all_24v_devices_energy_wh"
