###############################################################################
#  A8-PRO ESPHome firmware – roof-fan / IR hub / AC climate controller
#  board: esp32dev  –  IR TX GPIO2  –  IR RX GPIO23
###############################################################################

esphome:
  name: ag-pro
  friendly_name: AG Pro
  # On boot, restored globals can be stale (e.g. an OTA reboot left assumed_on=true
  # while the AC actually reset to OFF). Once the power reading has settled, reconcile
  # the assumed on/off against reality instead of blindly trusting the restored value.
  on_boot:
    - priority: -100
      then:
        - delay: 45s
        - script.execute: ac_power_reconcile

# Put substitutions early so they're available everywhere
substitutions:
  MAX_SPEED: "6"          # easy tweak later
  AC_DEFAULT_TEMP: "26"   # temp the AC starts at when powered on
  AC_DEFAULT_FAN: "4"     # fan level the AC starts at when powered on (1L–6L)
  AC_MIN_TEMP: "16"
  AC_MAX_TEMP: "32"
  AC_SHUTDOWN_MS: "30000" # compressor stop-down period in ms (used by delay: actions)
  AC_SHUTDOWN_S: "30"     # same period in seconds (climate min_cooling_off_time needs second precision)
  AC_POWERON_SETTLE_MS: "3000" # IR-ready settle after the power toggle before the first sync press.
                               # 1500 was too short: the receiver wasn't ready, so the first (arming)
                               # press was dropped and temp landed one step short (26->20 landed 21).
                               # 3000 verified to land exactly (26->22) on 2026-06-26.

esp32:
  board: esp32dev
  framework:
    type: arduino

# ─────────────────────────────────────────────────────────────────────────────
# Core
# ─────────────────────────────────────────────────────────────────────────────
logger:
api:
  encryption:
    key: !secret ag_pro_api_key
  actions:
    # esphome.ag_pro_roof_fan_thermostat: lid open, direction, speed and the
    # fan's own thermostat at temp_f (29–99 °F). One IR frame = one beep.
    - action: roof_fan_thermostat
      variables:
        temp_f: int
        exhaust: bool
        speed_pct: int
      then:
        - lambda: |-
            int s = speed_pct / 10;
            if (s < 1) s = 1;
            if (s > 10) s = 10;
            id(roof_fan).direction = exhaust ? FanDirection::FORWARD : FanDirection::REVERSE;
            id(roof_fan).speed = s;
            id(roof_fan).publish_state();          // no control() call, so no manual frame
            int t = temp_f;
            if (t < 29) t = 29;
            if (t > 99) t = 99;
            id(roof_fan_set_point_f).publish_state(t);
        - switch.turn_on: roof_fan_thermostat
ota:
  - platform: esphome
    password: !secret ag_pro_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: 192.168.10.61
    gateway: 192.168.10.1
    subnet: 255.255.255.0
  ap:
    ssid: "AG-Pro Fallback Hotspot"
    password: !secret ag_pro_ap_password

captive_portal:

uart:
  - id: zigbee_uart
    tx_pin: GPIO33
    rx_pin: GPIO32
    baud_rate: 115200

# ─────────────────────────────────────────────────────────────────────────────
# IR
# ─────────────────────────────────────────────────────────────────────────────
remote_receiver:
  pin: GPIO23
  tolerance: 25%
  filter: 50us
  idle: 10000us
  dump: all

remote_transmitter:
  id: transmitter_main
  pin: GPIO2         # <- warning: strapping pin – use at your own risk
  carrier_duty_percent: 50%

# ─────────────────────────────────────────────────────────────────────────────
# Globals
# ─────────────────────────────────────────────────────────────────────────────
globals:
  - id: fan_output_float
    type: float
    restore_value: no
    initial_value: '0.0'

  # ── AC climate controller state ──
  - id: ac_assumed_on
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: ac_target_temp
    type: int
    restore_value: yes
    initial_value: '${AC_DEFAULT_TEMP}'
  - id: ac_current_temp
    type: int
    restore_value: yes
    initial_value: '${AC_DEFAULT_TEMP}'
  - id: ac_fan_level
    type: int
    restore_value: yes
    initial_value: '${AC_DEFAULT_FAN}'
  - id: ac_current_fan
    type: int
    restore_value: yes
    initial_value: '${AC_DEFAULT_FAN}'
  - id: ac_shutdown_active
    type: bool
    restore_value: no
    initial_value: 'false'
  # True while an on/off command's effect is ramping in, so the power-feedback
  # reconciler stays hands-off during the laggy power transition (no invert race).
  - id: ac_busy
    type: bool
    restore_value: no
    initial_value: 'false'
  # True only while the power reconciler is syncing the displayed climate mode to
  # reality — makes cool_mode/off_mode skip the IR toggle so a sync can't move the AC.
  - id: ac_reconciling
    type: bool
    restore_value: no
    initial_value: 'false'

# ─────────────────────────────────────────────────────────────────────────────
# HA sensor imports (for AC power feedback)
# ─────────────────────────────────────────────────────────────────────────────
sensor:
  - platform: homeassistant
    id: ac_power_sensor
    entity_id: sensor.air_conditioning_power_24v
    # NOTE: this reading lags the real AC state by many seconds, so it is NO LONGER
    # used to drive on/off state — doing so caused state races/inversions (a command
    # issued during the lag window would read the wrong assumed state and toggle the
    # AC the wrong way). 'ac_assumed_on' is now owned solely by the cool_mode /
    # off_mode command actions. This sensor is kept for monitoring only.
  - platform: homeassistant
    id: ac_room_temp
    entity_id: sensor.a32_pro_bme280_1_temperature  # was sensor.bme280_1_temperature (missing a32_pro_ prefix → read None)
    unit_of_measurement: "°C"
    filters:
      - heartbeat: 30s

text_sensor:
  - platform: template
    name: "24V AC Status"
    id: ac_status_text
    icon: mdi:air-conditioner
    lambda: |-
      if (id(ac_shutdown_active))
        return std::string("Shutdown (compressor cooldown)");
      if (!id(ac_assumed_on))
        return std::string("Off");
      char buf[48];
      snprintf(buf, sizeof(buf), "Cooling — %d°C, Fan %d/6",
               id(ac_current_temp), id(ac_current_fan));
      return std::string(buf);
    update_interval: 5s

binary_sensor:
  - platform: template
    name: "24V AC Compressor Shutdown"
    id: ac_shutdown_sensor
    icon: mdi:timer-sand
    lambda: 'return id(ac_shutdown_active);'

  # Debounced "the AC is really drawing power" signal from the (laggy) power
  # sensor. Threshold sits above standby (off ~0 W, on ~30-40 W). delayed_on/off
  # ride out the reading lag and brief dips so it can't flap. on_state feeds the
  # reconciler, which corrects ac_assumed_on when idle (see ac_power_reconcile).
  - platform: template
    name: "24V AC - Power Detected"
    id: ac_power_on
    device_class: power
    lambda: |-
      if (!id(ac_power_sensor).has_state()) return {};
      return id(ac_power_sensor).state > 5.0f;  // above 0 W standby; low enough to catch eco/sleep low-fan draw
    filters:
      - delayed_on: 8s
      - delayed_off: 45s
    on_state:
      - script.execute: ac_power_reconcile

# ─────────────────────────────────────────────────────────────────────────────
# Fan entity (10-step speed fan)
# ─────────────────────────────────────────────────────────────────────────────
fan:
  - platform: speed
    name: "Roof Fan"
    id: roof_fan
    speed_count: 10
    direction_output: roof_fan_direction
    output: roof_fan_speed_out
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_off:
      - switch.template.publish:
          id: ceiling_fan_mode
          state: OFF
      - cover.template.publish:
          id: roof_fan_lid
          state: CLOSED
    on_turn_on:
      - if:
          condition:
            - switch.is_off: ceiling_fan_mode
          then:
            - cover.template.publish:
                id: roof_fan_lid
                state: OPEN

output:
  - platform: ledc
    pin: GPIO4
    id: buzzer
    frequency: 2000 Hz
    channel: 0

  - platform: template          # direction (FORWARD = exhaust, REVERSE = intake)
    id: roof_fan_direction
    type: float
    write_action:
      - if:
          condition:
            lambda: |-
              return id(roof_fan).direction == FanDirection::FORWARD;
          then:
            - switch.template.publish:
                id: ceiling_fan_mode
                state: OFF

  - platform: template          # speed – captures the float sent by the fan
    id: roof_fan_speed_out
    type: float
    write_action:
      - lambda: id(fan_output_float) = state;

      # If we're going above 0% speed, ensure we're not in ceiling mode,
      # and the lid is OPEN before we send the first speed IR.
      - if:
          condition:
            lambda: 'return state > 0.0f;'
          then:
            # If using roof mode (NOT ceiling fan) and lid is still closed, open it first
            - if:
                condition:
                  and:
                    - fan.is_on: roof_fan
                    - switch.is_off: ceiling_fan_mode
                    - lambda: 'return id(roof_fan_lid).position <= 0.5f;'
                then:
                  - cover.template.publish:
                      id: roof_fan_lid
                      state: OPEN
                  # small pause so our optimistic cover state flips before dispatch
                  - delay: 400ms

            - script.execute: roof_fan_dispatch

# ─────────────────────────────────────────────────────────────────────────────
# Cover  (lid sensor is only virtual/optimistic for now)
# ─────────────────────────────────────────────────────────────────────────────
cover:
  - platform: template
    id: roof_fan_lid
    name: "Roof Fan Lid"
    assumed_state: true
    optimistic: true
    on_open:
      - if:
          condition:
            lambda: 'return id(roof_fan_lid).position > 0.5f;'
          then:
            - if:
                condition:
                  fan.is_off: roof_fan
                then:
                  # fan off – lid open IR code
                  - remote_transmitter.transmit_raw:
                      transmitter_id: transmitter_main
                      carrier_frequency: 38kHz
                      code: [1815,-743,893,-1527,846,-787,895,-1526,845,-789,894,-716,1717,-716,849,-2402,6515,-2403,893,-5584,851,-1593,5715,-785,888,-1533,847,-4812,913,-2342,4954,-724,1711,-1533,847,-4007,912,-3154,4159,-725,2468,-1593,2511,-1536,1708,-3154,2472,-1594,3332,-1536,1706,-728,846,-785,3267,-1596,1646,-786,1644,-789,850,-762,844,-1579,869,-8061,845,-1577,2494,-763,1670,-1572,3265,-794,2491]
                  # that frame has the auto bit clear
                  - switch.template.publish:
                      id: roof_fan_thermostat
                      state: OFF
            - if:
                condition:
                  and:
                    - fan.is_on: roof_fan
                    - switch.is_on: ceiling_fan_mode
                then:
                  - switch.template.publish:
                      id: ceiling_fan_mode
                      state: OFF
    on_closed:
      - if:
          condition:
            and:
              - fan.is_on: roof_fan
              - switch.is_off: ceiling_fan_mode
          then:
            - switch.template.publish:
                id: ceiling_fan_mode
                state: ON
      - if:
          condition:
            fan.is_off: roof_fan
          then:
            # fan off – lid closed IR code
            - remote_transmitter.transmit_raw:
                transmitter_id: transmitter_main
                carrier_frequency: 38kHz
                code: [1604,-834,778,-1646,800,-835,779,-1645,802,-834,780,-836,1601,-834,800,-2455,6474,-2457,802,-5710,805,-1620,5651,-858,779,-1645,803,-4899,779,-2458,4875,-834,1604,-1645,780,-4083,804,-3265,4025,-835,2397,-1670,2401,-1647,1602,-3294,7270,-1646,1604,-3270,2398,-1671,3228,-859,1577,-833,803,-1644,778,-8145,800,-1646,2402,-836,1626,-1623,1599,-835,774,-861,2400]
            # that frame has the auto bit clear
            - switch.template.publish:
                id: roof_fan_thermostat
                state: OFF

# ─────────────────────────────────────────────────────────────────────────────
# Misc switches
# ─────────────────────────────────────────────────────────────────────────────
switch:
  - platform: template
    id: ceiling_fan_mode
    name: "Ceiling Fan Mode"
    icon: mdi:ceiling-fan
    optimistic: true
    on_turn_on:
      - lambda: |-
          auto call = id(roof_fan).make_call();
          call.set_speed(id(roof_fan).speed);
          call.set_direction(FanDirection::REVERSE);
          call.perform();
      - if:
          condition:
            fan.is_off: roof_fan
          then:
            - fan.turn_on: roof_fan
      - cover.template.publish:
          id: roof_fan_lid
          state: CLOSED
    on_turn_off:
      - if:
          condition:
            fan.is_on: roof_fan
          then:
            - cover.template.publish:
                id: roof_fan_lid
                state: OPEN

  # Roof fan thermostat (the remote's Auto mode): the fan runs by itself while
  # the room is above roof_fan_set_point_f, lid open. Any manual fan command
  # (roof_fan_dispatch) ends it, as on the remote. Frames decoded 2026-09-17,
  # see the roof_fan_send_frame script.
  - platform: template
    id: roof_fan_thermostat
    name: "Roof Fan Thermostat"
    icon: mdi:thermostat-auto
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - switch.template.publish:
          id: ceiling_fan_mode
          state: OFF
      # Lid first if it is shut (its own frame); the auto frame follows.
      - if:
          condition:
            lambda: 'return id(roof_fan_lid).position <= 0.5f;'
          then:
            - cover.template.publish:
                id: roof_fan_lid
                state: OPEN
            - delay: 500ms
      # An auto frame does not start a stopped motor (2026-09-17 test: nothing
      # for 2 min), but a running fan stays on under one and then cycles by
      # itself. So start it manually at the chosen speed/direction first.
      - if:
          condition:
            lambda: 'return !id(roof_fan).state;'
          then:
            - script.execute:
                id: roof_fan_send_frame
                flags: !lambda 'return 0x09 | (id(roof_fan).direction == FanDirection::FORWARD ? 0x04 : 0x00);'
                speed_pct: !lambda 'return std::max(1, std::min(10, id(roof_fan).speed)) * 10;'
                temp_f: !lambda 'return (int) id(roof_fan_set_point_f).state;'
            - delay: 3s
      - switch.template.publish:
          id: roof_fan_thermostat
          state: ON
      - script.execute: roof_fan_send_thermostat
    turn_off_action:
      - switch.template.publish:
          id: roof_fan_thermostat
          state: OFF
      # Back to the manual state (fan off → off frame, which clears the auto bit).
      - script.execute: roof_fan_dispatch

# ─────────────────────────────────────────────────────────────────────────────
# Climate entity – 24V Mini-Split AC (IR-controlled)
#
#   The mini-split has its own internal thermostat.  We use the ESPHome
#   thermostat platform purely as a UI wrapper:
#     – "Cool" mode  → IR power-on + sync to target temp/fan
#     – "Off" mode   → IR power-off
#     – Target temp   → IR temp_up/temp_down presses to match
#     – Fan modes     → IR speed_up/speed_down presses to match
#     – Swing toggle  → IR swing_flap
#
#   The BME280 room-temp sensor (on A32 Pro) is imported from HA for the
#   "current temperature" readout.  Hysteresis is set very wide so the
#   thermostat never auto-triggers cool/idle — we control everything
#   manually through the mode and target_temperature_change actions.
#
#   Power-on defaults: 26 °C, fan level 4 (1L–6L).
#   30 s compressor stop-down enforced via min_cooling_off_time.
#   "Reinitialize" button re-syncs assumed ↔ actual state.
# ─────────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────────
# AC fan level as a 1–6 number. The climate entity only exposes low/medium/high
# (= 2/4/6), but the hardware has 6 steps — this exposes every step so the
# dashboard can drive a 1L–6L slider. Reports ac_current_fan; on set it updates
# the target and walks the fan via the existing ac_sync_fan (when the AC is on).
# ─────────────────────────────────────────────────────────────────────────────
number:
  # Roof fan thermostat set point. The fan thinks in whole °F (29–99).
  - platform: template
    name: "Roof Fan Thermostat Set Point"
    id: roof_fan_set_point_f
    icon: mdi:thermometer-auto
    unit_of_measurement: "°F"
    min_value: 29
    max_value: 99
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 65
    set_action:
      # Publish first: the optimistic publish only happens after this action.
      - lambda: 'id(roof_fan_set_point_f).publish_state(x);'
      - if:
          condition:
            switch.is_on: roof_fan_thermostat
          then:
            - script.execute: roof_fan_send_thermostat

  - platform: template
    name: "24V AC - Fan Level"
    id: ac_fan_level_number
    icon: mdi:fan
    min_value: 1
    max_value: 6
    step: 1
    mode: slider
    unit_of_measurement: "L"
    lambda: 'return id(ac_current_fan);'
    update_interval: 3s
    set_action:
      - lambda: |-
          int lvl = (int) x;
          if (lvl < 1) lvl = 1;
          if (lvl > 6) lvl = 6;
          id(ac_fan_level) = lvl;
      - if:
          condition:
            lambda: 'return id(ac_assumed_on) && !id(ac_shutdown_active);'
          then:
            - script.execute: ac_sync_fan

climate:
  - platform: thermostat
    name: "24V Air Conditioner"
    id: ac_climate
    sensor: ac_room_temp
    min_idle_time: 5s
    min_cooling_off_time: ${AC_SHUTDOWN_S}s
    min_cooling_run_time: 5s
    startup_delay: true        # enforce compressor delay on boot
    cool_deadband: 50.0       # effectively disable auto-trigger
    cool_overrun: 50.0        # effectively disable auto-trigger
    visual:
      min_temperature: ${AC_MIN_TEMP}
      max_temperature: ${AC_MAX_TEMP}
      # Target is whole degrees (the AC only does 1° setpoints), but report the
      # room/current temp at 0.1° so it isn't rounded (23.9 was showing as 24).
      temperature_step:
        target_temperature: 1.0
        current_temperature: 0.1
    default_preset: Normal
    on_boot_restore_from: memory
    preset:
      - name: Normal
        default_target_temperature_high: ${AC_DEFAULT_TEMP}
        fan_mode: MEDIUM
      - name: eco
        default_target_temperature_high: 28
        fan_mode: LOW
      - name: boost
        default_target_temperature_high: 18
        fan_mode: HIGH

    # ── Mode changes (user selects COOL / OFF in the HA UI) ──
    #    Because the deadband is 50 °C, cool_action will never auto-fire.
    #    The REAL on/off work is done by cool_mode / off_mode.
    cool_action:
      - logger.log: "AC thermostat cool_action (auto-trigger — should never fire)"
    idle_action:
      - logger.log: "AC thermostat idle (no action — AC manages its own thermostat)"
    cool_mode:
      # Skip the IR path when the power reconciler is only syncing the displayed
      # mode to reality (it updates the internal state itself; must NOT toggle the AC).
      - if:
          condition:
            lambda: 'return !id(ac_reconciling);'
          then:
            - script.execute: ac_turn_on
    off_mode:
      - if:
          condition:
            lambda: 'return !id(ac_reconciling);'
          then:
            - script.execute: ac_turn_off

    # ── Target temperature changed ──
    target_temperature_change_action:
      - lambda: |-
          int new_temp = (int)id(ac_climate).target_temperature;
          if (new_temp < ${AC_MIN_TEMP}) new_temp = ${AC_MIN_TEMP};
          if (new_temp > ${AC_MAX_TEMP}) new_temp = ${AC_MAX_TEMP};
          id(ac_target_temp) = new_temp;
          // Skip the IR walk while a preset/reconcile is syncing state (ac_reconciling):
          // those set the AC directly, so walking would double-send.
          if (id(ac_assumed_on) && !id(ac_shutdown_active) && !id(ac_reconciling)) {
            id(ac_sync_temp).execute();
          }

    # ── Fan modes: LOW=2, MEDIUM=4, HIGH=6 ──
    fan_mode_low_action:
      - lambda: |-
          id(ac_fan_level) = 2;
          if (id(ac_assumed_on) && !id(ac_shutdown_active))
            id(ac_sync_fan).execute();
    fan_mode_medium_action:
      - lambda: |-
          id(ac_fan_level) = 4;
          if (id(ac_assumed_on) && !id(ac_shutdown_active))
            id(ac_sync_fan).execute();
    fan_mode_high_action:
      - lambda: |-
          id(ac_fan_level) = 6;
          if (id(ac_assumed_on) && !id(ac_shutdown_active))
            id(ac_sync_fan).execute();
    min_fan_mode_switching_time: 2s

    # ── Swing mode ──
    swing_vertical_action:
      - script.execute: air_conditioner_swing_flap
    swing_off_action:
      - script.execute: air_conditioner_swing_flap

script:
  # ───────────────────────────────────────────────────────────────────────────
  # Roof fan frame builder (decoded from the remote, 2026-09-17)
  #   One 16-byte packet per press, 1200 baud 8N2 LSB-first serial on a 38 kHz
  #   carrier, carrier ON = logic 0:
  #     5A A5 80 7F 40 BF 20 DF 10 CC | flags | speed % | set °F | FF 23 | XOR(bytes 0..12)
  #   flags: bit0 power, bit1 ceiling-fan mode, bit2 air out (exhaust),
  #          bit3 lid open, bit4 thermostat (auto) mode.
  #   The captured Pronto scripts below are the same packets; this builds any
  #   of them, which is how the thermostat set point gets sent.
  # ───────────────────────────────────────────────────────────────────────────
  - id: roof_fan_send_frame
    mode: queued
    parameters:
      flags: int
      speed_pct: int
      temp_f: int
    then:
      - remote_transmitter.transmit_raw:
          transmitter_id: transmitter_main
          carrier_frequency: 38kHz
          code: !lambda |-
            uint8_t b[16] = {0x5A, 0xA5, 0x80, 0x7F, 0x40, 0xBF, 0x20, 0xDF, 0x10, 0xCC,
                             (uint8_t) flags, (uint8_t) speed_pct, (uint8_t) temp_f, 0xFF, 0x23, 0x00};
            uint8_t x = 0;
            for (int i = 0; i < 13; i++) x ^= b[i];
            b[15] = x;
            const int32_t BIT = 833;               // µs, 1200 baud
            std::vector<int32_t> code;
            int cur = -1;                          // 0 = carrier on (mark), 1 = off (space)
            int32_t run = 0;
            auto push = [&](int lv) {
              if (lv == cur) { run++; return; }
              if (cur >= 0) code.push_back(cur == 0 ? run * BIT : -(run * BIT));
              cur = lv; run = 1;
            };
            for (int i = 0; i < 16; i++) {
              push(0);                             // start bit
              for (int n = 0; n < 8; n++) push((b[i] >> n) & 1);
              push(1); push(1);                    // stop bit + the idle bit the remote leaves
            }
            code.push_back(cur == 0 ? run * BIT : -(run * BIT));
            return code;

  # Auto frame from the current fan direction/speed and the set point number.
  - id: roof_fan_send_thermostat
    mode: restart
    then:
      - script.execute:
          id: roof_fan_send_frame
          flags: !lambda 'return 0x18 | (id(roof_fan).direction == FanDirection::FORWARD ? 0x04 : 0x00);'
          speed_pct: !lambda 'return std::max(1, std::min(10, id(roof_fan).speed)) * 10;'
          temp_f: !lambda 'return (int) id(roof_fan_set_point_f).state;'

  # ───────────────────────────────────────────────────────────────────────────
  # Dispatcher script – chooses the correct IR command
  #   (references specific IR scripts that appear later in the file)
  # ───────────────────────────────────────────────────────────────────────────
  - id: roof_fan_dispatch
    mode: restart
    then:
      - lambda: |-
          using Scr = esphome::script::SingleScript<>*;

          const bool pwr     = id(roof_fan).state;                       // ON / OFF
          const bool lidOpen = id(roof_fan_lid).position > 0.5f;
          const bool exhaust = id(roof_fan).direction == FanDirection::FORWARD;
          const int  step    = std::max(1, std::min(10, id(roof_fan).speed)) - 1;

          // A manual frame has the auto bit clear, so it ends thermostat mode.
          if (id(roof_fan_thermostat).state) id(roof_fan_thermostat).publish_state(false);

          /* -----  OFF  --------------------------------------------------- */
          if (!pwr) {
            if (lidOpen) {
              id(roof_fan_off_and_open).execute();
            } else {
              id(roof_fan_off_and_closed).execute();
            }
            return;
          }

          /* -----  ON  ---------------------------------------------------- */
          static Scr const tbl_closed[10] = {
            id(roof_fan_on_closed_speed_10), id(roof_fan_on_closed_speed_20),
            id(roof_fan_on_closed_speed_30), id(roof_fan_on_closed_speed_40),
            id(roof_fan_on_closed_speed_50), id(roof_fan_on_closed_speed_60),
            id(roof_fan_on_closed_speed_70), id(roof_fan_on_closed_speed_80),
            id(roof_fan_on_closed_speed_90), id(roof_fan_on_closed_speed_100)
          };

          static Scr const tbl_out[10] = {
            id(roof_fan_on_open_air_out_speed_10),  id(roof_fan_on_open_air_out_speed_20),
            id(roof_fan_on_open_air_out_speed_30),  id(roof_fan_on_open_air_out_speed_40),
            id(roof_fan_on_open_air_out_speed_50),  id(roof_fan_on_open_air_out_speed_60),
            id(roof_fan_on_open_air_out_speed_70),  id(roof_fan_on_open_air_out_speed_80),
            id(roof_fan_on_open_air_out_speed_90),  id(roof_fan_on_open_air_out_speed_100)
          };
          static Scr const tbl_in[10] = {
            id(roof_fan_on_open_air_in_speed_10),   id(roof_fan_on_open_air_in_speed_20),
            id(roof_fan_on_open_air_in_speed_30),   id(roof_fan_on_open_air_in_speed_40),
            id(roof_fan_on_open_air_in_speed_50),   id(roof_fan_on_open_air_in_speed_60),
            id(roof_fan_on_open_air_in_speed_70),   id(roof_fan_on_open_air_in_speed_80),
            id(roof_fan_on_open_air_in_speed_90),   id(roof_fan_on_open_air_in_speed_100)
          };

          Scr next = nullptr;
          if (!lidOpen)         next = tbl_closed[step];
          else if (exhaust)     next = tbl_out[step];
          else                  next = tbl_in[step];

          if (next) next->execute();


