###############################################################################
# AC Climate Controller Scripts
#
#   These scripts bridge the climate entity ↔ IR commands.
#   They track assumed temp/fan state in globals and send the correct
#   number of temp_up/temp_down or speed_up/speed_down presses.
###############################################################################

  # ── Turn ON: send IR toggle, mark assumed on, sync to target ──
  - id: ac_turn_on
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(ac_shutdown_active);'
          then:
            - logger.log: "AC turn-on blocked — compressor shutdown in progress"
            - lambda: 'return;'
      - if:
          condition:
            lambda: 'return id(ac_assumed_on);'
          then:
            - logger.log: "AC already assumed on — skipping turn-on"
            - lambda: 'return;'
      - logger.log: "AC: sending ON toggle"
      - script.execute: air_conditioner_on_off
      - delay: ${AC_POWERON_SETTLE_MS}ms
      # After power-on the AC starts at default temp/fan
      - lambda: |-
          id(ac_assumed_on)   = true;
          id(ac_current_temp) = ${AC_DEFAULT_TEMP};
          id(ac_current_fan)  = ${AC_DEFAULT_FAN};
          // Read desired target from the climate entity
          id(ac_target_temp) = (int)id(ac_climate).target_temperature;
      - script.execute: ac_sync_temp
      - script.wait: ac_sync_temp
      - script.execute: ac_sync_fan
      - script.wait: ac_sync_fan

  # ── Turn OFF: send IR toggle, start shutdown timer ──
  - id: ac_turn_off
    mode: single
    then:
      - if:
          condition:
            lambda: 'return !id(ac_assumed_on);'
          then:
            - logger.log: "AC already assumed off — skipping turn-off"
            - lambda: 'return;'
      - logger.log: "AC: sending OFF toggle"
      - script.execute: air_conditioner_on_off
      - lambda: |-
          id(ac_assumed_on)       = false;
          id(ac_shutdown_active)  = true;
      - delay: ${AC_SHUTDOWN_MS}ms
      - lambda: |-
          id(ac_shutdown_active) = false;
          ESP_LOGI("ac", "Compressor shutdown period complete");

  # ── Sync temperature: press temp_up/temp_down to reach target ──
  - id: ac_sync_temp
    mode: restart
    then:
      - lambda: |-
          ESP_LOGI("ac", "Syncing temp: %d -> %d", id(ac_current_temp), id(ac_target_temp));
      # The remote's FIRST up/down press only ARMS adjust mode (value blinks ~4 s)
      # without changing it; later presses step by one. So prime once in the travel
      # direction, then walk the real steps (kept <4 s apart to stay armed).
      - if:
          condition:
            lambda: 'return id(ac_current_temp) != id(ac_target_temp);'
          then:
            - if:
                condition:
                  lambda: 'return id(ac_current_temp) < id(ac_target_temp);'
                then:
                  - script.execute: air_conditioner_temp_up
                else:
                  - script.execute: air_conditioner_temp_down
            - delay: 600ms
      - while:
          condition:
            lambda: 'return id(ac_current_temp) < id(ac_target_temp);'
          then:
            - script.execute: air_conditioner_temp_up
            - delay: 400ms
            - lambda: 'id(ac_current_temp) += 1;'
      - while:
          condition:
            lambda: 'return id(ac_current_temp) > id(ac_target_temp);'
          then:
            - script.execute: air_conditioner_temp_down
            - delay: 400ms
            - lambda: 'id(ac_current_temp) -= 1;'
      - lambda: |-
          ESP_LOGI("ac", "Temp synced to %d", id(ac_current_temp));

  # ── Sync fan speed: press speed_up/speed_down to reach target ──
  - id: ac_sync_fan
    mode: restart
    then:
      # Same arming behavior as temp: first speed press only arms (blinks ~4 s),
      # later presses step by one. Prime once in the travel direction.
      - if:
          condition:
            lambda: 'return id(ac_current_fan) != id(ac_fan_level);'
          then:
            - if:
                condition:
                  lambda: 'return id(ac_current_fan) < id(ac_fan_level);'
                then:
                  - script.execute: air_conditioner_speed_up
                else:
                  - script.execute: air_conditioner_speed_down
            - delay: 600ms
      - while:
          condition:
            lambda: 'return id(ac_current_fan) < id(ac_fan_level);'
          then:
            - script.execute: air_conditioner_speed_up
            - delay: 400ms
            - lambda: 'id(ac_current_fan) += 1;'
      - while:
          condition:
            lambda: 'return id(ac_current_fan) > id(ac_fan_level);'
          then:
            - script.execute: air_conditioner_speed_down
            - delay: 400ms
            - lambda: 'id(ac_current_fan) -= 1;'
      - lambda: |-
          ESP_LOGI("ac", "Fan synced to level %d", id(ac_current_fan));

  # ── Reinitialize: power-cycle the AC and re-sync all state ──
  #    Use when IR commands were missed and state is out of sync.
  - id: ac_reinitialize
    mode: single
    then:
      - logger.log:
          level: WARN
          format: "AC REINITIALIZE: power-cycling to re-sync state"
      # Step 1: If assumed on, turn off first
      - if:
          condition:
            lambda: 'return id(ac_assumed_on);'
          then:
            - script.execute: air_conditioner_on_off
            - lambda: |-
                id(ac_assumed_on)      = false;
                id(ac_shutdown_active) = true;
            - delay: ${AC_SHUTDOWN_MS}ms
            - lambda: 'id(ac_shutdown_active) = false;'
      # Step 2: Turn on (AC will start at defaults)
      - script.execute: air_conditioner_on_off
      - delay: ${AC_POWERON_SETTLE_MS}ms
      - lambda: |-
          id(ac_assumed_on)   = true;
          id(ac_current_temp) = ${AC_DEFAULT_TEMP};
          id(ac_current_fan)  = ${AC_DEFAULT_FAN};
          // Read desired targets from the climate entity
          id(ac_target_temp) = (int)id(ac_climate).target_temperature;
      # Step 3: Sync to desired targets
      - script.execute: ac_sync_temp
      - script.wait: ac_sync_temp
      - script.execute: ac_sync_fan
      - script.wait: ac_sync_fan
      - lambda: |-
          ESP_LOGI("ac", "Reinitialize complete: %d C, fan %d",
                   id(ac_target_temp), id(ac_fan_level));

  # ── Busy window: held true while an on/off command's effect ramps in, so the
  #    power-feedback reconciler doesn't act on the laggy reading mid-command.
  #    restart mode: each new toggle restarts the 40 s window.
  - id: ac_busy_window
    mode: restart
    then:
      - lambda: 'id(ac_busy) = true;'
      - delay: 40s
      - lambda: 'id(ac_busy) = false;'

  # ── Apply a remote preset (strong/eco/sleep). The preset IR frame jumps the AC
  #    straight to temp/fan in one shot, so we just sync our belief + the user-facing
  #    climate entity to match, WITHOUT walking (ac_reconciling suppresses the IR).
  - id: ac_apply_preset
    parameters:
      temp: int
      fan: int
    then:
      - lambda: |-
          id(ac_assumed_on)   = true;
          id(ac_current_temp) = temp;
          id(ac_target_temp)  = temp;
          id(ac_current_fan)  = fan;
          id(ac_fan_level)    = fan;
          id(ac_reconciling)  = true;
          auto call = id(ac_climate).make_call();
          call.set_mode(climate::CLIMATE_MODE_COOL);
          call.set_target_temperature(temp);
          call.perform();
      - delay: 300ms
      - lambda: 'id(ac_reconciling) = false;'

  # ── Power-feedback reconciler (Layer 1 + 2): corrects assumed on/off from the
  #    debounced power sensor, but ONLY when idle (no recent command) and not in
  #    the compressor lockout. Edge-triggered from ac_power_on's on_state and once
  #    on boot — so it fixes real drift (reboot, physical remote, manual off at the
  #    unit) without re-introducing the invert-during-command race we removed before.
  - id: ac_power_reconcile
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(ac_power_on).has_state() && !id(ac_busy) && !id(ac_shutdown_active);'
          then:
            - if:
                condition:
                  # Inconsistent if the real (debounced power) on/off disagrees with
                  # either our internal belief or the displayed climate mode.
                  lambda: |-
                    bool real_on = id(ac_power_on).state;
                    bool mode_on = id(ac_climate).mode == climate::CLIMATE_MODE_COOL;
                    return !(real_on == id(ac_assumed_on) && real_on == mode_on);
                then:
                  - lambda: |-
                      bool real_on = id(ac_power_on).state;
                      ESP_LOGW("ac", "Power-sync: %.1f W (on=%d) vs assumed_on=%d -> syncing to %s",
                               id(ac_power_sensor).state, real_on, id(ac_assumed_on),
                               real_on ? "COOL" : "OFF");
                      // 1) Fix the internal belief directly.
                      id(ac_assumed_on) = real_on;
                      if (real_on) {
                        // External power-on: the unit always comes up at its hardware default.
                        id(ac_current_temp) = ${AC_DEFAULT_TEMP};
                        id(ac_current_fan)  = ${AC_DEFAULT_FAN};
                      }
                      // 2) Push the user-facing climate mode to match, with IR suppressed.
                      id(ac_reconciling) = true;
                      auto call = id(ac_climate).make_call();
                      call.set_mode(real_on ? climate::CLIMATE_MODE_COOL
                                            : climate::CLIMATE_MODE_OFF);
                      call.perform();
                  # Hold the suppress flag briefly in case the mode trigger is
                  # deferred a loop, then release so normal commands fire IR again.
                  - delay: 300ms
                  - lambda: 'id(ac_reconciling) = false;'

