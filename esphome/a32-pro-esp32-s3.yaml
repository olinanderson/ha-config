  - platform: modbus_controller
    modbus_controller_id: s5140
    id: s5140_ch34_temp
    name: "S5140 Channel 34 Temperature - Blower Coolant"
    address: 133
    register_type: holding
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    value_type: S_WORD
    accuracy_decimals: 1
    filters:
      - lambda: "return x / 10.0;"
      - lambda: "return (x == 110.0 || x == -40.0) ? NAN : x;"
      - sliding_window_moving_average:
          window_size: 7
          send_every: 1
    # Blower coolant gate (Auto / PID mode only). Evaluated on every sample so
    # the fan starts within a second of the coolant getting there instead of
    # on the next 10 s PID write. Hysteresis keeps it from chattering and
    # lets residual heat blow out after the heater stops.
    on_value:
      then:
        - lambda: |-
            if (std::isnan(x)) return;
            float on_t = id(blower_start_temp).state;
            float off_t = on_t - ${blower_gate_hysteresis_c};
            bool ready = id(blower_coolant_ready);
            if (!ready && x >= on_t) {
              ready = true;
              ESP_LOGI("BLOWER", "Coolant %.1f C >= %.0f C -> blower released.", x, on_t);
            } else if (ready && x <= off_t) {
              ready = false;
              ESP_LOGI("BLOWER", "Coolant %.1f C <= %.0f C -> blower held off.", x, off_t);
            }
            if (ready == id(blower_coolant_ready)) return;
            id(blower_coolant_ready) = ready;
            id(blower_coolant_ready_sensor).publish_state(ready);
            if (!id(blower_active)) return;   // Manual mode: the blower isn't ours
            if (ready) {
              float v = id(coolant_blower_heating).get_output_value();
              if (v > 0.0f) {
                auto call = id(blower).turn_on();
                call.set_brightness(v > 1.0f ? 1.0f : v);
                call.perform();
              }
            } else if (id(blower).remote_values.is_on()) {
              id(blower).turn_off().perform();
            }

