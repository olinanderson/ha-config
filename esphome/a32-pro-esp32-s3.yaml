esphome:
  name: a32-pro
  friendly_name: a32-Pro
  platformio_options:
    board_build.flash_mode: dio

# Hydronic heater monitor / blower gate constants that aren't worth a HA
# entity. The user-tunable thresholds (blower start temp, heater OK temp, max
# restarts) live under `number:` further down.
substitutions:
  # A lit burner lifts the HX#1 coolant sensor ~12 °C/min (2026-09-11: 42 -> 75 °C
  # in 3 min). Failed starts drift < 2.5 °C in 5 min from engine/ambient heat.
  # 8 °C over the trailing 5 min separates the two with margin both ways.
  heater_rise_min_c: "8.0"
  # Relay-on -> first coolant rise takes ~2.5 min (glow plug + flame). Leave
  # room for the Espar's own internal repeat before we cycle the relay.
  heater_start_timeout_ms: "360000"    # 6 min
  # Running heater whose coolant drops below the OK temp and stays flat: how
  # long before we assume the burner died and cycle the relay.
  heater_stall_timeout_ms: "360000"    # 6 min
  # Blower gate hysteresis: the blower stops once coolant falls this far below
  # the start temp, so residual heat still gets blown into the van.
  blower_gate_hysteresis_c: "10.0"

external_components:
  - source: github://Fabian-Schmidt/esphome-victron_ble

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

logger:
  # We must allow at least DEBUG globally
  # to get debug logs for climate.pid
  level: DEBUG

  logs:
    wifi: ERROR
    i2c: ERROR
    api: ERROR
    esp32_ble_tracker: ERROR
    esp32_ble: ERROR
    esp32_ble_client: ERROR 
    sensor: ERROR
    modbus_controller: ERROR
    modbus_controller.sensor: ERROR
    modbus: ERROR
    victron_ble: ERROR
    component: ERROR
    light: ERROR 

    # Add these new overrides:
    text_sensor: ERROR
    uart_debug: ERROR

    # Keep the PID climate at DEBUG:
    climate.pid: DEBUG

# Enable Home Assistant API
api:
  encryption:
    key: "RPIb2C8lYPlFQY3YCdd0p+X/IRgFoodz01ywDlWjHLI="

esp32_ble_tracker:
  scan_parameters:
    interval: 1200ms
    window: 800ms
    active: true

bluetooth_proxy:
  active: true
  cache_services: true

ota:
  platform: esphome
  password: "d35448720d5d7813fe49d7d79b98d308"

# Victron Bluetooth Stuff

victron_ble:
  # MPPT 1: 250W array — four small Custom Marine Products panels, wired 2s2p:
  #   2x CMP24060SR-065-BLG (65W, SunPower cells, semi-rigid black long)
  #   2x 60W Walk-On semi-rigid (HJT cells)
  - id: MPPT_Controller_1
    mac_address: "d9601c9c69b2"  # Replace with the Bluetooth MAC address of MPPT 1
    bindkey: "fcee7ed9507bb605fba0c8ebd5ab3422"  # Replace with the encryption key for MPPT 1

  # MPPT 2: 400W array — one CMP25400H semi-flexible panel
  #   (108 PERC cells 6x18, 31V / 12.9A, 1127 x 1728 mm, junction box mid-panel)
  - id: MPPT_Controller_2
    mac_address: "c6a19a580ead"  # Replace with the Bluetooth MAC address of MPPT 2
    bindkey: "74d155c02b86c64b572853306bc74694"  # Replace with the encryption key for MPPT 2

  - id: Smart_Battery_Sense_12V
    mac_address: "e4a576a4b459"
    bindkey: "8741db6dda477fa0ea0e82ea5d85f6ee"

  # Orion-Tr Smart 12/24-15 DC-DC charger (alternator -> 24V house bank, alongside 2x Sterling B2Bs)
  - id: Orion_DCDC_Charger
    mac_address: "cefc6f3bf6e5"
    bindkey: "d9cfee225265053b82c201b9c7dbe5d9"

time:
  - platform: sntp
    id: real_time_clock
    timezone: "UTC"  # or your preferred timezone
    
ethernet:
  type: W5500
  manual_ip:
    static_ip: 192.168.10.64
    gateway: 192.168.10.1
    subnet: 255.255.255.0
  clk_pin: GPIO42
  mosi_pin: GPIO44
  miso_pin: GPIO40
  cs_pin: GPIO39
  interrupt_pin: GPIO41
  reset_pin: GPIO43

i2c:
   - id: bus_a
     sda: 11
     scl: 10
     scan: true
     frequency: 400kHz

xl9535:
  - id: xl9535_hub_out1 # for output channel 1-16
    address: 0x21
  - id: xl9535_hub_out2 # for output channel 17-32
    address: 0x22
  - id: xl9535_hub_in1 # for input channel 1-16
    address: 0x24
  - id: xl9535_hub_in2 # for input channel 17-32
    address: 0x25

pcf8574:
  - id: 'pcf8574_in_3'  # for input channel 33-40
    address: 0x23

  # DO8 Relay Expansion Board
  - id: 'pcf8574_hub_out_1'  # for output channel 1-8 DO8 expansion board 
    address: 0x27

uart:
  - id: mbus
    baud_rate: 19200
    tx_pin: 9
    rx_pin: 8

  - id: uart_tuya
    baud_rate: 115200
    tx_pin: 15
    rx_pin: 16

  - id: uart_sim7600
    baud_rate: 115200
    tx_pin: 18
    rx_pin: 17

# Modbus configuration
modbus:
  id: modbus1
  uart_id: mbus  # Reference to the UART defined above

modbus_controller:
  # Living Area 
  - id: BME280_1
    address: 1
    modbus_id: modbus1
    update_interval: 10s  # Adjust the update interval as needed
    
    # Drivers cab 
  - id: BME280_2
    address: 2
    modbus_id: modbus1
    update_interval: 10s  # Adjust the update interval as needed

    # Shower    
  - id: BME280_3
    address: 3
    modbus_id: modbus1
    update_interval: 10s  # Adjust the update interval as needed
    
    #Outdoor Underneath Van
  - id: BME280_4
    address: 4
    modbus_id: modbus1
    update_interval: 10s  # Adjust the update interval as needed
    
  - id: s5140
    address: 5
    modbus_id: modbus1
    update_interval: 250ms

button: 
  - platform: template
    name: "Inverter On-Off Toggle"
    on_press:
      then:
        - script.execute: push_inverter

  # ── New: software reboot control ───────────────────────────────
  - platform: restart          # built‑in “Restart” platform
    name: "Restart A32-Pro"    # shown in HA
    id: restart_a32            # optional; handy if you want to call it from scripts
    icon: "mdi:restart"        # optional – pick any HA icon you like

switch:
  # ─── Shop Lockout ───
  # Mirrors input_boolean.shop_mode in Home Assistant. While this is ON every
  # physical rocker / button handler in binary_sensor: is skipped entirely, so a
  # press never reaches the relay at all. This is what removes the ~1 s "blip"
  # you get when the lockout lives in HA instead: HA can only react AFTER the
  # a32_pro has already closed the relay.
  #
  # restore_mode keeps the lockout across an ESP reboot, and because it is also
  # a normal HA entity it can be cleared directly if the input_boolean is ever
  # wedged — that avoids a lockout you cannot undo without a reflash.
  - platform: template
    name: "Shop Lockout"
    id: shop_lockout
    icon: mdi:lock-alert
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: gpio
    pin: 45
    name: "LED"

  - platform: uart
    uart_id: mbus
    name: "RS485 Button"
    data: [0x11, 0x22, 0x33, 0x44, 0x55]

  - platform: uart
    uart_id: uart_sim7600
    name: "UART 4G"
    data: "AT+CGSN\r\n" # read 4G SIM7600 ID

  # Kincony D08 Expansion Relay Module
  - platform: gpio
    name: DO8 Switch01
    pin:
      pcf8574: pcf8574_hub_out_1
      number: 0
      mode: OUTPUT
      inverted: true

  - platform: gpio
    name: DO8 Switch02
    pin:
      pcf8574: pcf8574_hub_out_1
      number: 1
      mode: OUTPUT
      inverted: true
     
  - platform: gpio
    name: DO8 Switch03 Inverter Button
    id: inverter_button
    pin:
      pcf8574: pcf8574_hub_out_1
      number: 2
      mode: OUTPUT
      inverted: true
     
  - platform: gpio
    name: DO8 Switch04 Shore Power Charger 
    pin:
      pcf8574: pcf8574_hub_out_1
      number: 3
      mode: OUTPUT
      inverted: true
    restore_mode: RESTORE_DEFAULT_ON
     
  - platform: gpio
    name: DO8 Switch05 Battery Heater
    id: do8_switch05_battery_heater
    pin:
