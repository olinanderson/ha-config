binary_sensor:
  # Import HA input_boolean for hot water mode
  - platform: homeassistant
    id: ha_hot_water_mode
    entity_id: input_boolean.hot_water_mode
    on_state:
      - if:
          condition:
            lambda: 'return x;'   # Hot Water Mode turned ON
          then:
            # Fire the heater up for hot water (skip if power off or locked out).
            - if:
                condition:
                  and:
                    - switch.is_on: hydronic_heater_power_supply_control
                    - switch.is_off: hydronic_heater_on_off_physical
                    - lambda: 'return !id(ha_heater_fuel_lockout).state;'
                then:
                  - switch.turn_on: hydronic_heater_on_off_physical
                  - logger.log:
                      level: INFO
                      format: "Hot Water Mode ON -> heater turned ON."
          else:
            # Hot Water Mode turned OFF: drop the heater unless the thermostat is
            # heating or the user manually wants it on. The is_on guard avoids a
            # spurious no-op turn_off (+ timestamp/log) when HA reports the
            # retained "off" state at boot.
            - if:
                condition:
                  and:
                    - switch.is_on: hydronic_heater_on_off_physical
                    - lambda: 'return !id(heater_manual_request);'
                    - lambda: 'return id(coolant_blower_heating).mode == climate::CLIMATE_MODE_OFF;'
                then:
                  - switch.turn_off: hydronic_heater_on_off_physical
                  - lambda: |-
                      id(hydronic_heater_last_off_timestamp) = id(real_time_clock).now().timestamp;
                  - logger.log:
                      level: INFO
                      format: "Hot Water Mode OFF -> heater turned OFF."

  # Import HA input_boolean for low fuel heater lockout
  - platform: homeassistant
    id: ha_heater_fuel_lockout
    entity_id: input_boolean.heater_low_fuel_lockout
    on_state:
      # Lockout cleared (refuelled, or the dashboard override): drop the
      # "locked out" verdict so a still-on climate relights the heater on its
      # next PID tick instead of showing a stale lockout message.
      - if:
          condition:
            lambda: 'return !x && id(heater_retry_state) == 5;'
          then:
            - lambda: 'id(heater_retry_state) = 0;'
            - logger.log:
                level: INFO
                format: "Low fuel lockout cleared -> heater may start again."

  # ON once the coolant has reached "Hydronic Blower Start Temp" (number:),
  # OFF again 10 °C below it. Only the PID (Auto) blower path honours it;
  # manual blower control and the shoe dryer are unaffected. Published from
  # the s5140_ch34_temp on_value handler.
  - platform: template
    name: "Hydronic Blower Coolant Ready"
    id: blower_coolant_ready_sensor
    device_class: heat
    entity_category: diagnostic

  # Follow HA's Shop Mode toggle. Arming input_boolean.shop_mode drives the
  # firmware-level lockout above, so both stay in step from a single switch.
  - platform: homeassistant
    id: ha_shop_mode
    entity_id: input_boolean.shop_mode
    on_state:
      - if:
          condition:
            lambda: 'return x;'
          then:
            - switch.turn_on: shop_lockout
          else:
            - switch.turn_off: shop_lockout

