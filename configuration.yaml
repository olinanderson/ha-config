# ============================================================
# configuration.yaml - Olin's Van (Home Assistant)
# ============================================================
# Refactored: all config split into separate include files.
# Backup of the monolithic original: yaml_backups/configuration.yaml
# ============================================================

# --- Core ---
recorder:
  auto_purge: true
  purge_keep_days: 60

history:

media_source:

stream:

go2rtc:

frontend:
  themes: !include_dir_merge_named themes

# --- Lovelace dashboards ---
# mode: storage keeps the default Overview dashboard working.
lovelace:
  mode: storage

# --- Custom Panels (React dashboards + Vanlife) ---
panel_custom:
  - name: van-dashboard
    url_path: dashboard
    sidebar_title: Dashboard
    sidebar_icon: mdi:view-dashboard
    module_url: /local/react-dashboard/panel-loader.js?v=16
    embed_iframe: false
    trust_external_script: true
  - name: vanlife-panel
    url_path: vanlife
    sidebar_title: Vanlife
    sidebar_icon: mdi:map-marker-path
    module_url: /local/vanlife-panel/panel.js?v=12

# --- Includes ---
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
shell_command: !include shell_commands.yaml

conversation:
  intents: !include conversations.yaml
intent_script: !include intent_scripts.yaml

# --- Input helpers ---
input_boolean: !include input_boolean.yaml
input_number: !include input_number.yaml
input_text: !include input_text.yaml
input_select: !include input_select.yaml

# --- Template sensors & binary sensors ---
template: !include_dir_merge_list template/

# --- REST sensors ---
# NWS severe-weather alerts at the van's LIVE GPS point. resource_template
# injects the current tracker lat/lon into the proxy URL each scan, so the alert
# subscription follows the van instead of a fixed home zone. The proxy does the
# api.weather.gov fetch server-side (it needs a real User-Agent). NEW `rest:` key.
rest:
  - resource_template: >-
      http://127.0.0.1:8765/vanlife/nws-alerts?lat={{ state_attr('device_tracker.ublox_gps','latitude') | default('', true) }}&lon={{ state_attr('device_tracker.ublox_gps','longitude') | default('', true) }}
    scan_interval: 300
    sensor:
      - name: "NWS Highest Alert"
        unique_id: nws_highest_alert
        value_template: "{{ value_json.highest_event }}"
        json_attributes:
          - count
          - highest_severity
          - alert_id
          - expires
          - headline

# --- Integration sensors (Riemann, statistics, history) ---
# NOTE: the smoothed fuel level sensor.wican_fuel_5_min_mean (statistics, mean
# over 5 min) lives in integrations/sensor.yaml. There is intentionally no
# `filter:` include — `filter` is a sensor PLATFORM, not a top-level integration,
# so a top-level `filter:` key was silently ignored by HA (dead config).
sensor: !include integrations/sensor.yaml

# --- MQTT (device tracker via YAML; sensors via MQTT discovery) ---
mqtt:
  device_tracker: !include mqtt/device_tracker.yaml
  sensor: !include mqtt/sensors.yaml

# --- Vanlife API proxy (for Nabu Casa remote access) ---
vanlife_api:
