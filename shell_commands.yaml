# This is the shell command that's used to duck the audio of the video player when a notification is played
load_ducking_docker: >
  ssh -i /config/ssh_keys/ha_host_id_ed25519
      -p 22222
      -o StrictHostKeyChecking=no
      root@172.30.32.1 "
        docker exec hassio_audio pactl list modules |
        grep -q module-role-ducking ||
        docker exec hassio_audio pactl load-module module-role-ducking \
          trigger_roles=video ducking_roles=any_role volume=-20dB global=true"

# Start the VBAN audio receiver (replaces scream): PC audio -> van SPDIF. Runs a
# script on the HAOS host that sets up UDP-6980 forwarding, stages the receiver
# binary into hassio_audio, applies the tsched=0 crackle fix, sets the SPDIF sink
# as default, and starts vban_receptor. Binary + script live in /config/vban/.
start_vban_receptor: >
  ssh -i /config/ssh_keys/ha_host_id_ed25519
  -p 22222
  -o StrictHostKeyChecking=no
  root@172.30.32.1
  'sh /mnt/data/supervisor/homeassistant/vban/start-receiver.sh'

# The van services below (osrm_proxy, gps_ublox, gps_filter, dvr_proxy) log to
# /config/vanlife-data/, next to their databases. HA serves www/, where their
# code lives, at /local/ without login, so until 2026-10-08 all of it was public.

# Restart routing CORS proxy
restart_osrm_proxy: >
  /bin/sh -c '
    python3 /config/www/vanlife-panel/kill_osrm.py;
    sleep 2;
    cd /config/www/vanlife-panel &&
    nohup python3 osrm_proxy.py >> /config/vanlife-data/osrm_proxy.log 2>&1 &
    echo "Routing proxy restarted"'

# Start routing CORS proxy so the vanlife panel can call GraphHopper without CORS
# errors. Idempotent: no-ops if port 8765 is already listening (same nc guard as
# start_dvr_proxy) so the watchdog can call it without killing a live proxy. Use
# restart_osrm_proxy to force a fresh start.
start_osrm_proxy: >
  /bin/sh -c 'if ! nc -z 127.0.0.1 8765 2>/dev/null; then
    python3 /config/www/vanlife-panel/kill_osrm.py;
    sleep 2;
    cd /config/www/vanlife-panel &&
    nohup python3 osrm_proxy.py >> /config/vanlife-data/osrm_proxy.log 2>&1 &
    echo "Routing proxy started";
  else
    echo "Routing proxy already running";
  fi'

# Start u-blox USB GPS bridge — reads NMEA from /dev/ttyACM0 and publishes the
# device_tracker.ublox_gps MQTT tracker (raw GPS source for the whole system).
start_gps_ublox: >
  /bin/sh -c 'if [ ! -f /tmp/gps_ublox.pid ] || ! kill -0 $(cat /tmp/gps_ublox.pid) 2>/dev/null; then
    cd /config/www/vanlife-panel &&
    nohup python3 gps_ublox.py >> /config/vanlife-data/gps_ublox.log 2>&1 &
    echo $! > /tmp/gps_ublox.pid;
    echo "u-blox GPS bridge started";
  else
    echo "u-blox GPS bridge already running";
  fi'

# Restart u-blox USB GPS bridge — kill existing and start fresh. The pkill
# pattern is anchored, as in restart_gps_filter: unanchored it also matched this
# shell's own command line and killed it before the start (2026-10-08).
restart_gps_ublox: >
  /bin/sh -c 'kill $(cat /tmp/gps_ublox.pid) 2>/dev/null;
    pkill -f "^python3.*gps_ublox" 2>/dev/null;
    sleep 1;
    cd /config/www/vanlife-panel &&
    nohup python3 gps_ublox.py >> /config/vanlife-data/gps_ublox.log 2>&1 &
    echo $! > /tmp/gps_ublox.pid;
    echo "u-blox GPS bridge restarted"'

# Start GPS filter daemon — pre-processes raw GPS into filtered segments + routes.
# gps_filter.py reads its HA token from /config/.gps_filter_token itself. It used
# to get it as --token, where any ps in the container printed it (2026-10-08).
start_gps_filter: >
  /bin/sh -c 'if [ ! -f /tmp/gps_filter.pid ] || ! kill -0 $(cat /tmp/gps_filter.pid) 2>/dev/null; then
    if [ ! -s /config/.gps_filter_token ]; then echo "No token in /config/.gps_filter_token"; exit 1; fi;
    cd /config/www/vanlife-panel &&
    nohup python3 gps_filter.py >> /config/vanlife-data/gps_filter.log 2>&1 &
    echo $! > /tmp/gps_filter.pid;
    echo "GPS filter daemon started";
  else
    echo "GPS filter daemon already running";
  fi'

# Restart GPS filter daemon — kill existing and start fresh (e.g. after the
# source ENTITY_ID changes) so it re-reads its config. The pkill pattern is
# anchored: "python3.*gps_filter" also matched this shell's own command line,
# so pkill killed the shell before the start (2026-10-08).
restart_gps_filter: >
  /bin/sh -c 'kill $(cat /tmp/gps_filter.pid) 2>/dev/null;
    pkill -f "^python3.*gps_filter" 2>/dev/null;
    sleep 1;
    if [ ! -s /config/.gps_filter_token ]; then echo "No token in /config/.gps_filter_token"; exit 1; fi;
    cd /config/www/vanlife-panel &&
    nohup python3 gps_filter.py >> /config/vanlife-data/gps_filter.log 2>&1 &
    echo $! > /tmp/gps_filter.pid;
    echo "GPS filter daemon restarted"'

# Start DVR proxy — camera playback API + RTSP proxy
# Installs ffmpeg if missing (apk packages don't persist across HAOS reboots)
start_dvr_proxy: >
  /bin/sh -c 'which ffmpeg >/dev/null 2>&1 || apk add --no-cache ffmpeg >/dev/null 2>&1;
    if ! nc -z 127.0.0.1 8766 2>/dev/null; then
      cd /config/www/react-dashboard &&
      nohup python3 dvr_proxy.py >> /config/vanlife-data/dvr_proxy.log 2>&1 &
      echo "DVR proxy started";
    else
      echo "DVR proxy already running";
    fi'

# Restart DVR proxy — kill existing and start fresh. Anchored pkill pattern, as
# in restart_gps_ublox.
restart_dvr_proxy: >
  /bin/sh -c 'which ffmpeg >/dev/null 2>&1 || apk add --no-cache ffmpeg >/dev/null 2>&1;
    pkill -f "^python3.*dvr_proxy" 2>/dev/null;
    sleep 2;
    cd /config/www/react-dashboard &&
    nohup python3 dvr_proxy.py >> /config/vanlife-data/dvr_proxy.log 2>&1 &
    echo "DVR proxy restarted"'

# Called after a fill-up is detected — queries fuel-stats API to compute the
# actual L/100km, updates input_number.fuel_ve_correction, and appends an
# entry to input_text.ve_correction_history.
# Arguments: from_ts (epoch ms of previous fill-up), to_ts (epoch ms of now)
update_ve_from_fillup: "python3 /config/ve_update.py {{ from_ts }} {{ to_ts }}"
