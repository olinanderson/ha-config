# ================================
# input_text.yaml
# ================================
# ─── Fill-up tracking + VE correction history ───
last_fillup_ts:
  name: "Last Fill-up Timestamp (ms)"
  icon: mdi:gas-station
  max: 20
  initial: "0"

ve_correction_history:
  name: "VE Correction History"
  icon: mdi:history
  max: 255
  initial: "[]"

# --- Vanlife Tracker journal ---
vanlife_stop_name:
  name: "Stop Name"
  icon: mdi:map-marker
  max: 100
  initial: ""

vanlife_stop_notes:
  name: "Stop Notes"
  icon: mdi:notebook-edit
  max: 255
  initial: ""

vanlife_stop_id:
  name: "Editing Stop ID"
  icon: mdi:identifier
  max: 20
  initial: ""

# --- Live Trip computer timestamps (epoch ms) ---
# No `initial:` so they RESTORE across restarts (mid-trip restart keeps the trip).
trip_start_ts:
  name: "Live Trip Start (ms)"
  icon: mdi:clock-start
  max: 20

trip_end_ts:
  name: "Live Trip End (ms)"
  icon: mdi:clock-end
  max: 20

# --- NWS alert anti-spam: id of the last alert we notified for ---
nws_last_notified_id:
  name: "NWS Last Notified Alert ID"
  icon: mdi:weather-lightning
  max: 255
  initial: ""
