# ================================
# input_text.yaml
# ================================
# ─── Fill-up tracking + VE correction history ───
last_fillup_ts:
  name: "Last Fill-up Timestamp (ms)"
  icon: mdi:gas-station
  max: 20
  initial: "0"

ve_correction_history:
  name: "VE Correction History"
  icon: mdi:history
  max: 255
  initial: "[]"

# --- Vanlife Tracker journal ---
vanlife_stop_name:
  name: "Stop Name"
  icon: mdi:map-marker
  max: 100
  initial: ""

vanlife_stop_notes:
  name: "Stop Notes"
  icon: mdi:notebook-edit
  max: 255
  initial: ""

vanlife_stop_id:
  name: "Editing Stop ID"
  icon: mdi:identifier
  max: 20
  initial: ""

# --- Live Trip computer timestamps (epoch ms) ---
# No `initial:` so they RESTORE across restarts (mid-trip restart keeps the trip).
trip_start_ts:
  name: "Live Trip Start (ms)"
  icon: mdi:clock-start
  max: 20

trip_end_ts:
  name: "Live Trip End (ms)"
  icon: mdi:clock-end
  max: 20

# --- NWS alert anti-spam: id of the last alert we notified for ---
nws_last_notified_id:
  name: "NWS Last Notified Alert ID"
  icon: mdi:weather-lightning
  max: 255
  initial: ""

# Restore point for Shop Mode: the automations that were ALREADY disabled when
# Shop Mode was armed, stored as a comma-separated list of object_ids (no
# `automation.` prefix, to fit more in the 255-char cap). Shop Mode exit turns
# every automation back ON and then re-disables exactly these, so arming and
# disarming is state-preserving.
#
# input_text is used rather than a scene.create snapshot on purpose: scenes made
# by scene.create live in memory only and are GONE after a restart, and a shop
# pulling power is exactly the case this has to survive. input_text state IS
# restored. If the list ever overflows 255 chars it is truncated and the exit
# step falls back to "enable everything" — the notification says so.
shop_mode_prev_disabled:
  name: "Shop Mode – Previously Disabled Automations"
  icon: mdi:playlist-remove
  max: 255
