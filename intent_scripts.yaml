# config/intent_scripts.yaml
# What the local sentences in custom_sentences/en/van.yaml do. The pipeline
# matches those before Claude is asked (prefer_local_intents), so they answer
# at once. `platforms: [conversation]` keeps each intent to that path: HA
# only handles it for the conversation agent and only offers it to an LLM
# when an entity of that domain is exposed, and none is. Claude has its own
# tools for the same jobs (script.voice_roof_fan, the Van area), see
# docs/voice-assistant.md. Reload: intent_script.reload (deploy.sh does it).

RoofFanTurnOn:
  platforms: &local_only [conversation]
  action:
    - action: script.voice_roof_fan
      data: >-
        {%- set d = {'power': 'on'} -%}
        {%- if direction is defined %}{% set d = dict(d, direction=direction) %}{% endif -%}
        {%- if speed is defined %}{% set d = dict(d, speed=speed) %}{% endif -%}
        {{ d }}
      response_variable: fan
    - stop: ""
      response_variable: fan
  speech:
    text: "Roof fan on, {{ action_response.direction }} at {{ action_response.speed_percent }} percent."

RoofFanTurnOff:
  platforms: *local_only
  action:
    - action: script.voice_roof_fan
      data:
        power: "off"
  speech:
    text: "Roof fan off, closing the lid."

CookModeStart:
  platforms: *local_only
  speech:
    text: "Cook mode on. Propane open, cabinet lights full, fan on exhaust."
  action:
    - action: script.turn_on
      target:
        entity_id: script.cook_mode

CookModeStop:
  platforms: *local_only
  speech:
    text: "Cook mode off. Propane closed, everything back as it was."
  action:
    - action: script.turn_on
      target:
        entity_id: script.cook_mode_off

StartBedtimeRoutine:
  platforms: *local_only
  speech:
    text: "Good night."
  action:
    - action: script.turn_on
      target:
        entity_id: script.sleep_mode_on

GoodMorning:
  platforms: *local_only
  speech:
    text: "Good morning."
  action:
    - action: script.turn_on
      target:
        entity_id: script.wake_up_routine

# The indoor lights are every light in the Van area (voice/spec.yaml)
IndoorDimmersOff:
  platforms: *local_only
  speech:
    text: "Indoor lights off."
  action:
    - action: light.turn_off
      target:
        area_id: van

IndoorDimmersOn:
  platforms: *local_only
  speech:
    text: "Indoor lights on."
  action:
    - action: light.turn_on
      target:
        area_id: van

# Main and Cabinet lights' warmth through script.voice_light_warmth, which
# Claude uses too; "lights" alone is whichever of the two are on
LightWarmth:
  platforms: *local_only
  action:
    - action: script.voice_light_warmth
      data:
        lights: "{{ lights | default('both') }}"
        warmth: "{{ warmth }}"
      response_variable: result
    - stop: ""
      response_variable: result
  speech:
    text: "{{ action_response.say }}"

OutdoorLightsOff:
  platforms: *local_only
  speech:
    text: "Outdoor lights off."
  action:
    - action: switch.turn_off
      target:
        entity_id: &outdoor_lights
          - switch.a32_pro_switch21_left_outdoor_lights
          - switch.a32_pro_switch22_right_outdoor_lights
          - switch.a32_pro_switch23_rear_outdoor_lights

OutdoorLightsOn:
  platforms: *local_only
  speech:
    text: "Outdoor lights on."
  action:
    - action: switch.turn_on
      target:
        entity_id: *outdoor_lights

InsideTemperature:
  platforms: *local_only
  speech:
    text: >-
      {% set t = states('sensor.living_space_temperature') | float(none) %}
      {% if t is none %}The inside temperature isn't available right now.
      {% else %}It's {{ t | round(0) | int }} degrees inside.{% endif %}

# The time and date where the van is (sensor.van_time_zone), with the zone
# named: "It's 10:26 PM Pacific time." HA's clock if the zone isn't known yet.
LocalTime:
  platforms: *local_only
  speech:
    text: >-
      {%- set off = state_attr('sensor.van_time_zone', 'utc_offset_seconds') | int(none) %}
      {%- set t = utcnow() + timedelta(seconds=off) if off is not none else now() %}
      {%- set zone = state_attr('sensor.van_time_zone', 'spoken_name') if off is not none else 'Mountain' -%}
      It's {{ t.hour % 12 or 12 }}:{{ '%02d' | format(t.minute) }} {{ 'AM' if t.hour < 12 else 'PM' }} {{ zone }} time.

LocalDate:
  platforms: *local_only
  speech:
    text: >-
      {%- set off = state_attr('sensor.van_time_zone', 'utc_offset_seconds') | int(none) %}
      {%- set t = utcnow() + timedelta(seconds=off) if off is not none else now() -%}
      It's {{ t.strftime('%A, %B') }} {{ t.day }}.
