set_fan_mode:
  alias: "Set Fan Mode"
  sequence:
    - action: switch.turn_on
      target:
        entity_id: switch.coolant_blower_mode

update_speedtest:
  alias: "Update Speedtest"
  sequence:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.speedtest_running
    - action: homeassistant.update_entity
      target:
        entity_id:
          - sensor.speedtest_download
          - sensor.speedtest_upload
          - sensor.speedtest_ping
    # Wait a few seconds for the new values to come in (adjust delay as needed)
    - delay: "00:00:05"
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.speedtest_running

all_lights_toggle:
  alias: "Toggle All Lights Based on Mixed State"
  sequence:
    - choose:
        - conditions:
            - condition: template
              value_template: >
                {{ states('light.led_controller_cct_1')|default('off') == 'on' and states('light.led_controller_cct_2')|default('off') == 'on' and states('light.led_controller_sc_1')|default('off') == 'on' and states('light.led_controller_sc_2')|default('off') == 'on' }}
          sequence:
            - action: light.turn_off
              target:
                entity_id:
                  - light.led_controller_cct_1
                  - light.led_controller_cct_2
                  - light.led_controller_sc_1
                  - light.led_controller_sc_2
        - conditions:
            - condition: template
              value_template: >
                {{ not (states('light.led_controller_cct_1')|default('off') == 'on' and states('light.led_controller_cct_2')|default('off') == 'on' and states('light.led_controller_sc_1')|default('off') == 'on' and states('light.led_controller_sc_2')|default('off') == 'on') }}
          sequence:
            - action: light.turn_on
              target:
                entity_id:
                  - light.led_controller_cct_1
                  - light.led_controller_cct_2
                  - light.led_controller_sc_1
                  - light.led_controller_sc_2

roof_fan_toggle_direction:
  alias: Roof Fan ‑ Toggle Direction
  mode: single
  sequence:
    - action: fan.set_direction
      data:
        entity_id: fan.ag_pro_roof_fan
        direction: >
          {% if state_attr('fan.ag_pro_roof_fan', 'direction') == 'forward' %}
            reverse
          {% else %}
            forward
          {% endif %}

########################################################################
#  Cook Mode – snapshot current states, then prepare cooking            #
########################################################################
cook_mode:
  alias: Cook Mode
  mode: single
  sequence:
    # ❶ Snapshot everything we’re about to change
    - action: scene.create
      data:
        scene_id: pre_cook_mode
        snapshot_entities:
          - switch.a32_pro_switch16_lpg_valve
          - light.led_controller_cct_2
          - fan.ag_pro_roof_fan
          - cover.ag_pro_roof_fan_lid

    # ❷ Open the LPG valve
    - action: switch.turn_on
      target:
        entity_id: switch.a32_pro_switch16_lpg_valve

    # ❸ Lights to 100 %
    - action: light.turn_on
      target:
        entity_id: light.led_controller_cct_2
      data:
        brightness_pct: 100

    # ❹ Roof lid open (needed for exhaust)
    - action: cover.open_cover
      target:
        entity_id: cover.ag_pro_roof_fan_lid

    # ❺ Roof fan → exhaust @ 60 %
    - action: fan.set_direction
      data:
        entity_id: fan.ag_pro_roof_fan
        direction: forward # “forward” = exhaust
    - action: fan.turn_on
      data:
        entity_id: fan.ag_pro_roof_fan
        percentage: 60

########################################################################
#  Cook Mode Off – restore snapshot & ensure LPG is closed             #
########################################################################
cook_mode_off:
  alias: Cook Mode Off
  mode: single
  sequence:
    # ❶ Restore everything we captured earlier
    - action: scene.turn_on
      target:
        entity_id: scene.pre_cook_mode

    # ❷ (Extra safety) be sure LPG valve is closed
    - action: switch.turn_off
      target:
        entity_id: switch.a32_pro_switch16_lpg_valve

########################################################################
#  Power Saving Mode ON - snapshot current states, then turn off       #
########################################################################
power_saving_mode_on:
  alias: Power Saving Mode ON
  mode: single
  sequence:
    # Turn off (most) lights – EXCLUDE shower lights
    - action: light.turn_off
      target:
        entity_id:
          - light.led_controller_cct_1
          - light.led_controller_cct_2
          # - light.led_controller_sc_1   # ← shower (left alone)
          - light.led_controller_sc_2

    # Turn off monitors
    - action: switch.turn_off
      target:
        entity_id:
          - switch.a32_pro_do8_switch06_top_monitor
          - switch.a32_pro_do8_switch07_bottom_monitor

    # Turn OFF water system while away (but NOT if shower mode is on)
    - if:
        - condition: state
          entity_id: input_boolean.shower_mode
          state: "off"
      then:
        - action: switch.turn_off
          target:
            entity_id: switch.a32_pro_water_system_master_switch

    # Mark as in power saving mode
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.power_saving_mode

########################################################################
#  Power Saving Mode OFF - restore snapshot                            #
########################################################################
power_saving_mode_off:
  alias: Power Saving Mode OFF
  mode: single
  sequence:
    # Ensure inverter is ON before restoring AC-dependent devices
    - action: script.inverter_ensure_on

    # Restore the last rolling snapshot captured while PS mode was OFF
    - action: scene.turn_on
      target:
        entity_id: scene.last_active_state

    # Mark as not in power saving mode
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.power_saving_mode

########################################################################
#  Power Saving Mode Toggle - smart toggle based on current state      #
########################################################################
power_saving_mode_toggle:
  alias: Power Saving Mode Toggle
  mode: single
  sequence:
    - choose:
        - conditions:
            - condition: state
              entity_id: input_boolean.power_saving_mode
              state: "off"
          sequence:
            - action: script.power_saving_mode_on
        - conditions:
            - condition: state
              entity_id: input_boolean.power_saving_mode
              state: "on"
          sequence:
            - action: script.power_saving_mode_off

inverter_toggle:
  alias: Inverter, press button + set pending
  mode: single
  sequence:
    - action: input_boolean.turn_on # show “loading”
      target: { entity_id: input_boolean.inverter_toggle_pending }
    - action: button.press # your real inverter toggle
      target: { entity_id: button.a32_pro_inverter_on_off_toggle }
    - delay: "00:00:15" # safety net in case Shelly never answers
    - action: input_boolean.turn_off
      target: { entity_id: input_boolean.inverter_toggle_pending }

inverter_ensure_on:
  alias: Inverter – Ensure ON (idempotent)
  mode: single
  sequence:
    - if:
        - condition: state
          entity_id: binary_sensor.192_168_10_174
          state: "off"
        - condition: state
          entity_id: input_boolean.inverter_toggle_pending
          state: "off"
        # Respect a manual "off": if you turned the inverter off yourself,
        # don't let power-saving / wake flows force it back on.
        - condition: state
          entity_id: input_boolean.inverter_manual_lock
          state: "off"
      then:
        - action: script.inverter_toggle

########################################################################
#  Inverter – Ensure OFF (idempotent)                                   #
########################################################################
inverter_ensure_off:
  alias: Inverter – Ensure OFF (idempotent)
  mode: single
  sequence:
    - if:
        - condition: state
          entity_id: binary_sensor.192_168_10_174
          state: "on"
        - condition: state
          entity_id: input_boolean.inverter_toggle_pending
          state: "off"
      then:
        - action: script.inverter_toggle

########################################################################
#  Starlink – sleep start after 30 minutes (placeholder)                #
########################################################################
starlink_sleep_start_after_30m:
  alias: Starlink – Sleep start after 30 minutes
  mode: single
  sequence:
    # Set Starlink sleep start time to 30 minutes from now
    - action: time.set_value
      target:
        entity_id: time.starlink_sleep_start
      data:
        time: "{{ (now() + timedelta(minutes=30)).strftime('%H:%M:%S') }}"

########################################################################
#  Starlink – sleep start back to default (1 AM MST)                    #
#  Called when Sleep Mode is cancelled, so the dish reverts to its      #
#  normal nightly window (1:00 – 8:15 MST) instead of the +30 min       #
#  override set on sleep-on.                                            #
########################################################################
starlink_sleep_start_default:
  alias: Starlink – Sleep start back to default (1 AM MST)
  mode: single
  sequence:
    # 1 AM MST converted to current local time (mirrors the 8:15 MST wake)
    - action: time.set_value
      target:
        entity_id: time.starlink_sleep_start
      data:
        time: >
          {% set mst_offset = -7 %}  {# MST fixed UTC-7 #}
          {% set local_offset = (now().utcoffset().total_seconds() / 3600) | int %}
          {% set delta = local_offset - mst_offset %}
          {% set hour = (1 + delta) % 24 %}
          {{ '%02d:%02d:%02d' % (hour, 0, 0) }}

########################################################################
#  Bedtime Routine                                                      #
#  - Water system: ON to Main                                           #
#  - Under-cabinet: 100% for 5 minutes                                  #
#  - Roof hatch lighting: 20% for 10 minutes                            #
#  - After 10 minutes: inverter OFF, water OFF, all lights OFF          #
#  - Starlink sleep start scheduled for +30 minutes                     #
########################################################################
bedtime_routine:
  alias: Bedtime Routine
  mode: single
  sequence:
    # Schedule Starlink sleep start (runs independently)
    - action: script.starlink_sleep_start_after_30m

    # Ensure water system is on and set to Main
    - action: switch.turn_on
      target:
        entity_id: switch.a32_pro_water_system_master_switch
    - action: switch.turn_on
      target:
        entity_id: switch.a32_pro_water_system_state_main

    # Lighting pre-bed
    - action: light.turn_on
      target:
        entity_id: light.under_cabinet_lighting_switch
      data:
        brightness_pct: 100
    - action: light.turn_on
      target:
        entity_id: light.led_controller_cct_1  # use dimmer directly for roof hatch lighting
      data:
        brightness_pct: 20

    # Under-cabinet stays on for 5 minutes
    - delay: "00:05:00"
    - action: light.turn_off
      target:
        entity_id: light.under_cabinet_lighting_switch

    # After total of 10 minutes from start, do final shutdown
    - delay: "00:05:00"
    - action: script.inverter_ensure_off
    - action: switch.turn_off
      target:
        entity_id: switch.a32_pro_water_system_master_switch
    - action: light.turn_off
      target:
        entity_id:
          - light.led_controller_cct_1
          - light.led_controller_cct_2
          - light.led_controller_sc_1
          - light.led_controller_sc_2
          - light.main_lighting_switch
          - light.under_cabinet_lighting_switch

########################################################################
#  Sleep Mode ON / Good Night                                           #
#  Thin wrapper: flips the flag. The real Good-Night routine lives in   #
#  the `sleep_mode_on_actions` automation (triggered by this boolean),  #
#  so the dashboard toggle and voice intent run the same sequence.      #
########################################################################
sleep_mode_on:
  alias: Sleep Mode ON
  mode: single
  sequence:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.sleep_mode

########################################################################
#  Wake Up / Good Morning – restore essentials                          #
#  Thin wrapper: clears the flag. The restore routine lives in the      #
#  `sleep_mode_off_restore` automation (triggered by this boolean),     #
#  so the dashboard toggle and voice intent run the same sequence.      #
########################################################################
wake_up_routine:
  alias: Wake Up Routine
  mode: single
  sequence:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.sleep_mode

########################################################################
#  Shower Mode – simple toggle scripts                                   #
########################################################################
shower_mode_on:
  alias: Shower Mode ON
  mode: single
  sequence:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.shower_mode

shower_mode_off:
  alias: Shower Mode OFF
  mode: single
  sequence:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.shower_mode

# ============================================================
# Vanlife Tracker — Journal scripts
# ============================================================

vanlife_save_stop_edits:
  alias: "Vanlife: Save Stop Edits"
  description: "Reads the journal form inputs and calls vanlife_tracker.update_stop"
  mode: single
  sequence:
    - action: vanlife_tracker.update_stop
      data:
        stop_id: "{{ states('input_text.vanlife_stop_id') }}"
        name: "{{ states('input_text.vanlife_stop_name') }}"
        notes: "{{ states('input_text.vanlife_stop_notes') }}"
        rating: "{{ states('input_number.vanlife_stop_rating') | int(0) }}"
        category: "{{ states('input_select.vanlife_stop_category') }}"

vanlife_load_current_stop:
  alias: "Vanlife: Load Current Stop into Form"
  description: "Populates the journal form inputs from the current stop sensor"
  mode: single
  sequence:
    - action: input_text.set_value
      target:
        entity_id: input_text.vanlife_stop_id
      data:
        value: "{{ state_attr('sensor.vanlife_tracker_current_stop', 'stop_id') or '' }}"
    - action: input_text.set_value
      target:
        entity_id: input_text.vanlife_stop_name
      data:
        value: "{{ state_attr('sensor.vanlife_tracker_current_stop', 'name') or '' }}"
    - action: input_text.set_value
      target:
        entity_id: input_text.vanlife_stop_notes
      data:
        value: "{{ state_attr('sensor.vanlife_tracker_current_stop', 'notes') or '' }}"
    - action: input_number.set_value
      target:
        entity_id: input_number.vanlife_stop_rating
      data:
        value: "{{ state_attr('sensor.vanlife_tracker_current_stop', 'rating') | int(0) }}"
    - action: input_select.select_option
      target:
        entity_id: input_select.vanlife_stop_category
      data:
        option: "{{ state_attr('sensor.vanlife_tracker_current_stop', 'category') or 'other' }}"

vanlife_quick_save_stop:
  alias: "Vanlife: Quick Save Stop"
  description: "Creates a stop at current location with the form name/notes/rating/category"
  mode: single
  sequence:
    - action: vanlife_tracker.create_stop
      data:
        name: "{{ states('input_text.vanlife_stop_name') if states('input_text.vanlife_stop_name') != '' else none }}"
        notes: "{{ states('input_text.vanlife_stop_notes') }}"
        rating: "{{ states('input_number.vanlife_stop_rating') | int(0) }}"
        category: "{{ states('input_select.vanlife_stop_category') }}"
    # Clear the form after saving
    - action: input_text.set_value
      target:
        entity_id: input_text.vanlife_stop_name
      data:
        value: ""
    - action: input_text.set_value
      target:
        entity_id: input_text.vanlife_stop_notes
      data:
        value: ""
    - action: input_number.set_value
      target:
        entity_id: input_number.vanlife_stop_rating
      data:
        value: 0

# ─────────────────────────────────────────────────────────────────
# Starlink • PoE power-cycle recovery
# ─────────────────────────────────────────────────────────────────
# Fixes the PoE DC-DC converter lockup that kills the dish while driving.
#
# The critical detail is the OFF duration. The converter only resets once its
# capacitors have actually drained — observed 2026-08-07: a 25 s cut left it
# still latched, a 51 s cut recovered it. 90 s gives real margin over the value
# that was merely *just* long enough, and costs nothing (the link is already
# down). Do not shorten this to make the automation feel snappier.
#
# Two cycles max, 20 min apart, then it gives up and latches
# input_boolean.starlink_recovery_failed for the dashboard banner — because the
# other known fix (reseating the ethernet at the dish end) needs hands, and
# cycling a power supply forever accomplishes nothing.
starlink_recover:
  alias: "Starlink • power-cycle recovery sequence"
  icon: mdi:restart-alert
  mode: single
  max_exceeded: silent
  sequence:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.starlink_recovery_in_progress
    - action: persistent_notification.dismiss
      data:
        notification_id: starlink_recovery

    - repeat:
        sequence:
          - action: input_number.set_value
            target:
              entity_id: input_number.starlink_recovery_attempts
            data:
              value: "{{ repeat.index }}"

          # De-energise the injector and hold it down long enough to drain.
          - action: switch.turn_off
            target:
              entity_id: switch.a32_pro_switch26_starlink_power_supply
          - delay: "00:01:30"
          - action: switch.turn_on
            target:
              entity_id: switch.a32_pro_switch26_starlink_power_supply

          # Recovery = the dish is REACHABLE again (entities leave `unavailable`).
          # Deliberately not "connectivity == on": a reachable-but-obstructed dish
          # means the PoE link is fixed, which is the whole fault domain here.
          # Re-cycling over an obstruction would just be noise.
          - wait_template: >
              {{ states('binary_sensor.starlink_connectivity') not in ['unavailable', 'unknown'] }}
            timeout: "00:20:00"
            continue_on_timeout: true
        until:
          - condition: or
            conditions:
              - condition: template
                value_template: >
                  {{ states('binary_sensor.starlink_connectivity') not in ['unavailable', 'unknown'] }}
              - condition: template
                value_template: "{{ repeat.index >= 2 }}"

    - choose:
        # Still dark after both cycles → latch the banner and notify.
        - conditions:
            - condition: template
              value_template: >
                {{ states('binary_sensor.starlink_connectivity') in ['unavailable', 'unknown'] }}
          sequence:
            - action: input_boolean.turn_on
              target:
                entity_id: input_boolean.starlink_recovery_failed
            - action: persistent_notification.create
              data:
                notification_id: starlink_recovery
                title: "🛰 Starlink still offline"
                message: >
                  Two automatic power cycles of the Starlink power supply did not
                  bring the dish back. Try unplugging the ethernet cable at the
                  DISH end, or cut the power supply by hand for a full minute.
      default:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.starlink_recovery_failed
        - action: input_number.set_value
          target:
            entity_id: input_number.starlink_recovery_attempts
          data:
            value: 0

    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.starlink_recovery_in_progress

# Abort a running recovery SAFELY.
# Cancelling script.starlink_recover on its own is a footgun: HA does not run a
# stopped script's remaining steps, so a cancel during the 90 s off-window would
# leave the supply switched OFF — worse than the fault we're fixing. Always stop
# the sequence through here (the dashboard "Stop" button does).
starlink_recover_abort:
  alias: "Starlink • abort recovery and re-energise"
  icon: mdi:stop-circle-outline
  mode: single
  sequence:
    - action: script.turn_off
      target:
        entity_id: script.starlink_recover
    - action: switch.turn_on
      target:
        entity_id: switch.a32_pro_switch26_starlink_power_supply
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.starlink_recovery_in_progress
    - action: input_number.set_value
      target:
        entity_id: input_number.starlink_recovery_attempts
      data:
        value: 0

########################################################################
#  Shop Mode – apply the lockdown (idempotent)                         #
########################################################################
# The single source of truth for "what does Shop Mode actually shut off".
# Called by BOTH the input_boolean on-transition automation AND the
# post-restart re-assert automation, so a reboot at the shop reproduces the
# exact same state instead of a half-applied one.
#
# ORDER MATTERS: automations are disabled BEFORE any actuator is touched.
# rolling_last_active_snapshot_1hz rewrites scene.last_active_state every
# single second, so if it were still armed while this script turns the lights
# off it would capture the all-off state within 1 s and permanently destroy the
# Power Saving Mode restore point.
shop_mode_apply:
  alias: "Shop Mode – Apply lockdown (idempotent)"
  mode: single
  variables:
    # Automations that stay ARMED during Shop Mode. Matched on the automation's
    # `id:` attribute, NOT its entity_id — entity_ids are slugified from the
    # alias and several aliases here contain "•"/"–", which makes them fragile.
    # Anything not listed (including automations with no `id:` at all, and any
    # automation added in future) is disabled by default: fail-safe.
    shop_keep_ids:
      # Shop Mode's own control surface — disabling these would strand the van
      # in lockdown with no way to toggle back out.
      - shop_mode_on_actions
      - shop_mode_off_restore
      - shop_mode_guard
      - shop_mode_reassert_on_start
      # Battery / BMS monitoring — you asked to keep watching the pack remotely.
      - bms_ble_reload_after_boot
      - bms_ble_runtime_recovery
      # GPS position feed: know where the van is. The trip/stop RECORDERS
      # (starlink_filtered_start_move / _stop_move, live_trip_*, wican_*) are
      # deliberately NOT here — that's what keeps the shop's test drives out of
      # your fuel + VE data.
      - starlink_bootstrap_if_missing
      - starlink_filtered_while_moving
      - keep_home_zone_on_starlink
      # Daemons + proxies that back the GPS feed and remote access.
      - daemons_liveness_watchdog
      - syncthing_start_on_boot
      - osrm_proxy_start_on_boot
      - gps_ublox_start_on_boot
      - gps_filter_start_on_boot
      - dvr_proxy_start_on_boot
      # Starlink stays powered, so let its auto-recovery keep healing the link —
      # otherwise a PoE latch-up mid-visit locks you out of the van entirely.
      - starlink_auto_recover
      - starlink_recovery_reset
      - starlink_recovery_resume_after_restart
      # Notify-only, touches no hardware. Weather at the van still matters.
      - nws_severe_alert_notify
      # Shoe dryer cleanup: kept armed so the timer.cancel in step 0 below
      # (and any dryer timer that somehow ends during Shop Mode) still turns
      # the blower off and restores the climate — and so stop_actions can't
      # kill that cleanup mid-flight.
      - shoe_dryer_auto_off
  sequence:
    # ── 0. End any running shoe dry first ──────────────────────────────
    # timer.cancel → shoe_dryer_auto_off (still armed, and on the keep list
    # above) turns the blower off and restores the climate snapshot BEFORE
    # the lockdown decides the heater's fate. Cancelling an idle timer is a
    # no-op — it fires no event.
    - action: timer.cancel
      target:
        entity_id: timer.shoe_dryer

    # ── 1. Disable every automation except the allowlist ───────────────
    # stop_actions: true also kills any sequence mid-flight (e.g. a running
    # bed-lift 30 s timer or a Starlink power-cycle delay).
    - action: automation.turn_off
      data:
        stop_actions: true
      target:
        # selectattr('state', 'in', ['on','off']) skips orphaned entity-registry
        # ghosts. This HA instance carries 22 of them — automations long since
        # deleted from automations.yaml whose registry entries survive and report
        # `unavailable`. Targeting them is harmless (verified: the service returns
        # 200 and no-ops) but it triples the apparent size of the disable list and
        # makes the logbook unreadable. Only real, loaded automations are touched.
        entity_id: >-
          {% set keep = states.automation
               | selectattr('attributes.id', 'defined')
               | selectattr('attributes.id', 'in', shop_keep_ids)
               | map(attribute='entity_id') | list %}
          {{ states.automation
             | selectattr('state', 'in', ['on', 'off'])
             | map(attribute='entity_id')
             | reject('in', keep) | list }}

    # ── 2. Gas and heat — closed first, they matter most around hot work ──
    # switch24 is the heater ENABLE; switch32 is its power supply. Killing only
    # the enable leaves the diesel heater energised, which is exactly the wrong
    # state if anyone puts a grinder or a torch near it.
    # Switch32 (the supply) is NOT cut here. The a32_pro refuses to drop it
    # while Switch24 is on or within 180 s of the heater last running — that is
    # the Espar purge cycle, and cutting power early cokes the burner. Doing
    # both in one call just gets "Cannot turn off hydronic heater power supply
    # yet!" in the ESP log and silently leaves the supply live (observed
    # 2026-08-21). It is cut at the end of this script instead, after the
    # interlock has expired.
    # The hydronic PID climate lives ON the a32_pro and re-lights the heater by
    # itself whenever it is in `heat` and the supply is live — its on_state
    # handler re-evaluates on every temperature sample. Left in heat, the ESP
    # and the guard automation fight over the burner for the ~3 min until step
    # 10 cuts the supply: repeated aborted starts, the worst thing you can do to
    # an Espar. Deliberately NOT restored on disarm (same rule as the heater
    # enable: heat comes back by hand).
    - action: climate.set_hvac_mode
      target:
        entity_id: climate.a32_pro_van_hydronic_heating_pid
      data:
        hvac_mode: "off"
    - action: switch.turn_off
      target:
        entity_id:
          - switch.a32_pro_switch16_lpg_valve
          - switch.a32_pro_switch24_hydronic_heater

    # ── 3. Anything that can MOVE or spray ────────────────────────────
    # Bed lift (a mechanic's head is in that space), air compressor, grey
    # water dump valve, roof fan + its lid — a lid left open is a torn lid if
    # they put it on a lift or through a low door.
    #
    # switch07/08 are the bed motor's actual up/down commands. Cutting switch27
    # (the supply) should already make them inert, but a dead-man's belt costs
    # nothing and this is the one item in the van that can crush someone.
    - action: switch.turn_off
      target:
        entity_id:
          - switch.a32_pro_switch27_bed_power_supply
          - switch.a32_pro_switch07_bed_up
          - switch.a32_pro_switch08_bed_down
          - switch.a32_pro_switch28_compressor
          - switch.a32_pro_switch06_grey_water_tank_valve
          - switch.ag_pro_ceiling_fan_mode
    - action: fan.turn_off
      target:
        entity_id: fan.ag_pro_roof_fan
    - action: cover.close_cover
      target:
        entity_id: cover.ag_pro_roof_fan_lid

    # ── 4. Water — pumps, valves and both naming schemes ──────────────
    # The a32_pro exposes most relays twice: a friendly alias
    # (water_system_state_main) and the raw channel (switch11_...). They are
    # separate entities, so turning off only the alias can leave the raw
    # channel reporting on. Both are listed deliberately.
    # water_system_state_main / _recirculating_shower / _..._flush are NOT here.
    # They are derived template switches (`lambda: last_water_state == N`) with a
    # turn_on_action and no turn_off_action, so turning them off is a silent
    # no-op — they report the remembered MODE, not whether water is flowing.
    # The master switch's turn_off_action is what actually drops the system, and
    # the raw switch10-13 channels below are the real relays.
    - action: switch.turn_off
      target:
        entity_id:
          - switch.a32_pro_water_system_master_switch
          - switch.a32_pro_switch29_shower_system_water_pump
          - switch.a32_pro_switch30_main_system_water_pump
          - switch.a32_pro_switch10_water_system_overall
          - switch.a32_pro_switch11_water_system_state_main
          - switch.a32_pro_switch12_water_system_state_recirculating_shower
          - switch.a32_pro_switch13_water_system_state_recirculating_shower_flush
          - switch.a32_pro_switch01_water_system_valve_1
          - switch.a32_pro_switch02_water_system_valve_2
          - switch.a32_pro_switch03_water_system_valve_3
          - switch.a32_pro_switch14_uv_filter

    # ── 5. Tank heating pads ──────────────────────────────────────────
    # Resistive heat left running in a shop is both a power drain and a heat
    # source nobody there is expecting.
    #
    # switch.a32_pro_battery_heater_enable and do8_switch05_battery_heater are
    # deliberately NOT here. That heater is what stops the LiFePO4 pack being
    # charged below freezing, and silently disabling a battery protection
    # device for a shop visit is not a call this script should make.
    - action: switch.turn_off
      target:
        entity_id:
          - switch.a32_pro_switch17_silicone_heating_pads_shower_water_tank_x2
          - switch.a32_pro_switch18_silicone_heating_pads_fresh_water_tank_x4
          - switch.a32_pro_switch19_silicone_heating_pads_grey_water_tank_x4
          - switch.a32_pro_switch20_heating_pads_auto_thermostat_grey_water_tank_x2
          - switch.a32_pro_fresh_water_tank_heater_enable
          - switch.a32_pro_grey_water_tank_heater_enable
          - switch.a32_pro_shower_water_tank_heater_enable

    # ── 6. Charging, screens + galley ventilation ─────────────────────
    - action: switch.turn_off
      target:
        entity_id:
          - switch.a32_pro_do8_switch04_shore_power_charger
          - switch.a32_pro_do8_switch06_top_monitor
          - switch.a32_pro_do8_switch07_bottom_monitor
          - switch.a32_pro_do8_switch08_air_fryer_ventilation_fans
          - switch.a32_pro_air_fryer_ventilation_enable

    # ── 7. All lighting, inside and out ───────────────────────────────
    - action: switch.turn_off
      target:
        entity_id:
          - switch.a32_pro_switch21_left_outdoor_lights
          - switch.a32_pro_switch22_right_outdoor_lights
          - switch.a32_pro_switch23_rear_outdoor_lights
          - switch.a32_pro_switch31_lightbar
          - switch.a32_pro_switch09_shower_button_led
    # light.0xa4c138fd668411cd is the battery vent fan (a `light` entity, not a
    # `fan` one) — the Ready-to-Drive guard already treats it as a hard offender.
    # a32_pro_dac_0/1 are the analogue dimmer outputs.
    - action: light.turn_off
      target:
        entity_id:
          - light.led_controller_cct_1
          - light.led_controller_cct_2
          - light.led_controller_sc_1
          - light.led_controller_sc_2
          - light.main_lighting_switch
          - light.under_cabinet_lighting_switch
          - light.a32_pro_a32_pro_dac_0
          - light.a32_pro_a32_pro_dac_1
          - light.0xa4c138fd668411cd

    # ── 8. Inverter off, and LOCKED off ───────────────────────────────
    # The manual lock is what stops script.inverter_ensure_on from quietly
    # bringing 120 V back up if anything calls it.
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.inverter_manual_lock
    - action: script.inverter_ensure_off

    # ── 9. Clear the comfort modes so exit starts from a clean slate ──
    # Safe to force here: their on/off handler automations are already disabled
    # by step 1, so none of these fire a wind-down or a restore.
    - action: input_boolean.turn_off
      target:
        entity_id:
          - input_boolean.shower_mode
          - input_boolean.sleep_mode
          - input_boolean.sleep_winddown_complete
          - input_boolean.hot_water_mode
          - input_boolean.shore_power_charger_enabled
          - input_boolean.rtd_guard_override
          - input_boolean.speedtest_running

    # ── 10. Hydronic heater power supply — deferred cut ──────────────
    # Runs last because it has to outwait the a32_pro's 180 s purge interlock
    # (see step 2). Everything else is already locked down by this point, so the
    # wait costs nothing. Only entered if the supply is actually still live, so
    # a heater that has been cold for a while is cut in step 2's slipstream and
    # this is skipped entirely.
    - if:
        - condition: state
          entity_id: switch.a32_pro_switch32_hydronic_heater_power_supply
          state: "on"
      then:
        - delay: "00:03:05"
        # Re-check Shop Mode: disarming during the wait must NOT then cut heater
        # power out from under someone who has already taken the van back.
        - if:
            - condition: state
              entity_id: input_boolean.shop_mode
              state: "on"
          then:
            - action: switch.turn_off
              target:
                entity_id: switch.a32_pro_switch32_hydronic_heater_power_supply

    # NOTE: switch.a32_pro_switch26_starlink_power_supply is intentionally left
    # ON — it's what keeps HA reachable from outside the van. ~40-50 W.

########################################################################
#  Shop Mode – convenience wrappers                                    #
########################################################################
# Prefer toggling input_boolean.shop_mode (dashboard / voice); these exist so
# the mode can also be driven from a script call or a button card.
shop_mode_enter:
  alias: "Shop Mode – Arm"
  mode: single
  sequence:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.shop_mode

shop_mode_exit:
  alias: "Shop Mode – Disarm"
  mode: single
  sequence:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.shop_mode

########################################################################
#  Shoe Dryer – run the coolant blower for a set time, then auto-off   #
########################################################################
# The blower (light.a32_pro_a32_pro_dac_0) is normally owned by the hydronic
# PID climate: its on_state re-asserts blower_active (= Auto mode) every ~10 s
# whenever the climate is not OFF, which silently overrides any manual
# brightness. So the climate MUST be off for a manual run to stick. The prior
# climate state is captured in input_boolean.shoe_dryer_resume_heat +
# input_number.shoe_dryer_prev_setpoint — restart-proof, unlike a scene.create
# snapshot — and put back by shoe_dryer_auto_off, so a running heat cycle only
# pauses.
shoe_dryer_start:
  alias: "Shoe Dryer • start"
  description: >-
    Pause hydronic heating, run the coolant blower at 100%, and start
    timer.shoe_dryer. duration_seconds overrides the dashboard duration
    (input_number.shoe_dryer_minutes) — used for testing.
  mode: restart
  fields:
    duration_seconds:
      description: "Run time in seconds (default: input_number.shoe_dryer_minutes)"
      required: false
      example: 1200
  sequence:
    # Shop Mode's guard automation force-kills this blower within seconds —
    # starting under it would just flap. The dashboard card greys out too.
    - condition: state
      entity_id: input_boolean.shop_mode
      state: "off"
    # Snapshot the climate only when starting fresh — a re-tap mid-dry would
    # otherwise capture the "off" WE set and lose the real prior state.
    - if:
        - condition: state
          entity_id: timer.shoe_dryer
          state: idle
      then:
        - action: input_number.set_value
          target:
            entity_id: input_number.shoe_dryer_prev_setpoint
          data:
            value: >-
              {{ state_attr('climate.a32_pro_van_hydronic_heating_pid', 'temperature') | float(21) }}
        - if:
            - condition: state
              entity_id: climate.a32_pro_van_hydronic_heating_pid
              state: heat
          then:
            - action: input_boolean.turn_on
              target:
                entity_id: input_boolean.shoe_dryer_resume_heat
          else:
            - action: input_boolean.turn_off
              target:
                entity_id: input_boolean.shoe_dryer_resume_heat
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.shoe_dryer_active
    # The timer starts BEFORE the climate is touched: the moment it goes
    # `active` the idle-guard above is closed, so a double-tap can't
    # re-snapshot the climate we just turned off (and the dashboard card
    # flips to the countdown immediately).
    - action: timer.start
      target:
        entity_id: timer.shoe_dryer
      data:
        duration: >-
          {{ duration_seconds | default((states('input_number.shoe_dryer_minutes') | float(30)) * 60) | int }}
    # Order matters: climate off FIRST (stops the ~10 s blower_active stomp),
    # then flip the mode switch to Manual so the change is instant.
    - action: climate.set_hvac_mode
      target:
        entity_id: climate.a32_pro_van_hydronic_heating_pid
      data:
        hvac_mode: "off"
    - delay: "00:00:01"
    - action: switch.turn_off
      target:
        entity_id: switch.a32_pro_coolant_blower_mode_auto_manual
    - action: light.turn_on
      target:
        entity_id: light.a32_pro_a32_pro_dac_0
      data:
        brightness_pct: 100

shoe_dryer_stop:
  alias: "Shoe Dryer • stop"
  mode: single
  sequence:
    # Cancelling fires timer.cancelled → shoe_dryer_auto_off does the real
    # shutdown + climate restore. The direct light.turn_off after it is the
    # belt-and-braces path for a stuck blower with an already-idle timer
    # (cancelling an idle timer fires nothing); harmless when both run.
    - action: timer.cancel
      target:
        entity_id: timer.shoe_dryer
    - action: light.turn_off
      target:
        entity_id: light.a32_pro_a32_pro_dac_0
      continue_on_error: true

########################################################################
#  Night Climate – actuator helpers (automations night_climate_*)      #
#  Every call is idempotent: nothing is sent when the device already  #
#  is where it should be. The roof fan and the A/C are driven by IR   #
#  and beep on every command, so that matters.                         #
########################################################################
night_climate_heater_to:
  alias: "Night Climate – heater to target"
  mode: queued
  fields:
    target:
      description: "Thermostat target (°C)"
      example: 15
  sequence:
    # Same guards as the Heater card: the a32 refuses to light the burner
    # without its supply, Shop Mode re-shuts it, the lockout blocks it.
    - condition: state
      entity_id: switch.a32_pro_switch32_hydronic_heater_power_supply
      state: "on"
    - condition: state
      entity_id: input_boolean.shop_mode
      state: "off"
    - condition: state
      entity_id: input_boolean.heater_low_fuel_lockout
      state: "off"
    - if:
        - "{{ not is_state('climate.a32_pro_van_hydronic_heating_pid', 'heat') }}"
      then:
        - action: climate.set_hvac_mode
          target:
            entity_id: climate.a32_pro_van_hydronic_heating_pid
          data:
            hvac_mode: heat
    - if:
        - >
          {{ (state_attr('climate.a32_pro_van_hydronic_heating_pid', 'temperature') | float(-99)
              - target | float) | abs >= 0.3 }}
      then:
        - action: climate.set_temperature
          target:
            entity_id: climate.a32_pro_van_hydronic_heating_pid
          data:
            temperature: "{{ target | float }}"

night_climate_fan_on:
  alias: "Night Climate – roof fan on"
  mode: queued
  fields:
    speed:
      description: "Percent, steps of 10"
      example: 30
    direction:
      description: "Intake or Exhaust"
      example: Intake
  sequence:
    - variables:
        want_dir: "{{ 'forward' if direction == 'Exhaust' else 'reverse' }}"
    # Ceiling-fan mode keeps the lid shut; the night fan is there to move
    # outside air, so leave that mode first (the firmware then opens the lid).
    - if:
        - "{{ is_state('switch.ag_pro_ceiling_fan_mode', 'on') }}"
      then:
        - action: switch.turn_off
          target:
            entity_id: switch.ag_pro_ceiling_fan_mode
    - if:
        - "{{ state_attr('fan.ag_pro_roof_fan', 'direction') != want_dir }}"
      then:
        - action: fan.set_direction
          target:
            entity_id: fan.ag_pro_roof_fan
          data:
            direction: "{{ want_dir }}"
    - if:
        - >
          {{ not is_state('fan.ag_pro_roof_fan', 'on')
             or state_attr('fan.ag_pro_roof_fan', 'percentage') | int(0) != speed | int }}
      then:
        - action: fan.turn_on
          target:
            entity_id: fan.ag_pro_roof_fan
          data:
            percentage: "{{ speed | int }}"

night_climate_ac_on:
  alias: "Night Climate – A/C on"
  mode: queued
  fields:
    target:
      description: "Cooling target (°C), clamped to the unit's 16–32"
      example: 22
  sequence:
    - variables:
        want: "{{ [16, [32, target | float | round(0) | int] | min] | max }}"
    - choose:
        # Off: one call sets cool + target; HA applies the mode first. The
        # firmware then walks the unit's own target one IR step at a time,
        # so give it a moment before asking for the quiet fan level.
        - conditions: "{{ not is_state('climate.ag_pro_24v_air_conditioner', 'cool') }}"
          sequence:
            - action: climate.set_temperature
              target:
                entity_id: climate.ag_pro_24v_air_conditioner
              data:
                hvac_mode: cool
                temperature: "{{ want }}"
            - delay: "00:00:20"
        # Already cooling: only nudge the target when it differs.
        - conditions: >
            {{ (state_attr('climate.ag_pro_24v_air_conditioner', 'temperature') | float(-99)
                - want) | abs >= 0.5 }}
          sequence:
            - action: climate.set_temperature
              target:
                entity_id: climate.ag_pro_24v_air_conditioner
              data:
                temperature: "{{ want }}"
            - delay: "00:00:10"
    - if:
        - "{{ states('number.ag_pro_24v_ac_fan_level') | float(1) != 1 }}"
      then:
        - action: number.set_value
          target:
            entity_id: number.ag_pro_24v_ac_fan_level
          data:
            value: 1

# Roof fan on its own thermostat (the remote's Auto mode): the AG Pro builds the
# frame (esphome/a8-pro.yaml, roof_fan_send_frame). The fan then runs by itself
# while the room is above the set point, lid open. One frame only when
# something differs, since every frame beeps.
night_climate_fan_auto:
  alias: "Night Climate – roof fan thermostat"
  mode: queued
  fields:
    target_c:
      description: "Room target (°C); the fan runs above it"
      example: 15
    direction:
      description: "Intake or Exhaust"
      example: Intake
    speed:
      description: "Percent, steps of 10"
      example: 30
  sequence:
    - variables:
        temp_f: "{{ [29, [99, ((target_c | float) * 9 / 5 + 32) | round(0) | int] | min] | max }}"
        exhaust: "{{ direction == 'Exhaust' }}"
        want_dir: "{{ 'forward' if direction == 'Exhaust' else 'reverse' }}"
        same_fan: >-
          {{ state_attr('fan.ag_pro_roof_fan', 'direction') == want_dir
             and state_attr('fan.ag_pro_roof_fan', 'percentage') | int(0) == speed | int }}
    - choose:
        # Already on its thermostat with this direction/speed: only the set point
        - conditions: >-
            {{ is_state('switch.ag_pro_roof_fan_thermostat', 'on') and same_fan
               and states('number.ag_pro_roof_fan_thermostat_set_point') | int(-1) != temp_f }}
          sequence:
            - action: number.set_value
              target:
                entity_id: number.ag_pro_roof_fan_thermostat_set_point
              data:
                value: "{{ temp_f }}"
        # Otherwise the full start (lid, manual start, thermostat)
        - conditions: "{{ not is_state('switch.ag_pro_roof_fan_thermostat', 'on') or not same_fan }}"
          sequence:
            - action: esphome.ag_pro_roof_fan_thermostat
              data:
                temp_f: "{{ temp_f }}"
                exhaust: "{{ exhaust }}"
                speed_pct: "{{ speed | int }}"

# Fan off and lid shut, whether it was running manually or on its thermostat.
# The lid-closed frame carries "fan off, auto off", so closing the lid is what
# ends thermostat mode; the firmware publishes the switch off when it sends it.
night_climate_fan_off:
  alias: "Night Climate – roof fan off, lid closed"
  mode: queued
  sequence:
    - variables:
        was_running: >-
          {{ is_state('fan.ag_pro_roof_fan', 'on') or is_state('cover.ag_pro_roof_fan_lid', 'open')
             or is_state('switch.ag_pro_roof_fan_thermostat', 'on') }}
    - if:
        - "{{ is_state('fan.ag_pro_roof_fan', 'on') }}"
      then:
        - action: fan.turn_off
          target:
            entity_id: fan.ag_pro_roof_fan
        - delay: "00:00:01"
    - if:
        - >
          {{ is_state('cover.ag_pro_roof_fan_lid', 'open')
             or is_state('switch.ag_pro_roof_fan_thermostat', 'on') }}
      then:
        - action: cover.close_cover
          target:
            entity_id: cover.ag_pro_roof_fan_lid
    # One-way IR: send "off, lid closed" a second time. On 2026-09-18 the single
    # frame was missed and the lid stayed open in auto all through the warm-up.
    # Only when this call actually switched something off, so a tick that finds
    # everything off already stays silent (every frame is a beep).
    - if:
        - >
          {{ was_running and states.button.ag_pro_roof_fan_force_off is not none
             and not is_state('button.ag_pro_roof_fan_force_off', 'unavailable') }}
      then:
        - delay: "00:00:03"
        - action: button.press
          target:
            entity_id: button.ag_pro_roof_fan_force_off

# A/C off, but never blind. Its power command is an IR TOGGLE: sent to a unit
# that is really off it switches it ON (2026-09-18, at its 26 °C default, because
# the belief said "cooling" for two hours on a unit that never started). If the
# unit has shown "cool" for 3 min and drawn nothing for 3 min it is off whatever
# the entity says; the AG Pro corrects its belief by itself within a minute or two.
night_climate_ac_off:
  alias: "Night Climate – A/C off"
  mode: queued
  sequence:
    - condition: template
      value_template: "{{ states('climate.ag_pro_24v_air_conditioner') not in ['off', 'unavailable', 'unknown'] }}"
    - if:
        - >
          {% set p = states.binary_sensor.ag_pro_24v_ac_power_detected %}
          {{ p is not none and p.state == 'off'
             and (now() - p.last_changed).total_seconds() > 180
             and (now() - states.climate.ag_pro_24v_air_conditioner.last_changed).total_seconds() > 180 }}
      then:
        - action: system_log.write
          data:
            level: warning
            logger: night_climate
            message: "A/C shows cooling but has drawn no power for 3 min: not sending the off toggle (it would switch the unit on)"
      else:
        - action: climate.set_hvac_mode
          target:
            entity_id: climate.ag_pro_24v_air_conditioner
          data:
            hvac_mode: "off"

night_climate_actuators_off:
  alias: "Night Climate – roof fan and A/C off"
  mode: queued
  sequence:
    - action: script.night_climate_fan_off
    - action: script.night_climate_ac_off

# The Off button on the Van page's Living Space card: whatever heats or cools
# the living space off, however it was started. Choosing Off on the mode alone
# does nothing once the mode already reads Off (no state change, so
# night_climate_mode_off never runs) and never reaches an A/C or heater started
# from its own card: on 2026-09-21 five taps on Off left a hand-started A/C
# running. Unlike the program's own end at the wake time, this turns the heater
# off too, because a person asked for everything off. The fan and A/C scripts
# only send when their appliance is on, so a second tap is silent.
living_space_off:
  alias: "Living Space – everything off"
  mode: single
  max_exceeded: silent
  sequence:
    - if:
        - "{{ not is_state('input_select.night_climate_mode', 'Off') }}"
      then:
        - action: input_select.select_option
          target:
            entity_id: input_select.night_climate_mode
          data:
            option: "Off"
    # No IR here, so it goes first; the fan and A/C frames take a few seconds.
    - if:
        - "{{ is_state('climate.a32_pro_van_hydronic_heating_pid', 'heat') }}"
      then:
        - action: climate.set_hvac_mode
          target:
            entity_id: climate.a32_pro_van_hydronic_heating_pid
          data:
            hvac_mode: "off"
    # night_climate_mode_off runs the same script when the mode changes above;
    # it is queued, and the second pass finds everything off and sends nothing.
    - action: script.night_climate_actuators_off
